name: Construct qualified drafts

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Qualification source mode
        required: true
        type: choice
        options:
          - normal
          - rescue
      a_tag:
        description: Source release A tag
        required: true
        type: string
      a_sequence:
        description: Source release A sequence
        required: true
        type: number
      b_tag:
        description: Higher release B tag
        required: true
        type: string
      b_sequence:
        description: Higher release B sequence
        required: true
        type: number
      failed_normal_run_id:
        description: Required only for rescue
        required: false
        type: string
      defect_issue_url:
        description: Required only for rescue
        required: false
        type: string

permissions: {}

concurrency:
  group: installer-updater-release
  cancel-in-progress: false

env:
  ARCHIVE_TAG: archive/full-product-v1.0.15
  CHECKLIST: docs/acceptance/installer-updater-vps.md

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: read
      contents: read
    outputs:
      build_releases: ${{ steps.preflight.outputs.build_releases }}
      source_a: ${{ steps.preflight.outputs.source_a }}
      source_state: ${{ steps.preflight.outputs.source_state }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Verify source state and unused release authority
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          A_TAG: ${{ inputs.a_tag }}
          A_SEQUENCE: ${{ inputs.a_sequence }}
          B_TAG: ${{ inputs.b_tag }}
          B_SEQUENCE: ${{ inputs.b_sequence }}
          FAILED_RUN: ${{ inputs.failed_normal_run_id }}
          DEFECT_URL: ${{ inputs.defect_issue_url }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --slurp | jq 'add' > releases.json
          printf '[]' > release-facts.json
          while read -r release; do
            assets="$(jq -cS '[.assets[] | {digest:((.digest // "") | sub("^sha256:";"")),id,name,size}] | sort_by(.name)' <<<"$release")"
            index_asset_id="$(jq -r '.assets[] | select(.name == "release-index.json") | .id' <<<"$release")"
            index=null
            sequence=null
            if test -n "$index_asset_id"; then
              gh api "repos/$GITHUB_REPOSITORY/releases/assets/$index_asset_id" -H 'Accept: application/octet-stream' > existing-index.json
              if jq -e '(.sequence | type) == "number" and .sequence > 0 and .sequence == floor' existing-index.json >/dev/null 2>&1; then
                sequence="$(jq -c .sequence existing-index.json)"
              fi
              if jq -e '(.repository | type) == "string" and (.tag | type) == "string" and (.commit | type) == "string" and (.sequence | type) == "number" and .sequence > 0 and .sequence == floor' existing-index.json >/dev/null 2>&1; then
                index="$(jq -cS --arg sha256 "$(sha256sum existing-index.json | cut -d' ' -f1)" '{commit,repository,sequence,sha256:$sha256,tag}' existing-index.json)"
              fi
            fi
            fact="$(jq -cnS --argjson assets "$assets" --arg body "$(jq -r '.body // ""' <<<"$release")" --arg commit "$(jq -r .target_commitish <<<"$release")" --argjson draft "$(jq .draft <<<"$release")" --argjson id "$(jq .id <<<"$release")" --argjson immutable "$(jq '.immutable // false' <<<"$release")" --argjson index "$index" --argjson prerelease "$(jq .prerelease <<<"$release")" --argjson sequence "$sequence" --arg tag "$(jq -r .tag_name <<<"$release")" '{assets:$assets,body:$body,commit:$commit,draft:$draft,id:$id,immutable:$immutable,index:$index,prerelease:$prerelease,sequence:$sequence,tag:$tag}')"
            jq -cS --argjson fact "$fact" '. + [$fact] | sort_by(.id)' release-facts.json > release-facts.next
            mv release-facts.next release-facts.json
          done < <(jq -c '.[]' releases.json)
          burned="$(for burned_tag in $(git tag --list 'release-burned/*'); do git tag -l --format='%(contents)' "$burned_tag"; done | jq -cS -s 'sort_by(.original_tag)')"
          latest_tag=null
          if gh api "repos/$GITHUB_REPOSITORY/releases/latest" > latest.json 2>/dev/null; then
            latest_tag="$(jq -c .tag_name latest.json)"
          fi
          tags="$(for tag in "$A_TAG" "$B_TAG"; do if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then printf '%s\n' "$tag"; fi; done | jq -Rsc 'split("\n") | map(select(length > 0)) | sort')"
          defect_issue=null
          failed_normal_run=null
          if test "$MODE" = rescue; then
            gh api "repos/$GITHUB_REPOSITORY/issues/${DEFECT_URL##*/}" > defect-issue.json
            defect_issue="$(jq -cS '{is_pull_request:has("pull_request"),state,url:.html_url}' defect-issue.json)"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_RUN" > failed-normal-run.json
            failed_normal_run="$(jq -cS '{conclusion:(.conclusion // ""),id:(.id | tostring),mode:(.inputs.mode // ""),path}' failed-normal-run.json)"
          fi
          failed_normal_run_id=null
          defect_issue_url=null
          if test -n "$FAILED_RUN"; then failed_normal_run_id="$(jq -cn --arg value "$FAILED_RUN" '$value')"; fi
          if test -n "$DEFECT_URL"; then defect_issue_url="$(jq -cn --arg value "$DEFECT_URL" '$value')"; fi
          jq -cnS \
            --arg archive_commit "$(git rev-parse "$ARCHIVE_TAG^{commit}")" \
            --arg archive_remote_commit "$(git ls-remote --tags origin "refs/tags/$ARCHIVE_TAG^{}" | cut -f1)" \
            --arg archive_remote_tag_object "$(git ls-remote --tags origin "refs/tags/$ARCHIVE_TAG" | cut -f1)" \
            --arg archive_tag_object "$(git rev-parse "$ARCHIVE_TAG")" \
            --arg archive_type "$(git cat-file -t "$ARCHIVE_TAG")" \
            --argjson burned_identities "$burned" \
            --argjson a_sequence "$A_SEQUENCE" --arg a_tag "$A_TAG" --argjson b_sequence "$B_SEQUENCE" --arg b_tag "$B_TAG" --argjson defect_issue_url "$defect_issue_url" --argjson failed_normal_run_id "$failed_normal_run_id" --arg mode "$MODE" \
            --arg checklist_sha256 "$(sha256sum "$CHECKLIST" | cut -d' ' -f1)" --arg commit "$(git rev-parse HEAD)" --argjson defect_issue "$defect_issue" --argjson failed_normal_run "$failed_normal_run" --argjson latest_tag "$latest_tag" --argjson releases "$(cat release-facts.json)" --arg remote_main "$(git rev-parse origin/main)" --argjson tags "$tags" \
            '{archive_commit:$archive_commit,archive_remote_commit:$archive_remote_commit,archive_remote_tag_object:$archive_remote_tag_object,archive_tag_object:$archive_tag_object,archive_type:$archive_type,burned_identities:$burned_identities,candidate:{a_sequence:$a_sequence,a_tag:$a_tag,b_sequence:$b_sequence,b_tag:$b_tag,defect_issue_url:$defect_issue_url,failed_normal_run_id:$failed_normal_run_id,mode:$mode},checklist_sha256:$checklist_sha256,commit:$commit,defect_issue:$defect_issue,failed_normal_run:$failed_normal_run,latest_tag:$latest_tag,releases:$releases,remote_main:$remote_main,schema:"sbxr-release-qualification-facts-v1",stage:"candidate-preflight",tags:$tags}' | tr -d '\n' > candidate-preflight-facts.json
          go run ./cmd/sbxr-release qualification < candidate-preflight-facts.json > candidate-preflight-decision.json
          facts_sha256="$(sha256sum candidate-preflight-facts.json | cut -d' ' -f1)"
          jq -e --arg facts_sha256 "$facts_sha256" --arg mode "$MODE" --arg a_tag "$A_TAG" --argjson a_sequence "$A_SEQUENCE" --arg b_tag "$B_TAG" --argjson b_sequence "$B_SEQUENCE" '
            .schema == "sbxr-release-qualification-decision-v1" and .stage == "candidate-preflight" and .outcome == "accepted" and .facts_sha256 == $facts_sha256 and
            (.source_state == "initial-normal" or .source_state == "later-normal" or .source_state == "rescue") and
            all(.actions[];
              if .type == "build-release" then (keys | sort) == ["commit","sequence","tag","type"] and .commit == env.GITHUB_SHA and ((.tag == $a_tag and .sequence == $a_sequence) or (.tag == $b_tag and .sequence == $b_sequence))
              elif .type == "use-source-release" then (keys | sort) == ["assets","commit","draft","immutable","prerelease","release_id","release_identity","sequence","tag","type"] and .tag == $a_tag and .sequence == $a_sequence and (.release_id | type) == "number" and (.release_identity | keys | sort) == ["commit","release_index_sha256","repository","tag"] and .release_identity == {commit:.commit,release_index_sha256:.release_identity.release_index_sha256,repository:env.GITHUB_REPOSITORY,tag:.tag} and (.release_identity.release_index_sha256 | test("^[0-9a-f]{64}$")) and (.assets | length) == 4 and all(.assets[]; (keys | sort) == ["name","sha256","size"] and (.sha256 | test("^[0-9a-f]{64}$")) and .size > 0)
              else false end) and
            (if .source_state == "initial-normal" then $mode == "normal" and [.actions[].type] == ["build-release","build-release"] else (.source_state == "rescue") == ($mode == "rescue") and [.actions[].type] == ["use-source-release","build-release"] end)' candidate-preflight-decision.json >/dev/null
          build_releases="$(jq -c '[.actions[] | select(.type == "build-release") | {tag,sequence}]' candidate-preflight-decision.json)"
          source_state="$(jq -r .source_state candidate-preflight-decision.json)"
          source_a='{}'
          if jq -e '.actions[] | select(.type == "use-source-release")' candidate-preflight-decision.json > source-action.json; then
            release_id="$(jq -r .release_id source-action.json)"
            gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > source-a-release.json
            jq -e --argjson action "$(cat source-action.json)" '.id == $action.release_id and .tag_name == $action.tag and .target_commitish == $action.commit and .draft == $action.draft and .prerelease == $action.prerelease and .immutable == $action.immutable and (.assets | length) == 4' source-a-release.json >/dev/null
            mkdir -m 0700 source-a
            while read -r expected; do
              name="$(jq -r .name <<<"$expected")"
              id="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .id' source-a-release.json)"
              gh api "repos/$GITHUB_REPOSITORY/releases/assets/$id" -H 'Accept: application/octet-stream' > "source-a/$name"
              test "$(stat -c %s "source-a/$name")" -eq "$(jq -r .size <<<"$expected")"
              test "$(sha256sum "source-a/$name" | cut -d' ' -f1)" = "$(jq -r .sha256 <<<"$expected")"
            done < <(jq -c '.assets[]' source-action.json)
            jq -e --argjson action "$(cat source-action.json)" '.repository == env.GITHUB_REPOSITORY and .tag == $action.tag and .commit == $action.commit and .sequence == $action.sequence' source-a/release-index.json >/dev/null
            source_a="$(jq -c '{assets,commit,release_id,release_identity,sequence,tag}' source-action.json)"
          fi
          echo "source_state=$source_state" >> "$GITHUB_OUTPUT"
          echo "build_releases=$build_releases" >> "$GITHUB_OUTPUT"
          echo "source_a=$source_a" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-preflight-decision-chain
          path: |
            candidate-preflight-facts.json
            candidate-preflight-decision.json
          if-no-files-found: error
          retention-days: 1

  build:
    needs: preflight
    strategy:
      fail-fast: true
      matrix:
        release: ${{ fromJSON(needs.preflight.outputs.build_releases) }}
        architecture: [amd64, arm64]
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - name: Build and natively verify the exact four-asset set
        env:
          TAG: ${{ matrix.release.tag }}
          SEQUENCE: ${{ matrix.release.sequence }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          mkdir -m 0700 release evidence
          for target in amd64 arm64; do
            go run ./cmd/sbxr-release -tag "$TAG" -commit "$GITHUB_SHA" -sequence "$SEQUENCE" -architecture "$target" -output "release/sbxr-linux-$target.tar.gz"
          done
          amd64_sha256="$(tar -xOzf release/sbxr-linux-amd64.tar.gz sbxr | sha256sum | cut -d' ' -f1)"
          arm64_sha256="$(tar -xOzf release/sbxr-linux-arm64.tar.gz sbxr | sha256sum | cut -d' ' -f1)"
          go run ./cmd/sbxr-release bootstrap -version "${TAG#v}" -tag "$TAG" -commit "$GITHUB_SHA" -sequence "$SEQUENCE" -amd64-executable-sha256 "$amd64_sha256" -arm64-executable-sha256 "$arm64_sha256" -output release/install.sh
          go run ./cmd/sbxr-release index -tag "$TAG" -commit "$GITHUB_SHA" -sequence "$SEQUENCE" -directory release -output release/release-index.json
          test "$(find release -maxdepth 1 -type f -printf '%f\n' | sort)" = "$(printf '%s\n' install.sh release-index.json sbxr-linux-amd64.tar.gz sbxr-linux-arm64.tar.gz | sort)"
          go run ./cmd/sbxr-release verify-package -directory release -architecture "$ARCHITECTURE"
          mkdir -m 0700 inspect
          tar -xzf "release/sbxr-linux-$ARCHITECTURE.tar.gz" -C inspect
          machine="$(readelf -h inspect/sbxr | sed -n 's/^  Machine: *//p')"
          case "$ARCHITECTURE" in
            amd64) test "$machine" = 'Advanced Micro Devices X86-64' ;;
            arm64) test "$machine" = AArch64 ;;
          esac
          if inspect/sbxr >non-root.out 2>non-root.err; then
            exit 1
          fi
          test ! -s non-root.out
          grep -Fx 'SBXR requires root authority.' non-root.err
          printf '0\n' | script -qec "sudo env TERM=xterm-256color LANG=C.UTF-8 '$PWD/inspect/sbxr'" menu.transcript
          grep -F 'Recovery required' menu.transcript
          grep -F 'Start recovery' menu.transcript
          secret_pattern='SBXR_USER_TOKEN_MARKER_00000000000000abcd|CLOUDFLARE-ROTATED-RUN-TOKEN-MARKER|profile-secret-marker|subscription-secret-marker|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|Authorization: Bearer '
          if grep -aERq "$secret_pattern" release inspect non-root.out non-root.err menu.transcript; then
            exit 1
          elif test $? -ne 1; then
            exit 1
          fi
          assets="$(for name in install.sh release-index.json sbxr-linux-amd64.tar.gz sbxr-linux-arm64.tar.gz; do jq -cn --arg name "$name" --arg sha256 "$(sha256sum "release/$name" | cut -d' ' -f1)" '{name:$name,sha256:$sha256}'; done | jq -s .)"
          jq -cn --arg tag "$TAG" --argjson sequence "$SEQUENCE" --arg architecture "$ARCHITECTURE" --arg runner '${{ matrix.runner }}' --argjson assets "$assets" '{tag:$tag,sequence:$sequence,architecture:$architecture,runner:$runner,assets:$assets}' > "evidence/native-$ARCHITECTURE.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-${{ matrix.release.tag }}-${{ matrix.architecture }}
          path: |
            release
            evidence
          if-no-files-found: error
          retention-days: 1

  drafts:
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-*
          path: native
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: candidate-preflight-decision-chain
      - name: Execute and verify the canonical draft decision chain
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RELEASES: ${{ needs.preflight.outputs.build_releases }}
          SOURCE_A: ${{ needs.preflight.outputs.source_a }}
        run: |
          set -euo pipefail
          mkdir -m 0700 constructed downloaded
          jq -cn --argjson source "$SOURCE_A" 'if $source == {} then [] else [$source] end' > drafts.json
          current_tag=''
          cleanup_unsigned_drafts() {
            status=$?
            trap - EXIT
            test "$status" -ne 0 || return 0
            if test -n "$current_tag" && jq -e --arg tag "$current_tag" --arg sha "$GITHUB_SHA" '.tag_name == $tag and .target_commitish == $sha and .draft == true and .prerelease == false and (.id | type == "number")' release.json >/dev/null 2>&1 && ! jq -e --arg tag "$current_tag" '.[] | select(.tag == $tag)' drafts.json >/dev/null; then
              jq --arg tag "$current_tag" --argjson sequence "$current_sequence" --argjson release_id "$(jq .id release.json)" --arg index_sha256 "$current_index_sha256" --argjson assets "$current_assets" '. += [{tag:$tag,sequence:$sequence,commit:env.GITHUB_SHA,release_id:$release_id,release_identity:{repository:env.GITHUB_REPOSITORY,tag:$tag,commit:env.GITHUB_SHA,release_index_sha256:$index_sha256},assets:$assets}]' drafts.json > drafts.next
              mv drafts.next drafts.json
            fi

            printf '[]' > failure-observations.json
            while read -r requested; do
              tag="$(jq -r .tag <<<"$requested")"
              entry="$(jq -c --arg tag "$tag" '.[] | select(.tag == $tag)' drafts.json)"
              test -n "$entry" || continue
              commit="$(jq -r .commit <<<"$entry")"
              printf '%s\n' "$entry" > "$tag.cleanup.json"
              .github/scripts/recheck-qualified-release.sh "$tag.cleanup.json" "cleanup/$tag" "$tag.cleanup-release.json" partial
              jq -e '.draft == true and .prerelease == false' "$tag.cleanup-release.json" >/dev/null
              tag_commit=null
              if object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha 2>/dev/null)"; then test "$object" = "$commit"; tag_commit="$(jq -cn --arg commit "$object" '$commit')"; fi
              observation="$(jq -cnS --argjson expected "$entry" --slurpfile release "$tag.cleanup-release.json" --argjson tag_commit "$tag_commit" '{assets:[$release[0].assets[].name as $name | $expected.assets[] | select(.name == $name)],body:$release[0].body,commit:$expected.commit,created_release_id:$expected.release_id,draft:$release[0].draft,immutable:($release[0].immutable // false),prerelease:$release[0].prerelease,release_id:$expected.release_id,release_identity:$expected.release_identity,release_present:true,sequence:$expected.sequence,tag:$expected.tag,tag_commit:$tag_commit}')"
              jq -cS --argjson observation "$observation" '. + [$observation]' failure-observations.json > failure-observations.next
              mv failure-observations.next failure-observations.json
            done < <(jq -c '.[]' <<<"$BUILD_RELEASES")

            jq -cnS --slurpfile construction_decision candidate-draft-construction-decision.json --slurpfile construction_facts candidate-draft-construction-facts.json --slurpfile observations failure-observations.json --arg observed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg prior_decision_sha256 "$(sha256sum candidate-draft-construction-decision.json | cut -d' ' -f1)" --arg commit "$GITHUB_SHA" --arg path '.github/workflows/candidate.yml' --arg ref "$GITHUB_WORKFLOW_REF" --arg run_id "$GITHUB_RUN_ID" --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{burned_identities:$construction_facts[0].preflight_facts.burned_identities,candidate_failure_state:null,construction_decision:$construction_decision[0],construction_facts:$construction_facts[0],observations:$observations[0],observed_at:$observed_at,prior_decision_sha256:$prior_decision_sha256,qualification_boundary_facts:null,qualification_manifest:null,reason:"pre-boundary-failure",schema:"sbxr-release-qualification-facts-v1",stage:"candidate-failure-finalization",workflow:{commit:$commit,path:$path,ref:$ref,run_id:$run_id,run_url:$run_url}}' | tr -d '\n' > candidate-failure-facts.json
            go run ./cmd/sbxr-release qualification < candidate-failure-facts.json > candidate-failure-decision.json
            facts_sha256="$(sha256sum candidate-failure-facts.json | cut -d' ' -f1)"
            jq -e --arg facts_sha256 "$facts_sha256" --arg prior_decision_sha256 "$(sha256sum candidate-draft-construction-decision.json | cut -d' ' -f1)" '.schema == "sbxr-release-qualification-decision-v1" and .stage == "candidate-failure-finalization" and .outcome == "cleanup" and .facts_sha256 == $facts_sha256 and .prior_decision_sha256 == $prior_decision_sha256 and all(.actions[]; .type == "cleanup-draft" and .facts_sha256 == $facts_sha256 and .prior_decision_sha256 == $prior_decision_sha256)' candidate-failure-decision.json >/dev/null
            while read -r action; do
              tag="$(jq -r .tag <<<"$action")"
              release_id="$(jq -r .release_id <<<"$action")"
              commit="$(jq -r .commit <<<"$action")"
              if jq -e .delete_release <<<"$action" >/dev/null; then
                jq -e --arg tag "$tag" --arg commit "$commit" --argjson release_id "$release_id" '.tag_name == $tag and .target_commitish == $commit and .id == $release_id and .draft == true and .prerelease == false' "$tag.cleanup-release.json" >/dev/null
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id"
              fi
              if jq -e .delete_tag <<<"$action" >/dev/null; then
                test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)" = "$commit"
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag"
              fi
            done < <(jq -c '.actions[]' candidate-failure-decision.json)
            printf '[]' > candidate-failure-verified-observations.json
            while read -r action; do
              tag="$(jq -r .tag <<<"$action")"
              release_id="$(jq -r .release_id <<<"$action")"
              ! gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" >/dev/null 2>&1
              ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1
              expected="$(jq -c --arg tag "$tag" '.observations[] | select(.tag == $tag)' candidate-failure-facts.json)"
              observation="$(jq -cnS --argjson expected "$expected" '{assets:[],body:"",commit:$expected.commit,created_release_id:$expected.created_release_id,draft:false,immutable:false,prerelease:false,release_id:$expected.release_id,release_identity:$expected.release_identity,release_present:false,sequence:$expected.sequence,tag:$expected.tag,tag_commit:null}')"
              jq -cS --argjson observation "$observation" '. + [$observation]' candidate-failure-verified-observations.json > candidate-failure-verified-observations.next
              mv candidate-failure-verified-observations.next candidate-failure-verified-observations.json
            done < <(jq -c '.actions[]' candidate-failure-decision.json)
            jq -cnS --slurpfile failure_decision candidate-failure-decision.json --slurpfile failure_facts candidate-failure-facts.json --slurpfile observations candidate-failure-verified-observations.json '{burned_identities:$failure_facts[0].burned_identities,failure_decision:$failure_decision[0],failure_facts:$failure_facts[0],observations:$observations[0],schema:"sbxr-release-qualification-facts-v1",stage:"candidate-failure-verification"}' | tr -d '\n' > candidate-failure-verification-facts.json
            go run ./cmd/sbxr-release qualification < candidate-failure-verification-facts.json > candidate-failure-verification-decision.json
            facts_sha256="$(sha256sum candidate-failure-verification-facts.json | cut -d' ' -f1)"
            prior_decision_sha256="$(sha256sum candidate-failure-decision.json | cut -d' ' -f1)"
            jq -e --arg facts_sha256 "$facts_sha256" --arg prior_decision_sha256 "$prior_decision_sha256" '.schema == "sbxr-release-qualification-decision-v1" and .stage == "candidate-failure-verification" and .outcome == "accepted" and .actions == [] and .facts_sha256 == $facts_sha256 and .prior_decision_sha256 == $prior_decision_sha256' candidate-failure-verification-decision.json >/dev/null
            exit "$status"
          }
          trap cleanup_unsigned_drafts EXIT
          printf '[]' > built-releases.json
          while read -r release; do
            tag="$(jq -r .tag <<<"$release")"
            sequence="$(jq -r .sequence <<<"$release")"
            directory="constructed/$tag"
            mkdir -m 0700 "$directory" "downloaded/$tag"
            for architecture in amd64 arm64; do
              evidence="native/native-$tag-$architecture/evidence/native-$architecture.json"
              test "$(jq -r .tag "$evidence")" = "$tag"
              test "$(jq -r .sequence "$evidence")" -eq "$sequence"
            done
            for name in install.sh release-index.json sbxr-linux-amd64.tar.gz sbxr-linux-arm64.tar.gz; do
              cmp "native/native-$tag-amd64/release/$name" "native/native-$tag-arm64/release/$name"
              cp "native/native-$tag-amd64/release/$name" "$directory/$name"
            done
            test "$(find "$directory" -maxdepth 1 -type f -printf '%f\n' | sort)" = "$(printf '%s\n' install.sh release-index.json sbxr-linux-amd64.tar.gz sbxr-linux-arm64.tar.gz | sort)"
            go run ./cmd/sbxr-release verify-package -directory "$directory" -architecture amd64
            go run ./cmd/sbxr-release verify-package -directory "$directory" -architecture arm64
            index_sha256="$(sha256sum "$directory/release-index.json" | cut -d' ' -f1)"
            assets="$(for name in install.sh release-index.json sbxr-linux-amd64.tar.gz sbxr-linux-arm64.tar.gz; do jq -cn --arg name "$name" --argjson size "$(stat -c %s "$directory/$name")" --arg sha256 "$(sha256sum "$directory/$name" | cut -d' ' -f1)" '{name:$name,sha256:$sha256,size:$size}'; done | jq -cS -s 'sort_by(.name)')"
            target="$(jq -cnS --argjson assets "$assets" --arg commit "$GITHUB_SHA" --arg index_sha256 "$index_sha256" --arg repository "$GITHUB_REPOSITORY" --argjson sequence "$sequence" --arg tag "$tag" '{assets:$assets,commit:$commit,release_identity:{commit:$commit,release_index_sha256:$index_sha256,repository:$repository,tag:$tag},sequence:$sequence,tag:$tag}')"
            jq -cS --argjson target "$target" '. + [$target]' built-releases.json > built-releases.next
            mv built-releases.next built-releases.json
          done < <(jq -c '.[]' <<<"$BUILD_RELEASES")

          jq -cnS --slurpfile preflight_decision candidate-preflight-decision.json --slurpfile preflight_facts candidate-preflight-facts.json --slurpfile built_releases built-releases.json '{built_releases:$built_releases[0],preflight_decision:$preflight_decision[0],preflight_facts:$preflight_facts[0],schema:"sbxr-release-qualification-facts-v1",stage:"candidate-draft-construction"}' | tr -d '\n' > candidate-draft-construction-facts.json
          go run ./cmd/sbxr-release qualification < candidate-draft-construction-facts.json > candidate-draft-construction-decision.json
          facts_sha256="$(sha256sum candidate-draft-construction-facts.json | cut -d' ' -f1)"
          prior_decision_sha256="$(sha256sum candidate-preflight-decision.json | cut -d' ' -f1)"
          jq -e --arg facts_sha256 "$facts_sha256" --arg prior_decision_sha256 "$prior_decision_sha256" '
            .schema == "sbxr-release-qualification-decision-v1" and .stage == "candidate-draft-construction" and .outcome == "actions-required" and .facts_sha256 == $facts_sha256 and .prior_decision_sha256 == $prior_decision_sha256 and
            all(.actions[]; .type == "construct-draft" and .facts_sha256 == $facts_sha256 and .prior_decision_sha256 == $prior_decision_sha256 and (keys | sort) == ["assets","body","commit","draft","facts_sha256","immutable","name","prerelease","prior_decision_sha256","release_identity","sequence","tag","type"])' candidate-draft-construction-decision.json >/dev/null

          printf '[]' > draft-observations.json
          while read -r action; do
            tag="$(jq -r .tag <<<"$action")"
            sequence="$(jq -r .sequence <<<"$action")"
            commit="$(jq -r .commit <<<"$action")"
            repository="$(jq -r .release_identity.repository <<<"$action")"
            directory="constructed/$tag"
            while read -r expected; do
              name="$(jq -r .name <<<"$expected")"
              test "$(stat -c %s "$directory/$name")" -eq "$(jq -r .size <<<"$expected")"
              test "$(sha256sum "$directory/$name" | cut -d' ' -f1)" = "$(jq -r .sha256 <<<"$expected")"
            done < <(jq -c '.assets[]' <<<"$action")
            gh api --method POST "repos/$repository/releases" -f tag_name="$tag" -f target_commitish="$commit" -f name="$(jq -r .name <<<"$action")" -f body="$(jq -r .body <<<"$action")" -F draft="$(jq -r .draft <<<"$action")" -F prerelease="$(jq -r .prerelease <<<"$action")" > release.json
            created_release_id="$(jq -r .id release.json)"
            current_tag=$tag
            current_sequence=$sequence
            current_index_sha256="$(jq -r .release_identity.release_index_sha256 <<<"$action")"
            current_assets="$(jq -c .assets <<<"$action")"
            gh release upload "$tag" "$directory"/* --repo "$repository"
            gh api "repos/$repository/releases/$created_release_id" > observed-release.json
            release_id="$(jq -r .id observed-release.json)"
            assets="$(jq -cS '[.assets[] | {id,name,sha256:((.digest // "") | sub("^sha256:";"")),size}] | sort_by(.name)' observed-release.json)"
            printf '[]' > downloads.json
            while read -r asset; do
              id="$(jq -r .id <<<"$asset")"
              name="$(jq -r .name <<<"$asset")"
              gh api "repos/$repository/releases/assets/$id" -H 'Accept: application/octet-stream' > "downloaded/$tag/$name"
              download="$(jq -cnS --argjson id "$id" --arg name "$name" --arg sha256 "$(sha256sum "downloaded/$tag/$name" | cut -d' ' -f1)" --argjson size "$(stat -c %s "downloaded/$tag/$name")" '{authenticated:true,id:$id,name:$name,sha256:$sha256,size:$size}')"
              jq -cS --argjson download "$download" '. + [$download]' downloads.json > downloads.next
              mv downloads.next downloads.json
            done < <(jq -c '.[]' <<<"$assets")
            index_sha256="$(sha256sum "downloaded/$tag/release-index.json" | cut -d' ' -f1)"
            release_identity="$(jq -cS --arg sha256 "$index_sha256" '{commit,release_index_sha256:$sha256,repository,tag}' "downloaded/$tag/release-index.json")"
            observed="$(jq -cnS --argjson assets "$assets" --arg commit "$(jq -r .target_commitish observed-release.json)" --argjson created_release_id "$created_release_id" --slurpfile downloads downloads.json --argjson draft "$(jq .draft observed-release.json)" --argjson immutable "$(jq '.immutable // false' observed-release.json)" --argjson prerelease "$(jq .prerelease observed-release.json)" --argjson release_id "$release_id" --argjson release_identity "$release_identity" --argjson sequence "$(jq .sequence "downloaded/$tag/release-index.json")" --arg tag "$(jq -r .tag_name observed-release.json)" '{assets:$assets,commit:$commit,created_release_id:$created_release_id,downloads:$downloads[0],draft:$draft,immutable:$immutable,prerelease:$prerelease,release_id:$release_id,release_identity:$release_identity,sequence:$sequence,tag:$tag}')"
            jq -cS --argjson observed "$observed" '. + [$observed]' draft-observations.json > draft-observations.next
            mv draft-observations.next draft-observations.json
          done < <(jq -c '.actions[]' candidate-draft-construction-decision.json)

          jq -cnS --slurpfile construction_decision candidate-draft-construction-decision.json --slurpfile construction_facts candidate-draft-construction-facts.json --slurpfile observations draft-observations.json '{construction_decision:$construction_decision[0],construction_facts:$construction_facts[0],observations:$observations[0],schema:"sbxr-release-qualification-facts-v1",stage:"candidate-draft-verification"}' | tr -d '\n' > candidate-draft-verification-facts.json
          go run ./cmd/sbxr-release qualification < candidate-draft-verification-facts.json > candidate-draft-verification-decision.json
          facts_sha256="$(sha256sum candidate-draft-verification-facts.json | cut -d' ' -f1)"
          prior_decision_sha256="$(sha256sum candidate-draft-construction-decision.json | cut -d' ' -f1)"
          jq -e --arg facts_sha256 "$facts_sha256" --arg prior_decision_sha256 "$prior_decision_sha256" '.schema == "sbxr-release-qualification-decision-v1" and .stage == "candidate-draft-verification" and .outcome == "accepted" and .facts_sha256 == $facts_sha256 and .prior_decision_sha256 == $prior_decision_sha256 and .actions == []' candidate-draft-verification-decision.json >/dev/null
          jq -c '.verified_releases' candidate-draft-verification-decision.json > verified-drafts.json
          jq -cS --argjson source "$SOURCE_A" --slurpfile verified verified-drafts.json 'if $source == {} then $verified[0] else [$source] + $verified[0] end' > drafts.json
          trap - EXIT
          cp "$CHECKLIST" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualification-boundary-input
          path: |
            drafts.json
            candidate-preflight-facts.json
            candidate-preflight-decision.json
            candidate-draft-construction-facts.json
            candidate-draft-construction-decision.json
            candidate-draft-verification-facts.json
            candidate-draft-verification-decision.json
            installer-updater-vps.md
            native/*/evidence/native-*.json
          if-no-files-found: error
          retention-days: 90

  sign:
    needs: [preflight, drafts]
    runs-on: ubuntu-24.04
    environment: acceptance-vps
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qualification-boundary-input
      - name: Create the complete qualification manifest after approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" > approvals.json
          approval="$(jq -cS '[.[] | select(.state == "approved" and any(.environments[]; .name == "acceptance-vps"))] | last | {environments:([.environments[] | {name}] | sort_by(.name)),state}' approvals.json)"
          test "$approval" != null
          checklist_sha256="$(sha256sum installer-updater-vps.md | cut -d' ' -f1)"
          native_evidence="$(find native -name 'native-*.json' -type f -print0 | sort -z | xargs -0 sha256sum | jq -Rsc 'split("\n")[:-1] | map(capture("^(?<sha256>[0-9a-f]{64})  (?<path>.+)$"))')"
          rescue="$(jq -cS 'if .candidate.mode == "rescue" then {defect_issue_url:.candidate.defect_issue_url,failed_normal_run_id:.candidate.failed_normal_run_id} else null end' candidate-preflight-facts.json)"
          jq -nS --arg schema sbxr-candidate-failure-state-v1 --arg workflow "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --arg recorded_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg public_verifier '1.3.0 26B3382D5700AFBCD84F980D1D5B6C52BFF743DC2A8EE86B8B44C8E1245CE485' '{schema:$schema,workflow_run:$workflow,recorded_at:$recorded_at,runner:"Ubuntu Server 24.04 linux/amd64",software:{go_toolchain:"Not started",public_verifier:$public_verifier},stages:{integrated_verification:"Pending",codex_live_acceptance:"Pending"},evidence:[($workflow+"#artifacts")]}' > candidate-failure-state.json
          jq -cnS --argjson approval "$approval" --arg candidate_failure_state_sha256 "$(sha256sum candidate-failure-state.json | cut -d' ' -f1)" --arg checklist_sha256 "$checklist_sha256" --slurpfile draft_verification_decision candidate-draft-verification-decision.json --slurpfile draft_verification_facts candidate-draft-verification-facts.json --argjson native_evidence "$native_evidence" --arg prior_decision_sha256 "$(sha256sum candidate-draft-verification-decision.json | cut -d' ' -f1)" --slurpfile releases drafts.json --argjson rescue "$rescue" --arg source_state "$(jq -r .source_state candidate-preflight-decision.json)" --arg commit "$GITHUB_SHA" --arg path '.github/workflows/candidate.yml' --arg ref "$GITHUB_WORKFLOW_REF" --arg run_id "$GITHUB_RUN_ID" --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{approval:$approval,candidate_failure_state_sha256:$candidate_failure_state_sha256,checklist_sha256:$checklist_sha256,draft_verification_decision:$draft_verification_decision[0],draft_verification_facts:$draft_verification_facts[0],native_evidence:$native_evidence,prior_decision_sha256:$prior_decision_sha256,releases:$releases[0],rescue:$rescue,schema:"sbxr-release-qualification-facts-v1",source_state:$source_state,stage:"qualification-boundary",workflow:{commit:$commit,path:$path,ref:$ref,run_id:$run_id,run_url:$run_url}}' | tr -d '\n' > qualification-boundary-facts.json
          go run ./cmd/sbxr-release qualification < qualification-boundary-facts.json > qualification-manifest.json
          jq -e '.schema == "sbxr-qualification-manifest-v1" and .repository == env.GITHUB_REPOSITORY and .approval == {environments:[{name:"acceptance-vps"}],state:"approved"} and .workflow == {commit:env.GITHUB_SHA,path:".github/workflows/candidate.yml",ref:env.GITHUB_WORKFLOW_REF,run_id:env.GITHUB_RUN_ID,run_url:(env.GITHUB_SERVER_URL+"/"+env.GITHUB_REPOSITORY+"/actions/runs/"+env.GITHUB_RUN_ID)} and [.decision_chain[].stage] == ["candidate-preflight","candidate-draft-construction","candidate-draft-verification"] and [.decision_chain[].outcome] == ["accepted","actions-required","accepted"] and (.releases | length) == 2 and all(.releases[]; (.assets | length) == 4)' qualification-manifest.json >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-qualification-manifest
          path: |
            qualification-manifest.json
            qualification-boundary-facts.json
            candidate-failure-state.json
            drafts.json
            installer-updater-vps.md
          if-no-files-found: error
          retention-days: 90
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-path: qualification-manifest.json

  acceptance-vps:
    needs: [preflight, sign]
    runs-on: ubuntu-24.04
    environment: acceptance-vps
    permissions:
      actions: read
      attestations: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      ACCEPTANCE_VPS_HOST: ${{ secrets.ACCEPTANCE_VPS_HOST }}
      ACCEPTANCE_VPS_HOST_KEY: ${{ secrets.ACCEPTANCE_VPS_HOST_KEY }}
      ACCEPTANCE_VPS_SSH_PRIVATE_KEY: ${{ secrets.ACCEPTANCE_VPS_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - name: Initialize exact candidate failure evidence
        run: |
          set -euo pipefail
          jq -nS --arg schema sbxr-candidate-failure-state-v1 --arg workflow "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --arg recorded_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg public_verifier '1.3.0 26B3382D5700AFBCD84F980D1D5B6C52BFF743DC2A8EE86B8B44C8E1245CE485' '{schema:$schema,workflow_run:$workflow,recorded_at:$recorded_at,runner:"Ubuntu Server 24.04 linux/amd64",software:{go_toolchain:"Not started",public_verifier:$public_verifier},stages:{integrated_verification:"Pending",codex_live_acceptance:"Pending"},evidence:[($workflow+"#artifacts")]}' > candidate-failure-state.json
      - name: Record the acceptance toolchain
        run: |
          set -euo pipefail
          jq --arg go_toolchain "$(go version | awk '{print $3}')" '.software.go_toolchain = $go_toolchain' candidate-failure-state.json > candidate-failure-state.next
          mv candidate-failure-state.next candidate-failure-state.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: signed-qualification-manifest
          path: handoff
      - name: Verify and assemble the root-only qualification handoff
        run: |
          set -euo pipefail
          test -n "$ACCEPTANCE_VPS_HOST"
          test -n "$ACCEPTANCE_VPS_HOST_KEY"
          test -n "$ACCEPTANCE_VPS_SSH_PRIVATE_KEY"
          cd handoff
          gh attestation download qualification-manifest.json --repo "$GITHUB_REPOSITORY" --limit 1
          bundle="$(find . -maxdepth 1 -name 'sha256:*.jsonl' -type f -print -quit)"
          test -n "$bundle"
          gh attestation verify qualification-manifest.json --bundle "$bundle" --repo "$GITHUB_REPOSITORY" --signer-workflow albertloky/SBXR/.github/workflows/candidate.yml --source-ref refs/heads/main --source-digest "$GITHUB_SHA" >/dev/null
          mv "$bundle" qualification.bundle
          mkdir -m 0700 assets
          source_state="$(jq -r .source_state qualification-manifest.json)"
          index=0
          while read -r release; do
            tag="$(jq -r .tag <<<"$release")"
            release_id="$(jq -r .release_id <<<"$release")"
            mkdir -m 0700 "assets/$tag"
            gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > release.json
            jq -e --arg tag "$tag" --arg commit "$(jq -r .commit <<<"$release")" '.tag_name == $tag and .target_commitish == $commit and (.assets | length) == 4' release.json >/dev/null
            if test "$index" -eq 0 && test "$source_state" != initial-normal; then
              if test "$source_state" = later-normal; then
                jq -e '.draft == false and .prerelease == false and .immutable == true' release.json >/dev/null
              else
                test "$source_state" = rescue
                jq -e '.draft == false and .prerelease == true and .immutable == true' release.json >/dev/null
              fi
            else
              jq -e '.draft == true and .prerelease == false and .immutable == false' release.json >/dev/null
            fi
            while read -r asset; do
              name="$(jq -r .name <<<"$asset")"
              proof="$(jq -c --arg name "$name" '.assets[] | select(.name == $name)' <<<"$release")"
              test -n "$proof"
              gh api "repos/$GITHUB_REPOSITORY/releases/assets/$(jq -r .id <<<"$asset")" -H 'Accept: application/octet-stream' > "assets/$tag/$name"
              test "$(stat -c %s "assets/$tag/$name")" -eq "$(jq -r .size <<<"$proof")"
              test "$(sha256sum "assets/$tag/$name" | cut -d' ' -f1)" = "$(jq -r .sha256 <<<"$proof")"
            done < <(jq -c '.assets[]' release.json)
            test "$(find "assets/$tag" -maxdepth 1 -type f -printf '%f\n' | sort)" = "$(printf '%s\n' install.sh release-index.json sbxr-linux-amd64.tar.gz sbxr-linux-arm64.tar.gz | sort)"
            index=$((index + 1))
          done < <(jq -c '.releases[]' qualification-manifest.json)
          cd ..
          go build -o handoff/sbxr-release ./cmd/sbxr-release
          cp .github/scripts/installer-updater-vps.sh handoff/
          openssl req -x509 -newkey rsa:3072 -nodes -days 2 -subj '/CN=SBXR Qualification CA' -keyout handoff/ca.key -out handoff/ca.crt
          openssl req -newkey rsa:3072 -nodes -subj '/CN=api.github.com' -keyout handoff/gateway.key -out handoff/gateway.csr
          printf '%s\n' 'subjectAltName=DNS:api.github.com,DNS:github.com' 'extendedKeyUsage=serverAuth' > handoff/gateway.ext
          openssl x509 -req -days 2 -in handoff/gateway.csr -CA handoff/ca.crt -CAkey handoff/ca.key -CAcreateserial -extfile handoff/gateway.ext -out handoff/gateway.crt
          rm handoff/ca.key handoff/gateway.csr handoff/gateway.ext handoff/ca.srl handoff/release.json
      - name: Run the unchanged packaged A-to-B journey
        id: journey
        run: |
          set -euo pipefail
          jq '.stages.integrated_verification = "Running" | .stages.codex_live_acceptance = "Running"' candidate-failure-state.json > candidate-failure-state.next
          mv candidate-failure-state.next candidate-failure-state.json
          install -m 0600 /dev/null ssh.key
          printf '%s\n' "$ACCEPTANCE_VPS_SSH_PRIVATE_KEY" > ssh.key
          printf '%s %s\n' "$ACCEPTANCE_VPS_HOST" "$ACCEPTANCE_VPS_HOST_KEY" > known_hosts
          ssh_options=(-i "$PWD/ssh.key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$PWD/known_hosts" -o ConnectTimeout=15)
          cleanup() {
            rm -f ssh.key known_hosts handoff/gateway.key
          }
          trap cleanup EXIT
          tar -C handoff -czf qualification-handoff.tgz qualification-manifest.json qualification.bundle installer-updater-vps.md installer-updater-vps.sh sbxr-release gateway.crt gateway.key ca.crt assets
          scp "${ssh_options[@]}" qualification-handoff.tgz "root@$ACCEPTANCE_VPS_HOST:/root/qualification-handoff.tgz"
          ssh "${ssh_options[@]}" "root@$ACCEPTANCE_VPS_HOST" 'bash -se' <<'REMOTE'
          test "$(. /etc/os-release; printf '%s:%s' "$ID" "$VERSION_ID")" = ubuntu:24.04
          test "$(uname -m)" = x86_64
          command -v strace >/dev/null
          test ! -e /usr/local/bin/sbxr
          test ! -e /var/lib/sbxr
          install -d -m 0700 /run/sbxr-qualification
          tar -xzf /root/qualification-handoff.tgz -C /run/sbxr-qualification
          chmod 0700 /run/sbxr-qualification/sbxr-release /run/sbxr-qualification/installer-updater-vps.sh
          chmod 0600 /run/sbxr-qualification/qualification-manifest.json /run/sbxr-qualification/qualification.bundle /run/sbxr-qualification/gateway.key
          install -m 0700 /run/sbxr-qualification/sbxr-release /root/sbxr-qualification-gateway
          cp -a /etc/hosts /run/sbxr-qualification/hosts.original
          printf '\n127.0.0.1 api.github.com github.com\n' >> /etc/hosts
          install -m 0644 /run/sbxr-qualification/ca.crt /usr/local/share/ca-certificates/sbxr-qualification.crt
          update-ca-certificates >/dev/null
          nohup /root/sbxr-qualification-gateway gateway -manifest /run/sbxr-qualification/qualification-manifest.json -bundle /run/sbxr-qualification/qualification.bundle -assets /run/sbxr-qualification/assets -certificate /run/sbxr-qualification/gateway.crt -key /run/sbxr-qualification/gateway.key -control /run/sbxr-qualification >/run/sbxr-qualification/gateway.log 2>&1 &
          printf '%s\n' "$!" > /run/sbxr-qualification/gateway.pid
          for _ in $(seq 1 100); do curl -fsS https://api.github.com/repos/albertloky/SBXR/releases/latest >/dev/null && exit 0; sleep .1; done
          exit 1
          REMOTE
          ssh "${ssh_options[@]}" "root@$ACCEPTANCE_VPS_HOST" 'touch /run/sbxr-qualification/original-session; while test -e /run/sbxr-qualification/original-session; do sleep 1; done' &
          original_session=$!
          sleep 1
          kill -0 "$original_session"
          manifest=handoff/qualification-manifest.json
          a="$(jq -c '.releases[0]' "$manifest")"
          b="$(jq -c '.releases[1]' "$manifest")"
          remote_environment="A_TAG=$(jq -r .tag <<<"$a") A_SEQUENCE=$(jq -r .sequence <<<"$a") A_COMMIT=$(jq -r .commit <<<"$a") A_INDEX_SHA256=$(jq -r .release_identity.release_index_sha256 <<<"$a") B_TAG=$(jq -r .tag <<<"$b") B_SEQUENCE=$(jq -r .sequence <<<"$b") B_COMMIT=$(jq -r .commit <<<"$b") B_INDEX_SHA256=$(jq -r .release_identity.release_index_sha256 <<<"$b") MODE=${{ inputs.mode }}"
          ssh "${ssh_options[@]}" "root@$ACCEPTANCE_VPS_HOST" "$remote_environment /usr/bin/bash /run/sbxr-qualification/installer-updater-vps.sh" &
          journey=$!
          if test '${{ inputs.mode }}' = rescue; then
            stages=(rescue-direct-b rescue-source-a rescue-replace-b)
          else
            stages=(installed-a pre-prepared recovered-prepared recovered-activated recovered-committed)
          fi
          for stage in "${stages[@]}"; do
            for _ in $(seq 1 3600); do
              if ssh "${ssh_options[@]}" "root@$ACCEPTANCE_VPS_HOST" "test -e /run/sbxr-qualification/stage-$stage"; then break; fi
              kill -0 "$journey"
              sleep 1
            done
            kill -0 "$original_session"
            ssh "${ssh_options[@]}" "root@$ACCEPTANCE_VPS_HOST" 'true'
            ssh "${ssh_options[@]}" "root@$ACCEPTANCE_VPS_HOST" "touch /run/sbxr-qualification/stage-$stage-ack"
          done
          wait "$journey"
          kill -0 "$original_session"
          scp "${ssh_options[@]}" "root@$ACCEPTANCE_VPS_HOST:/run/sbxr-qualification/acceptance-vps-evidence.json" handoff/
          jq -e '.schema == "sbxr-acceptance-vps-evidence-v1" and .secret_safe == true' handoff/acceptance-vps-evidence.json >/dev/null
          jq '.stages.integrated_verification = "Passed"' candidate-failure-state.json > candidate-failure-state.next
          mv candidate-failure-state.next candidate-failure-state.json
          ssh "${ssh_options[@]}" "root@$ACCEPTANCE_VPS_HOST" 'bash -se' <<'REMOTE'
          cp -a /run/sbxr-qualification/hosts.original /etc/hosts
          rm -f /usr/local/share/ca-certificates/sbxr-qualification.crt
          update-ca-certificates --fresh >/dev/null
          kill "$(cat /run/sbxr-qualification/gateway.pid)"
          rm -f /run/sbxr-qualification/original-session
          find /run/sbxr-qualification -depth -delete
          rm -f /root/qualification-handoff.tgz
          rm -f /root/sbxr-qualification-gateway
          test "$(getent ahostsv4 api.github.com | awk 'NR==1 {print $1}')" != 127.0.0.1
          test "$(getent ahostsv4 github.com | awk 'NR==1 {print $1}')" != 127.0.0.1
          normal_release="$(curl -fsS https://api.github.com/repos/albertloky/SBXR/releases/latest)"
          ! grep -F sbxr_qualification <<<"$normal_release"
          curl -fsSI https://github.com/ >/dev/null
          test "$(find /var/lib/sbxr -mindepth 1 -maxdepth 1 -printf '%f\n')" = installed.json
          printf '0\n' | script -qec 'env TERM=xterm-256color LANG=C.UTF-8 /usr/local/bin/sbxr' /dev/null | grep -F 'Status: Ready'
          REMOTE
          wait "$original_session"
          jq '.stages.codex_live_acceptance = "Passed"' candidate-failure-state.json > candidate-failure-state.next
          mv candidate-failure-state.next candidate-failure-state.json
      - name: Finalize exact candidate failure evidence
        if: always()
        run: |
          set -euo pipefail
          jq '(.stages[] | select(. == "Running")) = "Failed"' candidate-failure-state.json > candidate-failure-state.next
          mv candidate-failure-state.next candidate-failure-state.json
      - name: Evaluate the Acceptance VPS result and write exact Module records
        env:
          SOURCE_STATE: ${{ needs.preflight.outputs.source_state }}
        run: |
          set -euo pipefail
          mkdir -m 0700 acceptance-records
          prior_decision_sha256="$(sha256sum handoff/qualification-manifest.json | cut -d' ' -f1)"
          observed_at="$(jq -r .observed_at handoff/acceptance-vps-evidence.json)"
          jq -cnS --arg evaluation_time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg observed_at "$observed_at" --arg prior_decision_sha256 "$prior_decision_sha256" --slurpfile boundary_facts handoff/qualification-boundary-facts.json --slurpfile journey handoff/acceptance-vps-evidence.json --slurpfile manifest handoff/qualification-manifest.json --arg go_toolchain "$(go version | awk '{print $3}')" --arg public_verifier '1.3.0 26B3382D5700AFBCD84F980D1D5B6C52BFF743DC2A8EE86B8B44C8E1245CE485' '{evaluation_time:$evaluation_time,github_routing_restored:true,journey:$journey[0],observed_at:$observed_at,prior_decision_sha256:$prior_decision_sha256,qualification_boundary_facts:$boundary_facts[0],qualification_manifest:$manifest[0],qualification_manifest_attested:true,releases:$manifest[0].releases,runner:{architecture:"amd64",go_toolchain:$go_toolchain,operating_system:"Ubuntu Server 24.04",public_verifier:$public_verifier},schema:"sbxr-release-qualification-facts-v1",stage:"acceptance-vps-result"}' | tr -d '\n' > acceptance-vps-result-facts.json
          go run ./cmd/sbxr-release qualification < acceptance-vps-result-facts.json > acceptance-vps-result-decision.json
          facts_sha256="$(sha256sum acceptance-vps-result-facts.json | cut -d' ' -f1)"
          jq -e --arg facts_sha256 "$facts_sha256" --arg prior_decision_sha256 "$prior_decision_sha256" '.schema == "sbxr-release-qualification-decision-v1" and .stage == "acceptance-vps-result" and .outcome == "accepted" and .facts_sha256 == $facts_sha256 and .prior_decision_sha256 == $prior_decision_sha256 and (.records | length) == 2' acceptance-vps-result-decision.json >/dev/null
          for index in 0 1; do
            tag="$(jq -r ".releases[$index].tag" handoff/qualification-manifest.json)"
            record="acceptance-records/$tag.md"
            test "$(jq -r --arg tag "$tag" '[.records[] | select(.tag == $tag)] | length' acceptance-vps-result-decision.json)" -eq 1
            jq -jr --arg tag "$tag" '.records[] | select(.tag == $tag) | .body' acceptance-vps-result-decision.json > "$record"
            if test "$index" -eq 1 || test "$SOURCE_STATE" = initial-normal; then
              gh release edit "$tag" --draft --notes-file "$record"
            fi
          done
          if grep -aERq 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|Authorization: Bearer ' acceptance-records acceptance-vps-result-facts.json acceptance-vps-result-decision.json handoff/acceptance-vps-evidence.json; then exit 1; elif test $? -ne 1; then exit 1; fi
          cat acceptance-records/*.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installer-updater-acceptance-${{ github.run_id }}
          path: |
            acceptance-records
            acceptance-vps-result-facts.json
            acceptance-vps-result-decision.json
            handoff/acceptance-vps-evidence.json
            handoff/qualification-manifest.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: candidate-failure-state-${{ github.run_id }}
          path: candidate-failure-state.json
          if-no-files-found: error
          retention-days: 90

  cleanup-unqualified:
    if: always() && needs.drafts.result != 'skipped' && needs.acceptance-vps.result != 'success'
    needs: [preflight, drafts, sign, acceptance-vps]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - name: Evaluate exact candidate failure observations
        id: boundary
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RELEASES: ${{ needs.preflight.outputs.build_releases }}
        run: |
          set -euo pipefail
          signed=false
          echo 'signed=false' >> "$GITHUB_OUTPUT"
          echo 'recorded=false' >> "$GITHUB_OUTPUT"
          mkdir -m 0700 boundary
          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "signed-qualification-manifest" and .expired == false) | .id')"
          if test -n "$artifact_id"; then
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name signed-qualification-manifest --dir boundary
            if gh attestation verify boundary/qualification-manifest.json --repo "$GITHUB_REPOSITORY" --signer-workflow albertloky/SBXR/.github/workflows/candidate.yml --source-ref refs/heads/main --source-digest "$GITHUB_SHA" >/dev/null; then
              jq -e --arg run "$GITHUB_RUN_ID" --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --arg commit "$GITHUB_SHA" '.schema == "sbxr-qualification-manifest-v1" and .repository == env.GITHUB_REPOSITORY and .workflow.path == ".github/workflows/candidate.yml" and .workflow.ref == "albertloky/SBXR/.github/workflows/candidate.yml@refs/heads/main" and .workflow.commit == $commit and .workflow.run_id == $run and .workflow.run_url == $url' boundary/qualification-manifest.json >/dev/null
              signed=true
              echo 'signed=true' >> "$GITHUB_OUTPUT"
            fi
          fi
          if test "$signed" != true && gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name qualification-boundary-input --dir boundary/unsigned 2>/dev/null; then
            echo 'recorded=true' >> "$GITHUB_OUTPUT"
          fi

          test "$signed" = true || exit 0
          mkdir -m 0700 boundary/burned boundary/failure-state boundary/records boundary/rechecked
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch --force --tags origin
          printf '[]' > boundary/existing-burns.json
          while read -r tag; do
            payload="$(git tag -l --format='%(contents)' "release-burned/$tag")"
            jq -cS --argjson payload "$payload" '. + [$payload] | sort_by(.original_tag)' boundary/existing-burns.json > boundary/existing-burns.next
            mv boundary/existing-burns.next boundary/existing-burns.json
          done < <(git for-each-ref refs/tags/release-burned --format='%(refname:strip=3)')
          if ! gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "candidate-failure-state-$GITHUB_RUN_ID" --dir boundary/failure-state 2>/dev/null; then
            cp boundary/candidate-failure-state.json boundary/failure-state/candidate-failure-state.json
          fi
          printf '[]' > boundary/observations.json
          while read -r release; do
            tag="$(jq -r .tag <<<"$release")"
            entry="$(jq -c --arg tag "$tag" '.releases[] | select(.tag == $tag)' boundary/qualification-manifest.json)"
            test -n "$entry"
            printf '%s\n' "$entry" > "boundary/$tag.json"
            .github/scripts/recheck-qualified-release.sh "boundary/$tag.json" "boundary/rechecked/$tag" "boundary/$tag.release.json"
            commit="$(jq -r .commit <<<"$entry")"
            tag_commit=null
            if object="$(git rev-parse -q --verify "refs/tags/$tag^{commit}")"; then test "$object" = "$commit"; tag_commit="$(jq -cn --arg commit "$object" '$commit')"; fi
            observation="$(jq -cnS --argjson expected "$entry" --slurpfile release "boundary/$tag.release.json" --argjson tag_commit "$tag_commit" '{assets:$expected.assets,body:$release[0].body,commit:$expected.commit,created_release_id:$expected.release_id,draft:$release[0].draft,immutable:($release[0].immutable // false),prerelease:$release[0].prerelease,release_id:$expected.release_id,release_identity:$expected.release_identity,release_present:true,sequence:$expected.sequence,tag:$expected.tag,tag_commit:$tag_commit}')"
            jq -cS --argjson observation "$observation" '. + [$observation]' boundary/observations.json > boundary/observations.next
            mv boundary/observations.next boundary/observations.json
          done < <(jq -c '.[]' <<<"$BUILD_RELEASES")
          jq -cnS --slurpfile burned boundary/existing-burns.json --slurpfile failure_state boundary/failure-state/candidate-failure-state.json --slurpfile manifest boundary/qualification-manifest.json --slurpfile boundary_facts boundary/qualification-boundary-facts.json --slurpfile observations boundary/observations.json --arg observed_at "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)" --arg prior_decision_sha256 "$(sha256sum boundary/qualification-manifest.json | cut -d' ' -f1)" '{burned_identities:$burned[0],candidate_failure_state:$failure_state[0],construction_decision:$boundary_facts[0].draft_verification_facts.construction_decision,construction_facts:$boundary_facts[0].draft_verification_facts.construction_facts,observations:$observations[0],observed_at:$observed_at,prior_decision_sha256:$prior_decision_sha256,qualification_boundary_facts:$boundary_facts[0],qualification_manifest:$manifest[0],reason:"post-sign-qualification-failure",schema:"sbxr-release-qualification-facts-v1",stage:"candidate-failure-finalization",workflow:$manifest[0].workflow}' | tr -d '\n' > boundary/candidate-failure-facts.json
          go run ./cmd/sbxr-release qualification < boundary/candidate-failure-facts.json > boundary/candidate-failure-decision.json
          facts_sha256="$(sha256sum boundary/candidate-failure-facts.json | cut -d' ' -f1)"
          prior_decision_sha256="$(sha256sum boundary/qualification-manifest.json | cut -d' ' -f1)"
          jq -e --arg facts_sha256 "$facts_sha256" --arg prior_decision_sha256 "$prior_decision_sha256" '.schema == "sbxr-release-qualification-decision-v1" and .stage == "candidate-failure-finalization" and .outcome == "failed-prerelease" and .facts_sha256 == $facts_sha256 and .prior_decision_sha256 == $prior_decision_sha256 and all(.actions[]; .type == "finalize-failed-release" and .facts_sha256 == $facts_sha256 and .prior_decision_sha256 == $prior_decision_sha256)' boundary/candidate-failure-decision.json >/dev/null
          : > boundary/burn-refs
          while read -r action; do
            tag="$(jq -r .tag <<<"$action")"
            commit="$(jq -r .commit <<<"$action")"
            jq -S .burn <<<"$action" > "boundary/burned/$tag.json"
            jq -jr .body <<<"$action" > "boundary/records/$tag.md"
            if jq -e .burn_required <<<"$action" >/dev/null; then
              .github/scripts/prepare-burn-tag.sh "boundary/burned/$tag.json" "$tag" "$commit" >> boundary/burn-refs
            fi
          done < <(jq -c '.actions[]' boundary/candidate-failure-decision.json)
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        if: steps.boundary.outputs.signed == 'true'
        with:
          subject-path: boundary/burned/*.json
      - name: Publish the complete attested burned ledger atomically
        if: steps.boundary.outputs.signed == 'true'
        env:
          BUILD_RELEASES: ${{ needs.preflight.outputs.build_releases }}
        run: |
          set -euo pipefail
          mapfile -t refs < <(sed '/^$/d' boundary/burn-refs)
          test "${#refs[@]}" -eq 0 || git push --atomic origin "${refs[@]}"
      - name: Publish the rechecked burned releases as failed prereleases
        if: steps.boundary.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while read -r action; do
            tag="$(jq -r .tag <<<"$action")"
            release_id="$(jq -r .release_id <<<"$action")"
            commit="$(jq -r .commit <<<"$action")"
            gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > boundary/final-release.json
            jq -e --arg tag "$tag" --arg commit "$commit" --argjson release_id "$release_id" '.id == $release_id and .tag_name == $tag and .target_commitish == $commit' boundary/final-release.json >/dev/null
            if jq -e '.draft == true and .prerelease == false' boundary/final-release.json >/dev/null; then
              gh release edit "$tag" --notes-file "boundary/records/$tag.md" --draft=false --prerelease --latest=false
            else
              jq -e '.draft == false and .prerelease == true and .immutable == true' boundary/final-release.json >/dev/null
              jq -j .body boundary/final-release.json | cmp - "boundary/records/$tag.md"
            fi
          done < <(jq -c '.actions[]' boundary/candidate-failure-decision.json)
      - name: Remove only this run's fully recorded unsigned drafts and tags
        if: steps.boundary.outputs.signed != 'true' && steps.boundary.outputs.recorded == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RELEASES: ${{ needs.preflight.outputs.build_releases }}
        run: |
          set -euo pipefail
          printf '[]' > boundary/unsigned/observations.json
          while read -r release; do
            tag="$(jq -r .tag <<<"$release")"
            test "$(jq --arg tag "$tag" '[.[] | select(.tag == $tag)] | length' boundary/unsigned/drafts.json)" -eq 1
          done < <(jq -c '.[]' <<<"$BUILD_RELEASES")
          while read -r release; do
            tag="$(jq -r .tag <<<"$release")"
            entry="$(jq -c --arg tag "$tag" '.[] | select(.tag == $tag)' boundary/unsigned/drafts.json)"
            test -n "$entry"
            printf '%s\n' "$entry" > "boundary/unsigned/$tag.json"
            release_id="$(jq -r .release_id <<<"$entry")"
            commit="$(jq -r .commit <<<"$entry")"
            if ! gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" >/dev/null 2>&1; then
              tag_commit=null
              if object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha 2>/dev/null)"; then test "$object" = "$commit"; tag_commit="$(jq -cn --arg commit "$object" '$commit')"; fi
              observation="$(jq -cnS --argjson expected "$entry" --argjson tag_commit "$tag_commit" '{assets:[],body:"",commit:$expected.commit,created_release_id:$expected.release_id,draft:false,immutable:false,prerelease:false,release_id:$expected.release_id,release_identity:$expected.release_identity,release_present:false,sequence:$expected.sequence,tag:$expected.tag,tag_commit:$tag_commit}')"
              jq -cS --argjson observation "$observation" '. + [$observation]' boundary/unsigned/observations.json > boundary/unsigned/observations.next
              mv boundary/unsigned/observations.next boundary/unsigned/observations.json
              continue
            fi
            .github/scripts/recheck-qualified-release.sh "boundary/unsigned/$tag.json" "boundary/unsigned/rechecked/$tag" boundary/unsigned/release.json
            jq -e '.draft == true and .prerelease == false' boundary/unsigned/release.json >/dev/null
            tag_commit=null
            if object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha 2>/dev/null)"; then test "$object" = "$commit"; tag_commit="$(jq -cn --arg commit "$object" '$commit')"; fi
            observation="$(jq -cnS --argjson expected "$entry" --slurpfile release boundary/unsigned/release.json --argjson tag_commit "$tag_commit" '{assets:$expected.assets,body:$release[0].body,commit:$expected.commit,created_release_id:$expected.release_id,draft:$release[0].draft,immutable:($release[0].immutable // false),prerelease:$release[0].prerelease,release_id:$expected.release_id,release_identity:$expected.release_identity,release_present:true,sequence:$expected.sequence,tag:$expected.tag,tag_commit:$tag_commit}')"
            jq -cS --argjson observation "$observation" '. + [$observation]' boundary/unsigned/observations.json > boundary/unsigned/observations.next
            mv boundary/unsigned/observations.next boundary/unsigned/observations.json
          done < <(jq -c '.[]' <<<"$BUILD_RELEASES")
          jq -cnS --slurpfile construction_decision boundary/unsigned/candidate-draft-construction-decision.json --slurpfile construction_facts boundary/unsigned/candidate-draft-construction-facts.json --slurpfile observations boundary/unsigned/observations.json --arg observed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg prior_decision_sha256 "$(sha256sum boundary/unsigned/candidate-draft-construction-decision.json | cut -d' ' -f1)" --arg commit "$GITHUB_SHA" --arg path '.github/workflows/candidate.yml' --arg ref "$GITHUB_WORKFLOW_REF" --arg run_id "$GITHUB_RUN_ID" --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{burned_identities:$construction_facts[0].preflight_facts.burned_identities,candidate_failure_state:null,construction_decision:$construction_decision[0],construction_facts:$construction_facts[0],observations:$observations[0],observed_at:$observed_at,prior_decision_sha256:$prior_decision_sha256,qualification_boundary_facts:null,qualification_manifest:null,reason:"pre-boundary-failure",schema:"sbxr-release-qualification-facts-v1",stage:"candidate-failure-finalization",workflow:{commit:$commit,path:$path,ref:$ref,run_id:$run_id,run_url:$run_url}}' | tr -d '\n' > boundary/unsigned/candidate-failure-facts.json
          go run ./cmd/sbxr-release qualification < boundary/unsigned/candidate-failure-facts.json > boundary/unsigned/candidate-failure-decision.json
          facts_sha256="$(sha256sum boundary/unsigned/candidate-failure-facts.json | cut -d' ' -f1)"
          jq -e --arg facts_sha256 "$facts_sha256" --arg prior_decision_sha256 "$(sha256sum boundary/unsigned/candidate-draft-construction-decision.json | cut -d' ' -f1)" '.schema == "sbxr-release-qualification-decision-v1" and .stage == "candidate-failure-finalization" and .outcome == "cleanup" and .facts_sha256 == $facts_sha256 and .prior_decision_sha256 == $prior_decision_sha256 and all(.actions[]; .type == "cleanup-draft" and .facts_sha256 == $facts_sha256 and .prior_decision_sha256 == $prior_decision_sha256)' boundary/unsigned/candidate-failure-decision.json >/dev/null
          while read -r action; do
            tag="$(jq -r .tag <<<"$action")"
            release_id="$(jq -r .release_id <<<"$action")"
            commit="$(jq -r .commit <<<"$action")"
            if jq -e .delete_release <<<"$action" >/dev/null; then
              gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > boundary/unsigned/final-release.json
              jq -e --arg tag "$tag" --arg commit "$commit" --argjson release_id "$release_id" '.id == $release_id and .tag_name == $tag and .target_commitish == $commit and .draft == true and .prerelease == false' boundary/unsigned/final-release.json >/dev/null
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id"
            fi
            if jq -e .delete_tag <<<"$action" >/dev/null; then
              test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)" = "$commit"
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag"
            fi
          done < <(jq -c '.actions[]' boundary/unsigned/candidate-failure-decision.json)
      - name: Verify the observed candidate failure transition
        if: always() && (steps.boundary.outputs.signed == 'true' || steps.boundary.outputs.recorded == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if test "${{ steps.boundary.outputs.signed }}" = true; then
            directory=boundary
            printf '[]' > "$directory/verified-burns.json"
            printf '[]' > "$directory/verified-observations.json"
            git fetch --force --tags origin
            while read -r action; do
              tag="$(jq -r .tag <<<"$action")"
              expected="$(jq -cS .burn <<<"$action")"
              actual="$(git tag -l --format='%(contents)' "release-burned/$tag" | jq -cS .)"
              test "$actual" = "$expected"
              jq -cS --argjson burn "$actual" '. + [$burn] | sort_by(.original_tag)' "$directory/verified-burns.json" > "$directory/verified-burns.next"
              mv "$directory/verified-burns.next" "$directory/verified-burns.json"
              .github/scripts/recheck-qualified-release.sh "$directory/$tag.json" "$directory/verified/$tag" "$directory/$tag.verified-release.json"
              entry="$(jq -c --arg tag "$tag" '.observations[] | select(.tag == $tag)' "$directory/candidate-failure-facts.json")"
              commit="$(jq -r .commit <<<"$entry")"
              tag_commit="$(git rev-parse "refs/tags/$tag^{commit}")"
              test "$tag_commit" = "$commit"
              observation="$(jq -cnS --argjson expected "$entry" --slurpfile release "$directory/$tag.verified-release.json" --arg tag_commit "$tag_commit" '{assets:$expected.assets,body:$release[0].body,commit:$expected.commit,created_release_id:$expected.created_release_id,draft:$release[0].draft,immutable:($release[0].immutable // false),prerelease:$release[0].prerelease,release_id:$expected.release_id,release_identity:$expected.release_identity,release_present:true,sequence:$expected.sequence,tag:$expected.tag,tag_commit:$tag_commit}')"
              jq -cS --argjson observation "$observation" '. + [$observation]' "$directory/verified-observations.json" > "$directory/verified-observations.next"
              mv "$directory/verified-observations.next" "$directory/verified-observations.json"
            done < <(jq -c '.actions[]' "$directory/candidate-failure-decision.json")
          else
            directory=boundary/unsigned
            jq -cS .burned_identities "$directory/candidate-failure-facts.json" > "$directory/verified-burns.json"
            printf '[]' > "$directory/verified-observations.json"
            while read -r action; do
              tag="$(jq -r .tag <<<"$action")"
              release_id="$(jq -r .release_id <<<"$action")"
              ! gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" >/dev/null 2>&1
              ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1
              expected="$(jq -c --arg tag "$tag" '.observations[] | select(.tag == $tag)' "$directory/candidate-failure-facts.json")"
              observation="$(jq -cnS --argjson expected "$expected" '{assets:[],body:"",commit:$expected.commit,created_release_id:$expected.created_release_id,draft:false,immutable:false,prerelease:false,release_id:$expected.release_id,release_identity:$expected.release_identity,release_present:false,sequence:$expected.sequence,tag:$expected.tag,tag_commit:null}')"
              jq -cS --argjson observation "$observation" '. + [$observation]' "$directory/verified-observations.json" > "$directory/verified-observations.next"
              mv "$directory/verified-observations.next" "$directory/verified-observations.json"
            done < <(jq -c '.actions[]' "$directory/candidate-failure-decision.json")
          fi
          jq -cnS --slurpfile burned "$directory/verified-burns.json" --slurpfile failure_decision "$directory/candidate-failure-decision.json" --slurpfile failure_facts "$directory/candidate-failure-facts.json" --slurpfile observations "$directory/verified-observations.json" '{burned_identities:$burned[0],failure_decision:$failure_decision[0],failure_facts:$failure_facts[0],observations:$observations[0],schema:"sbxr-release-qualification-facts-v1",stage:"candidate-failure-verification"}' | tr -d '\n' > "$directory/candidate-failure-verification-facts.json"
          go run ./cmd/sbxr-release qualification < "$directory/candidate-failure-verification-facts.json" > "$directory/candidate-failure-verification-decision.json"
          facts_sha256="$(sha256sum "$directory/candidate-failure-verification-facts.json" | cut -d' ' -f1)"
          prior_decision_sha256="$(sha256sum "$directory/candidate-failure-decision.json" | cut -d' ' -f1)"
          jq -e --arg facts_sha256 "$facts_sha256" --arg prior_decision_sha256 "$prior_decision_sha256" '.schema == "sbxr-release-qualification-decision-v1" and .stage == "candidate-failure-verification" and .outcome == "accepted" and .actions == [] and .facts_sha256 == $facts_sha256 and .prior_decision_sha256 == $prior_decision_sha256' "$directory/candidate-failure-verification-decision.json" >/dev/null
