name: Construct qualified drafts

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Qualification source mode
        required: true
        type: choice
        options:
          - normal
          - rescue
      a_tag:
        description: Source release A tag
        required: true
        type: string
      a_sequence:
        description: Source release A sequence
        required: true
        type: number
      b_tag:
        description: Higher release B tag
        required: true
        type: string
      b_sequence:
        description: Higher release B sequence
        required: true
        type: number
      failed_normal_run_id:
        description: Required only for rescue
        required: false
        type: string
      defect_issue_url:
        description: Required only for rescue
        required: false
        type: string

permissions: {}

concurrency:
  group: installer-updater-release
  cancel-in-progress: false

env:
  ARCHIVE_TAG: archive/full-product-v1.0.15
  CHECKLIST: docs/acceptance/installer-updater-vps.md

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: read
      contents: read
    outputs:
      build_releases: ${{ steps.preflight.outputs.build_releases }}
      source_a: ${{ steps.preflight.outputs.source_a }}
      source_state: ${{ steps.preflight.outputs.source_state }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Verify source state and unused release authority
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          A_TAG: ${{ inputs.a_tag }}
          A_SEQUENCE: ${{ inputs.a_sequence }}
          B_TAG: ${{ inputs.b_tag }}
          B_SEQUENCE: ${{ inputs.b_sequence }}
          FAILED_RUN: ${{ inputs.failed_normal_run_id }}
          DEFECT_URL: ${{ inputs.defect_issue_url }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          test "$(git cat-file -t "$ARCHIVE_TAG")" = tag
          test "$(git rev-parse "$ARCHIVE_TAG")" = "$(git ls-remote --tags origin "refs/tags/$ARCHIVE_TAG" | cut -f1)"
          test "$(git rev-parse "$ARCHIVE_TAG^{commit}")" = "$(git ls-remote --tags origin "refs/tags/$ARCHIVE_TAG^{}" | cut -f1)"
          test "$(printf '%s\n' "$A_TAG" "$B_TAG" | grep -Ec '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$')" -eq 2
          test "$A_TAG" != "$B_TAG"
          test "$A_SEQUENCE" -gt 0
          test "$B_SEQUENCE" -gt "$A_SEQUENCE"
          test -f "$CHECKLIST"

          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --slurp | jq 'add' > releases.json
          test "$(jq '[.[] | select(.draft)] | length' releases.json)" -eq 0
          printf '[]' > used-sequences.json
          while read -r release; do
            tag="$(jq -r .tag_name <<<"$release")"
            index_asset_id="$(jq -r '.assets[] | select(.name == "release-index.json") | .id' <<<"$release")"
            if test -n "$index_asset_id"; then
              gh api "repos/$GITHUB_REPOSITORY/releases/assets/$index_asset_id" -H 'Accept: application/octet-stream' > existing-index.json
              if sequence="$(jq -er .sequence existing-index.json 2>/dev/null)"; then
                jq --arg tag "$tag" --argjson sequence "$sequence" '. += [{tag:$tag,sequence:$sequence}]' used-sequences.json > used-sequences.next
                mv used-sequences.next used-sequences.json
              fi
            fi
          done < <(jq -c '.[]' releases.json)
          git fetch --force --tags origin
          for tag in "$A_TAG" "$B_TAG"; do
            test "$(jq --arg tag "$tag" '[.[] | select(.tag_name == $tag)] | length' releases.json)" -le 1
          done
          burned="$(for burned_tag in $(git tag --list 'release-burned/*'); do git tag -l --format='%(contents)' "$burned_tag"; done | jq -s .)"
          for candidate in "$A_TAG:$A_SEQUENCE" "$B_TAG:$B_SEQUENCE"; do
            tag="${candidate%:*}"
            sequence="${candidate#*:}"
            if jq -e --arg tag "$tag" --argjson sequence "$sequence" '.[] | select(.original_tag == $tag or .sequence == $sequence)' <<<"$burned" >/dev/null; then
              test "$MODE" = rescue
              test "$tag" = "$A_TAG"
            fi
          done

          latest=''
          if gh api "repos/$GITHUB_REPOSITORY/releases/latest" > latest.json 2>/dev/null; then
            if jq -e '.draft == false and .prerelease == false and .immutable == true and (.assets | map(.name) | sort) == ["install.sh","release-index.json","sbxr-linux-amd64.tar.gz","sbxr-linux-arm64.tar.gz"] and (.body | contains("# SBXR Installer-Updater Acceptance Record\n")) and (.body | contains("Status: Qualified\n")) and ((.body | contains("Stable result code: RELEASE-INSTALLER-UPDATER-TWO-RELEASE-QUALIFICATION\n")) or (.body | contains("Stable result code: RELEASE-INSTALLER-UPDATER-RESCUE-QUALIFICATION\n")))' latest.json >/dev/null; then
              latest="$(jq -r .tag_name latest.json)"
            fi
          fi
          if test "$MODE" = normal && test -z "$latest"; then
            highest_sequence="$(jq -n --argjson used "$(cat used-sequences.json)" --argjson burned "$burned" '[$used[].sequence, $burned[].sequence] | max // 16')"
            test "$A_SEQUENCE" -eq "$((highest_sequence + 1))"
            test "$B_SEQUENCE" -eq "$((A_SEQUENCE + 1))"
            if test "$highest_sequence" -eq 16; then
              test "$A_TAG" = v2.0.0
              test "$B_TAG" = v2.0.1
            fi
            test "$(jq --arg a "$A_TAG" --arg b "$B_TAG" '[.[] | select(.tag_name == $a or .tag_name == $b)] | length' releases.json)" -eq 0
            test -z "$(git ls-remote --tags origin "refs/tags/$A_TAG" "refs/tags/$B_TAG")"
            source_state=initial-normal
            build_releases="$(jq -cn --arg a "$A_TAG" --argjson as "$A_SEQUENCE" --arg b "$B_TAG" --argjson bs "$B_SEQUENCE" '[{"tag":$a,"sequence":$as},{"tag":$b,"sequence":$bs}]')"
          elif test "$MODE" = normal; then
            jq -e --arg tag "$A_TAG" '.tag_name == $tag and .draft == false and .prerelease == false and .immutable == true' latest.json >/dev/null
            cp latest.json source-a-release.json
            index_asset_id="$(jq -r '.assets[] | select(.name == "release-index.json") | .id' latest.json)"
            gh api "repos/$GITHUB_REPOSITORY/releases/assets/$index_asset_id" -H 'Accept: application/octet-stream' > source-a-index.json
            test "$(jq -r .sequence source-a-index.json)" -eq "$A_SEQUENCE"
            test "$(jq --arg tag "$B_TAG" '[.[] | select(.tag_name == $tag)] | length' releases.json)" -eq 0
            test -z "$(git ls-remote --tags origin "refs/tags/$B_TAG")"
            source_state=later-normal
            build_releases="$(jq -cn --arg tag "$B_TAG" --argjson sequence "$B_SEQUENCE" '[{"tag":$tag,"sequence":$sequence}]')"
          else
            test "$MODE" = rescue
            printf '%s\n' "$FAILED_RUN" | grep -Eq '^[1-9][0-9]*$'
            printf '%s\n' "$DEFECT_URL" | grep -Eq "^https://github\.com/$GITHUB_REPOSITORY/issues/[1-9][0-9]*$"
            gh api "repos/$GITHUB_REPOSITORY/issues/${DEFECT_URL##*/}" > defect-issue.json
            jq -e '.html_url == env.DEFECT_URL and .state == "open" and .pull_request == null' defect-issue.json >/dev/null
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_RUN" --jq 'select(.path == ".github/workflows/candidate.yml" and .conclusion != "success")' >/dev/null
            test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FAILED_RUN" --jq '.inputs.mode')" = normal
            jq -e --arg tag "$A_TAG" '.[] | select(.tag_name == $tag and .draft == false and .prerelease == true and .immutable == true)' releases.json > source-a-release.json
            test "$(jq --arg tag "$B_TAG" '[.[] | select(.tag_name == $tag)] | length' releases.json)" -eq 0
            test -z "$(git ls-remote --tags origin "refs/tags/$B_TAG")"
            if test -n "$latest"; then
              ! jq -e '.body | contains("Stable result code: RELEASE-INSTALLER-UPDATER-RESCUE-QUALIFICATION\n")' latest.json >/dev/null
            fi
            source_state=rescue
            build_releases="$(jq -cn --arg tag "$B_TAG" --argjson sequence "$B_SEQUENCE" '[{"tag":$tag,"sequence":$sequence}]')"
          fi
          test "$(jq --argjson sequence "$B_SEQUENCE" '[.[] | select(.sequence == $sequence)] | length' used-sequences.json)" -eq 0
          if test "$source_state" = initial-normal; then
            test "$(jq --argjson sequence "$A_SEQUENCE" '[.[] | select(.sequence == $sequence)] | length' used-sequences.json)" -eq 0
          else
            jq -e --arg tag "$A_TAG" --argjson sequence "$A_SEQUENCE" '[.[] | select(.sequence == $sequence)] == [{tag:$tag,sequence:$sequence}]' used-sequences.json >/dev/null
          fi
          source_a='{}'
          if test "$source_state" != initial-normal; then
            test "$(jq '.assets | length' source-a-release.json)" -eq 4
            test "$(jq -r '.assets[].name' source-a-release.json | sort)" = "$(printf '%s\n' install.sh release-index.json sbxr-linux-amd64.tar.gz sbxr-linux-arm64.tar.gz | sort)"
            mkdir -m 0700 source-a
            while read -r asset; do
              name="$(jq -r .name <<<"$asset")"
              id="$(jq -r .id <<<"$asset")"
              gh api "repos/$GITHUB_REPOSITORY/releases/assets/$id" -H 'Accept: application/octet-stream' > "source-a/$name"
              test "$(stat -c %s "source-a/$name")" -eq "$(jq -r .size <<<"$asset")"
              test "sha256:$(sha256sum "source-a/$name" | cut -d' ' -f1)" = "$(jq -r .digest <<<"$asset")"
            done < <(jq -c '.assets[]' source-a-release.json)
            if test "$source_state" = later-normal; then
              jq -r .body source-a-release.json > source-a-acceptance-record.txt
              for line in \
                '# SBXR Installer-Updater Acceptance Record' \
                'Status: Qualified' \
                "Repository: $GITHUB_REPOSITORY" \
                "Tag: $A_TAG" \
                "Commit: $(jq -r .target_commitish source-a-release.json)" \
                'Module Verification: Passed' \
                'Seam Verification: Passed' \
                'Integrated Verification: Passed on live Ubuntu Server 24.04 amd64' \
                'Codex Live Acceptance: Passed' \
                'Owner Acceptance: Not required' \
                'Secret-safe result: Passed'; do
                test "$(grep -Fxc "$line" source-a-acceptance-record.txt)" -eq 1
              done
              test "$(grep -Ec '^Stable result code: RELEASE-INSTALLER-UPDATER-(TWO-RELEASE|RESCUE)-QUALIFICATION$' source-a-acceptance-record.txt)" -eq 1
              test "$(grep -Ec '^Qualification role: (Clean-installed source release|Discovered, installed, recovered, final latest release|Rescue direct-install and lower-sequence replacement release)$' source-a-acceptance-record.txt)" -eq 1
              test "$(grep -Ec '^Workflow evidence: https://github\.com/albertloky/SBXR/actions/runs/[1-9][0-9]*$' source-a-acceptance-record.txt)" -eq 1
              test "$(grep -Ec '^Runner: Ubuntu Server 24\.04 linux/amd64$' source-a-acceptance-record.txt)" -eq 1
              test "$(grep -Ec '^Go toolchain: go[0-9]+\.[0-9]+\.[0-9]+$' source-a-acceptance-record.txt)" -eq 1
              test "$(grep -Ec '^Public verifier: [0-9]+\.[0-9]+\.[0-9]+ [A-F0-9]{64}$' source-a-acceptance-record.txt)" -eq 1
              test "$(grep -Fxc "Sequence: $A_SEQUENCE" source-a-acceptance-record.txt)" -eq 1
              test "$(grep -Fxc "Release index SHA-256: $(sha256sum source-a/release-index.json | cut -d' ' -f1)" source-a-acceptance-record.txt)" -eq 1
              for name in install.sh release-index.json sbxr-linux-amd64.tar.gz sbxr-linux-arm64.tar.gz; do
                size="$(stat -c %s "source-a/$name")"
                sha256="$(sha256sum "source-a/$name" | cut -d' ' -f1)"
                test "$(grep -Fxc "Asset: $name $size $sha256" source-a-acceptance-record.txt)" -eq 1
              done
            fi
            commit="$(jq -r .target_commitish source-a-release.json)"
            index_sha256="$(sha256sum source-a/release-index.json | cut -d' ' -f1)"
            jq -e --arg tag "$A_TAG" --arg commit "$commit" --argjson sequence "$A_SEQUENCE" '.repository == env.GITHUB_REPOSITORY and .tag == $tag and .commit == $commit and .sequence == $sequence' source-a/release-index.json >/dev/null
            assets="$(for name in install.sh release-index.json sbxr-linux-amd64.tar.gz sbxr-linux-arm64.tar.gz; do jq -cn --arg name "$name" --argjson size "$(stat -c %s "source-a/$name")" --arg sha256 "$(sha256sum "source-a/$name" | cut -d' ' -f1)" '{name:$name,size:$size,sha256:$sha256}'; done | jq -s .)"
            source_a="$(jq -cn --arg tag "$A_TAG" --argjson sequence "$A_SEQUENCE" --arg commit "$commit" --argjson release_id "$(jq .id source-a-release.json)" --arg index_sha256 "$index_sha256" --argjson assets "$assets" '{tag:$tag,sequence:$sequence,commit:$commit,release_id:$release_id,release_identity:{repository:env.GITHUB_REPOSITORY,tag:$tag,commit:$commit,release_index_sha256:$index_sha256},assets:$assets}')"
            if test "$source_state" = rescue; then
              failed_run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$FAILED_RUN"
              jq -e --arg tag "$A_TAG" --argjson sequence "$A_SEQUENCE" --arg commit "$commit" --arg index_sha256 "$index_sha256" --arg run_url "$failed_run_url" '[.[] | select(.original_tag == $tag and .sequence == $sequence and .commit == $commit and .release_index_sha256 == $index_sha256 and .qualification_run_url == $run_url)] | length == 1' <<<"$burned" >/dev/null
              jq -e --arg run_url "$failed_run_url" '.body | contains($run_url)' source-a-release.json >/dev/null
            fi
          fi
          echo "source_state=$source_state" >> "$GITHUB_OUTPUT"
          echo "build_releases=$build_releases" >> "$GITHUB_OUTPUT"
          echo "source_a=$source_a" >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    strategy:
      fail-fast: true
      matrix:
        release: ${{ fromJSON(needs.preflight.outputs.build_releases) }}
        architecture: [amd64, arm64]
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - name: Build and natively verify the exact four-asset set
        env:
          TAG: ${{ matrix.release.tag }}
          SEQUENCE: ${{ matrix.release.sequence }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          mkdir -m 0700 release evidence
          for target in amd64 arm64; do
            go run ./cmd/sbxr-release -tag "$TAG" -commit "$GITHUB_SHA" -sequence "$SEQUENCE" -architecture "$target" -output "release/sbxr-linux-$target.tar.gz"
          done
          amd64_sha256="$(tar -xOzf release/sbxr-linux-amd64.tar.gz sbxr | sha256sum | cut -d' ' -f1)"
          arm64_sha256="$(tar -xOzf release/sbxr-linux-arm64.tar.gz sbxr | sha256sum | cut -d' ' -f1)"
          go run ./cmd/sbxr-release bootstrap -version "${TAG#v}" -tag "$TAG" -commit "$GITHUB_SHA" -sequence "$SEQUENCE" -amd64-executable-sha256 "$amd64_sha256" -arm64-executable-sha256 "$arm64_sha256" -output release/install.sh
          go run ./cmd/sbxr-release index -tag "$TAG" -commit "$GITHUB_SHA" -sequence "$SEQUENCE" -directory release -output release/release-index.json
          test "$(find release -maxdepth 1 -type f -printf '%f\n' | sort)" = "$(printf '%s\n' install.sh release-index.json sbxr-linux-amd64.tar.gz sbxr-linux-arm64.tar.gz | sort)"
          go run ./cmd/sbxr-release verify-package -directory release -architecture "$ARCHITECTURE"
          mkdir -m 0700 inspect
          tar -xzf "release/sbxr-linux-$ARCHITECTURE.tar.gz" -C inspect
          machine="$(readelf -h inspect/sbxr | sed -n 's/^  Machine: *//p')"
          case "$ARCHITECTURE" in
            amd64) test "$machine" = 'Advanced Micro Devices X86-64' ;;
            arm64) test "$machine" = AArch64 ;;
          esac
          if inspect/sbxr >non-root.out 2>non-root.err; then
            exit 1
          fi
          test ! -s non-root.out
          grep -Fx 'SBXR requires root authority.' non-root.err
          printf '0\n' | script -qec "sudo env TERM=xterm-256color LANG=C.UTF-8 '$PWD/inspect/sbxr'" menu.transcript
          grep -F 'Recovery required' menu.transcript
          grep -F 'Start recovery' menu.transcript
          secret_pattern='SBXR_USER_TOKEN_MARKER_00000000000000abcd|CLOUDFLARE-ROTATED-RUN-TOKEN-MARKER|profile-secret-marker|subscription-secret-marker|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|Authorization: Bearer '
          if grep -aERq "$secret_pattern" release inspect non-root.out non-root.err menu.transcript; then
            exit 1
          elif test $? -ne 1; then
            exit 1
          fi
          assets="$(for name in install.sh release-index.json sbxr-linux-amd64.tar.gz sbxr-linux-arm64.tar.gz; do jq -cn --arg name "$name" --arg sha256 "$(sha256sum "release/$name" | cut -d' ' -f1)" '{name:$name,sha256:$sha256}'; done | jq -s .)"
          jq -cn --arg tag "$TAG" --argjson sequence "$SEQUENCE" --arg architecture "$ARCHITECTURE" --arg runner '${{ matrix.runner }}' --argjson assets "$assets" '{tag:$tag,sequence:$sequence,architecture:$architecture,runner:$runner,assets:$assets}' > "evidence/native-$ARCHITECTURE.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-${{ matrix.release.tag }}-${{ matrix.architecture }}
          path: |
            release
            evidence
          if-no-files-found: error
          retention-days: 1

  drafts:
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-*
          path: native
      - name: Assemble, verify, upload, and re-download exact draft bytes
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RELEASES: ${{ needs.preflight.outputs.build_releases }}
          SOURCE_A: ${{ needs.preflight.outputs.source_a }}
        run: |
          set -euo pipefail
          mkdir -m 0700 constructed downloaded
          jq -cn --argjson source "$SOURCE_A" 'if $source == {} then [] else [$source] end' > drafts.json
          current_tag=''
          cleanup_unsigned_drafts() {
            status=$?
            trap - EXIT
            test "$status" -ne 0 || return 0
            if test -n "$current_tag" && jq -e --arg tag "$current_tag" --arg sha "$GITHUB_SHA" '.tag_name == $tag and .target_commitish == $sha and .draft == true and .prerelease == false and (.id | type == "number")' release.json >/dev/null 2>&1 && ! jq -e --arg tag "$current_tag" '.[] | select(.tag == $tag)' drafts.json >/dev/null; then
              jq --arg tag "$current_tag" --argjson sequence "$current_sequence" --argjson release_id "$(jq .id release.json)" --arg index_sha256 "$current_index_sha256" --argjson assets "$current_assets" '. += [{tag:$tag,sequence:$sequence,commit:env.GITHUB_SHA,release_id:$release_id,release_identity:{repository:env.GITHUB_REPOSITORY,tag:$tag,commit:env.GITHUB_SHA,release_index_sha256:$index_sha256},assets:$assets}]' drafts.json > drafts.next
              mv drafts.next drafts.json
            fi
            while read -r requested; do
              tag="$(jq -r .tag <<<"$requested")"
              entry="$(jq -c --arg tag "$tag" '.[] | select(.tag == $tag)' drafts.json)"
              test -n "$entry" || continue
              commit="$(jq -r .commit <<<"$entry")"
              release_id="$(jq -r .release_id <<<"$entry")"
              printf '%s\n' "$entry" > "$tag.cleanup.json"
              .github/scripts/recheck-qualified-release.sh "$tag.cleanup.json" "cleanup/$tag" cleanup-release.json partial
              jq -e '.draft == true and .prerelease == false' cleanup-release.json >/dev/null
              tag_exists=false
              if object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha 2>/dev/null)"; then test "$object" = "$commit"; tag_exists=true; fi
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id"
              test "$tag_exists" != true || gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag"
            done < <(jq -c '.[]' <<<"$BUILD_RELEASES")
            exit "$status"
          }
          trap cleanup_unsigned_drafts EXIT
          git fetch --force --tags origin
          burned="$(for burned_tag in $(git tag --list 'release-burned/*'); do git tag -l --format='%(contents)' "$burned_tag"; done | jq -s .)"
          while read -r release; do
            tag="$(jq -r .tag <<<"$release")"
            sequence="$(jq -r .sequence <<<"$release")"
            directory="constructed/$tag"
            mkdir -m 0700 "$directory" "downloaded/$tag"
            for architecture in amd64 arm64; do
              evidence="native/native-$tag-$architecture/evidence/native-$architecture.json"
              test "$(jq -r .tag "$evidence")" = "$tag"
              test "$(jq -r .sequence "$evidence")" -eq "$sequence"
            done
            for name in install.sh release-index.json sbxr-linux-amd64.tar.gz sbxr-linux-arm64.tar.gz; do
              cmp "native/native-$tag-amd64/release/$name" "native/native-$tag-arm64/release/$name"
              cp "native/native-$tag-amd64/release/$name" "$directory/$name"
            done
            test "$(find "$directory" -maxdepth 1 -type f -printf '%f\n' | sort)" = "$(printf '%s\n' install.sh release-index.json sbxr-linux-amd64.tar.gz sbxr-linux-arm64.tar.gz | sort)"
            go run ./cmd/sbxr-release verify-package -directory "$directory" -architecture amd64
            go run ./cmd/sbxr-release verify-package -directory "$directory" -architecture arm64
            index_sha256="$(sha256sum "$directory/release-index.json" | cut -d' ' -f1)"
            if jq -e --arg tag "$tag" --argjson sequence "$sequence" --arg commit "$GITHUB_SHA" --arg index_sha256 "$index_sha256" '.[] | select(.original_tag == $tag or .sequence == $sequence or (.commit == $commit and .release_index_sha256 == $index_sha256))' <<<"$burned" >/dev/null; then
              exit 1
            fi
            assets="$(for name in install.sh release-index.json sbxr-linux-amd64.tar.gz sbxr-linux-arm64.tar.gz; do jq -cn --arg name "$name" --argjson size "$(stat -c %s "$directory/$name")" --arg sha256 "$(sha256sum "$directory/$name" | cut -d' ' -f1)" '{name:$name,size:$size,sha256:$sha256}'; done | jq -s .)"
            current_tag=$tag
            current_sequence=$sequence
            current_index_sha256=$index_sha256
            current_assets=$assets
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" -f name="$tag" -f body='Qualification pending.' -F draft=true > release.json
            jq -e --arg tag "$tag" --arg sha "$GITHUB_SHA" '.tag_name == $tag and .target_commitish == $sha and .draft == true and .prerelease == false and (.assets | length) == 0' release.json >/dev/null
            jq --arg tag "$tag" --argjson sequence "$sequence" --argjson release_id "$(jq .id release.json)" --arg index_sha256 "$index_sha256" --argjson assets "$assets" '. += [{tag:$tag,sequence:$sequence,commit:env.GITHUB_SHA,release_id:$release_id,release_identity:{repository:env.GITHUB_REPOSITORY,tag:$tag,commit:env.GITHUB_SHA,release_index_sha256:$index_sha256},assets:$assets}]' drafts.json > drafts.next
            mv drafts.next drafts.json
            gh release upload "$tag" "$directory"/*
            gh api "repos/$GITHUB_REPOSITORY/releases/$(jq -r .id release.json)" > release.json
            jq -e --arg tag "$tag" --arg sha "$GITHUB_SHA" '.tag_name == $tag and .target_commitish == $sha and .draft == true and .prerelease == false and (.assets | length) == 4' release.json >/dev/null
            while read -r asset; do
              name="$(jq -r .name <<<"$asset")"
              id="$(jq -r .id <<<"$asset")"
              gh api "repos/$GITHUB_REPOSITORY/releases/assets/$id" -H 'Accept: application/octet-stream' > "downloaded/$tag/$name"
              cmp "$directory/$name" "downloaded/$tag/$name"
            done < <(jq -c '.assets[]' release.json)
          done < <(jq -c '.[]' <<<"$BUILD_RELEASES")
          trap - EXIT
          cp "$CHECKLIST" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualification-boundary-input
          path: |
            drafts.json
            installer-updater-vps.md
            native/*/evidence/native-*.json
          if-no-files-found: error
          retention-days: 90

  sign:
    needs: [preflight, drafts]
    runs-on: ubuntu-24.04
    environment: acceptance-vps
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qualification-boundary-input
      - name: Create the complete qualification manifest after approval
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          SOURCE_STATE: ${{ needs.preflight.outputs.source_state }}
          FAILED_RUN: ${{ inputs.failed_normal_run_id }}
          DEFECT_URL: ${{ inputs.defect_issue_url }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" > approvals.json
          approval="$(jq -c '[.[] | select(.state == "approved" and any(.environments[]; .name == "acceptance-vps"))] | last' approvals.json)"
          test "$approval" != null
          checklist_sha256="$(sha256sum installer-updater-vps.md | cut -d' ' -f1)"
          native_evidence="$(find native -name 'native-*.json' -type f -print0 | sort -z | xargs -0 sha256sum | jq -Rsc 'split("\n")[:-1] | map(capture("^(?<sha256>[0-9a-f]{64})  (?<path>.+)$"))')"
          jq -nS --slurpfile releases drafts.json --arg repository "$GITHUB_REPOSITORY" --arg workflow '.github/workflows/candidate.yml' --arg workflow_ref "$GITHUB_WORKFLOW_REF" --arg commit "$GITHUB_SHA" --arg run_id "$GITHUB_RUN_ID" --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --arg mode "$MODE" --arg source_state "$SOURCE_STATE" --argjson approval "$approval" --arg checklist_sha256 "$checklist_sha256" --argjson native_evidence "$native_evidence" --arg failed_normal_run_id "$FAILED_RUN" --arg defect_issue_url "$DEFECT_URL" '{schema:"sbxr-qualification-manifest-v1",repository:$repository,workflow:{path:$workflow,ref:$workflow_ref,commit:$commit,run_id:$run_id,run_url:$run_url},approval:$approval,mode:$mode,source_state:$source_state,releases:$releases[0],native_evidence:$native_evidence,acceptance_vps_checklist_sha256:$checklist_sha256,pinned_actions:["actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803","actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16","actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02","actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093","actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661"],rescue:(if $mode == "rescue" then {failed_normal_run_id:$failed_normal_run_id,defect_issue_url:$defect_issue_url} else null end)}' > qualification-manifest.json
          jq -nS --arg schema sbxr-candidate-failure-state-v1 --arg workflow "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --arg recorded_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg public_verifier '1.3.0 26B3382D5700AFBCD84F980D1D5B6C52BFF743DC2A8EE86B8B44C8E1245CE485' '{schema:$schema,workflow_run:$workflow,recorded_at:$recorded_at,runner:"Ubuntu Server 24.04 linux/amd64",software:{go_toolchain:"Not started",public_verifier:$public_verifier},stages:{integrated_verification:"Pending",codex_live_acceptance:"Pending"},evidence:[($workflow+"#artifacts")]}' > candidate-failure-state.json
          jq --arg state "$(sha256sum candidate-failure-state.json | cut -d' ' -f1)" '.candidate_failure_state_sha256 = $state' qualification-manifest.json > qualification-manifest.next
          mv qualification-manifest.next qualification-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-qualification-manifest
          path: |
            qualification-manifest.json
            candidate-failure-state.json
            drafts.json
            installer-updater-vps.md
          if-no-files-found: error
          retention-days: 90
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-path: qualification-manifest.json

  acceptance-vps:
    needs: [preflight, sign]
    runs-on: ubuntu-24.04
    environment: acceptance-vps
    permissions:
      actions: read
      attestations: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      ACCEPTANCE_VPS_HOST: ${{ secrets.ACCEPTANCE_VPS_HOST }}
      ACCEPTANCE_VPS_HOST_KEY: ${{ secrets.ACCEPTANCE_VPS_HOST_KEY }}
      ACCEPTANCE_VPS_SSH_PRIVATE_KEY: ${{ secrets.ACCEPTANCE_VPS_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - name: Initialize exact candidate failure evidence
        run: |
          set -euo pipefail
          jq -nS --arg schema sbxr-candidate-failure-state-v1 --arg workflow "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --arg recorded_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg public_verifier '1.3.0 26B3382D5700AFBCD84F980D1D5B6C52BFF743DC2A8EE86B8B44C8E1245CE485' '{schema:$schema,workflow_run:$workflow,recorded_at:$recorded_at,runner:"Ubuntu Server 24.04 linux/amd64",software:{go_toolchain:"Not started",public_verifier:$public_verifier},stages:{integrated_verification:"Pending",codex_live_acceptance:"Pending"},evidence:[($workflow+"#artifacts")]}' > candidate-failure-state.json
      - name: Record the acceptance toolchain
        run: |
          set -euo pipefail
          jq --arg go_toolchain "$(go version | awk '{print $3}')" '.software.go_toolchain = $go_toolchain' candidate-failure-state.json > candidate-failure-state.next
          mv candidate-failure-state.next candidate-failure-state.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: signed-qualification-manifest
          path: handoff
      - name: Verify and assemble the root-only qualification handoff
        run: |
          set -euo pipefail
          test -n "$ACCEPTANCE_VPS_HOST"
          test -n "$ACCEPTANCE_VPS_HOST_KEY"
          test -n "$ACCEPTANCE_VPS_SSH_PRIVATE_KEY"
          cd handoff
          gh attestation download qualification-manifest.json --repo "$GITHUB_REPOSITORY" --limit 1
          bundle="$(find . -maxdepth 1 -name 'sha256:*.jsonl' -type f -print -quit)"
          test -n "$bundle"
          gh attestation verify qualification-manifest.json --bundle "$bundle" --repo "$GITHUB_REPOSITORY" --signer-workflow albertloky/SBXR/.github/workflows/candidate.yml --source-ref refs/heads/main --source-digest "$GITHUB_SHA" >/dev/null
          mv "$bundle" qualification.bundle
          mkdir -m 0700 assets
          source_state="$(jq -r .source_state qualification-manifest.json)"
          index=0
          while read -r release; do
            tag="$(jq -r .tag <<<"$release")"
            release_id="$(jq -r .release_id <<<"$release")"
            mkdir -m 0700 "assets/$tag"
            gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > release.json
            jq -e --arg tag "$tag" --arg commit "$(jq -r .commit <<<"$release")" '.tag_name == $tag and .target_commitish == $commit and (.assets | length) == 4' release.json >/dev/null
            if test "$index" -eq 0 && test "$source_state" != initial-normal; then
              if test "$source_state" = later-normal; then
                jq -e '.draft == false and .prerelease == false and .immutable == true' release.json >/dev/null
              else
                test "$source_state" = rescue
                jq -e '.draft == false and .prerelease == true and .immutable == true' release.json >/dev/null
              fi
            else
              jq -e '.draft == true and .prerelease == false and .immutable == false' release.json >/dev/null
            fi
            while read -r asset; do
              name="$(jq -r .name <<<"$asset")"
              proof="$(jq -c --arg name "$name" '.assets[] | select(.name == $name)' <<<"$release")"
              test -n "$proof"
              gh api "repos/$GITHUB_REPOSITORY/releases/assets/$(jq -r .id <<<"$asset")" -H 'Accept: application/octet-stream' > "assets/$tag/$name"
              test "$(stat -c %s "assets/$tag/$name")" -eq "$(jq -r .size <<<"$proof")"
              test "$(sha256sum "assets/$tag/$name" | cut -d' ' -f1)" = "$(jq -r .sha256 <<<"$proof")"
            done < <(jq -c '.assets[]' release.json)
            test "$(find "assets/$tag" -maxdepth 1 -type f -printf '%f\n' | sort)" = "$(printf '%s\n' install.sh release-index.json sbxr-linux-amd64.tar.gz sbxr-linux-arm64.tar.gz | sort)"
            index=$((index + 1))
          done < <(jq -c '.releases[]' qualification-manifest.json)
          cd ..
          go build -o handoff/sbxr-release ./cmd/sbxr-release
          cp .github/scripts/installer-updater-vps.sh handoff/
          openssl req -x509 -newkey rsa:3072 -nodes -days 2 -subj '/CN=SBXR Qualification CA' -keyout handoff/ca.key -out handoff/ca.crt
          openssl req -newkey rsa:3072 -nodes -subj '/CN=api.github.com' -keyout handoff/gateway.key -out handoff/gateway.csr
          printf '%s\n' 'subjectAltName=DNS:api.github.com,DNS:github.com' 'extendedKeyUsage=serverAuth' > handoff/gateway.ext
          openssl x509 -req -days 2 -in handoff/gateway.csr -CA handoff/ca.crt -CAkey handoff/ca.key -CAcreateserial -extfile handoff/gateway.ext -out handoff/gateway.crt
          rm handoff/ca.key handoff/gateway.csr handoff/gateway.ext handoff/ca.srl handoff/release.json
      - name: Run the unchanged packaged A-to-B journey
        id: journey
        run: |
          set -euo pipefail
          jq '.stages.integrated_verification = "Running" | .stages.codex_live_acceptance = "Running"' candidate-failure-state.json > candidate-failure-state.next
          mv candidate-failure-state.next candidate-failure-state.json
          install -m 0600 /dev/null ssh.key
          printf '%s\n' "$ACCEPTANCE_VPS_SSH_PRIVATE_KEY" > ssh.key
          printf '%s %s\n' "$ACCEPTANCE_VPS_HOST" "$ACCEPTANCE_VPS_HOST_KEY" > known_hosts
          ssh_options=(-i "$PWD/ssh.key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$PWD/known_hosts" -o ConnectTimeout=15)
          cleanup() {
            rm -f ssh.key known_hosts handoff/gateway.key
          }
          trap cleanup EXIT
          tar -C handoff -czf qualification-handoff.tgz qualification-manifest.json qualification.bundle installer-updater-vps.md installer-updater-vps.sh sbxr-release gateway.crt gateway.key ca.crt assets
          scp "${ssh_options[@]}" qualification-handoff.tgz "root@$ACCEPTANCE_VPS_HOST:/root/qualification-handoff.tgz"
          ssh "${ssh_options[@]}" "root@$ACCEPTANCE_VPS_HOST" 'bash -se' <<'REMOTE'
          test "$(. /etc/os-release; printf '%s:%s' "$ID" "$VERSION_ID")" = ubuntu:24.04
          test "$(uname -m)" = x86_64
          command -v strace >/dev/null
          test ! -e /usr/local/bin/sbxr
          test ! -e /var/lib/sbxr
          install -d -m 0700 /run/sbxr-qualification
          tar -xzf /root/qualification-handoff.tgz -C /run/sbxr-qualification
          chmod 0700 /run/sbxr-qualification/sbxr-release /run/sbxr-qualification/installer-updater-vps.sh
          chmod 0600 /run/sbxr-qualification/qualification-manifest.json /run/sbxr-qualification/qualification.bundle /run/sbxr-qualification/gateway.key
          install -m 0700 /run/sbxr-qualification/sbxr-release /root/sbxr-qualification-gateway
          cp -a /etc/hosts /run/sbxr-qualification/hosts.original
          printf '\n127.0.0.1 api.github.com github.com\n' >> /etc/hosts
          install -m 0644 /run/sbxr-qualification/ca.crt /usr/local/share/ca-certificates/sbxr-qualification.crt
          update-ca-certificates >/dev/null
          nohup /root/sbxr-qualification-gateway gateway -manifest /run/sbxr-qualification/qualification-manifest.json -bundle /run/sbxr-qualification/qualification.bundle -assets /run/sbxr-qualification/assets -certificate /run/sbxr-qualification/gateway.crt -key /run/sbxr-qualification/gateway.key -control /run/sbxr-qualification >/run/sbxr-qualification/gateway.log 2>&1 &
          printf '%s\n' "$!" > /run/sbxr-qualification/gateway.pid
          for _ in $(seq 1 100); do curl -fsS https://api.github.com/repos/albertloky/SBXR/releases/latest >/dev/null && exit 0; sleep .1; done
          exit 1
          REMOTE
          ssh "${ssh_options[@]}" "root@$ACCEPTANCE_VPS_HOST" 'touch /run/sbxr-qualification/original-session; while test -e /run/sbxr-qualification/original-session; do sleep 1; done' &
          original_session=$!
          sleep 1
          kill -0 "$original_session"
          manifest=handoff/qualification-manifest.json
          a="$(jq -c '.releases[0]' "$manifest")"
          b="$(jq -c '.releases[1]' "$manifest")"
          remote_environment="A_TAG=$(jq -r .tag <<<"$a") A_SEQUENCE=$(jq -r .sequence <<<"$a") A_COMMIT=$(jq -r .commit <<<"$a") A_INDEX_SHA256=$(jq -r .release_identity.release_index_sha256 <<<"$a") B_TAG=$(jq -r .tag <<<"$b") B_SEQUENCE=$(jq -r .sequence <<<"$b") B_COMMIT=$(jq -r .commit <<<"$b") B_INDEX_SHA256=$(jq -r .release_identity.release_index_sha256 <<<"$b") MODE=${{ inputs.mode }}"
          ssh "${ssh_options[@]}" "root@$ACCEPTANCE_VPS_HOST" "$remote_environment /usr/bin/bash /run/sbxr-qualification/installer-updater-vps.sh" &
          journey=$!
          if test '${{ inputs.mode }}' = rescue; then
            stages=(rescue-direct-b rescue-source-a rescue-replace-b)
          else
            stages=(installed-a pre-prepared recovered-prepared recovered-activated recovered-committed)
          fi
          for stage in "${stages[@]}"; do
            for _ in $(seq 1 3600); do
              if ssh "${ssh_options[@]}" "root@$ACCEPTANCE_VPS_HOST" "test -e /run/sbxr-qualification/stage-$stage"; then break; fi
              kill -0 "$journey"
              sleep 1
            done
            kill -0 "$original_session"
            ssh "${ssh_options[@]}" "root@$ACCEPTANCE_VPS_HOST" 'true'
            ssh "${ssh_options[@]}" "root@$ACCEPTANCE_VPS_HOST" "touch /run/sbxr-qualification/stage-$stage-ack"
          done
          wait "$journey"
          kill -0 "$original_session"
          scp "${ssh_options[@]}" "root@$ACCEPTANCE_VPS_HOST:/run/sbxr-qualification/acceptance-vps-evidence.json" handoff/
          jq -e '.schema == "sbxr-acceptance-vps-evidence-v1" and .secret_safe == true' handoff/acceptance-vps-evidence.json >/dev/null
          jq '.stages.integrated_verification = "Passed"' candidate-failure-state.json > candidate-failure-state.next
          mv candidate-failure-state.next candidate-failure-state.json
          ssh "${ssh_options[@]}" "root@$ACCEPTANCE_VPS_HOST" 'bash -se' <<'REMOTE'
          cp -a /run/sbxr-qualification/hosts.original /etc/hosts
          rm -f /usr/local/share/ca-certificates/sbxr-qualification.crt
          update-ca-certificates --fresh >/dev/null
          kill "$(cat /run/sbxr-qualification/gateway.pid)"
          rm -f /run/sbxr-qualification/original-session
          find /run/sbxr-qualification -depth -delete
          rm -f /root/qualification-handoff.tgz
          rm -f /root/sbxr-qualification-gateway
          test "$(getent ahostsv4 api.github.com | awk 'NR==1 {print $1}')" != 127.0.0.1
          test "$(getent ahostsv4 github.com | awk 'NR==1 {print $1}')" != 127.0.0.1
          normal_release="$(curl -fsS https://api.github.com/repos/albertloky/SBXR/releases/latest)"
          ! grep -F sbxr_qualification <<<"$normal_release"
          curl -fsSI https://github.com/ >/dev/null
          test "$(find /var/lib/sbxr -mindepth 1 -maxdepth 1 -printf '%f\n')" = installed.json
          printf '0\n' | script -qec 'env TERM=xterm-256color LANG=C.UTF-8 /usr/local/bin/sbxr' /dev/null | grep -F 'Status: Ready'
          REMOTE
          wait "$original_session"
          jq '.stages.codex_live_acceptance = "Passed"' candidate-failure-state.json > candidate-failure-state.next
          mv candidate-failure-state.next candidate-failure-state.json
      - name: Finalize exact candidate failure evidence
        if: always()
        run: |
          set -euo pipefail
          jq '(.stages[] | select(. == "Running")) = "Failed"' candidate-failure-state.json > candidate-failure-state.next
          mv candidate-failure-state.next candidate-failure-state.json
      - name: Write separate machine-verifiable A and B Acceptance Records
        env:
          MODE: ${{ inputs.mode }}
          SOURCE_STATE: ${{ needs.preflight.outputs.source_state }}
          DEFECT_URL: ${{ inputs.defect_issue_url }}
          FAILED_RUN: ${{ inputs.failed_normal_run_id }}
        run: |
          set -euo pipefail
          mkdir -m 0700 acceptance-records
          result=RELEASE-INSTALLER-UPDATER-TWO-RELEASE-QUALIFICATION
          test "$MODE" = normal || result=RELEASE-INSTALLER-UPDATER-RESCUE-QUALIFICATION
          go_toolchain="$(go version | awk '{print $3}')"
          accepted_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          workflow_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          journey="$(cat handoff/acceptance-vps-evidence.json)"
          for index in 0 1; do
            release="$(jq -c ".releases[$index]" handoff/qualification-manifest.json)"
            tag="$(jq -r .tag <<<"$release")"
            role="$(.github/scripts/release-role.sh handoff/qualification-manifest.json "$tag")"
            canonical="$(jq -cnS --arg schema sbxr-acceptance-record-v1 --arg repository "$GITHUB_REPOSITORY" --arg tag "$tag" --arg commit "$(jq -r .commit <<<"$release")" --arg index_sha256 "$(jq -r .release_identity.release_index_sha256 <<<"$release")" --argjson sequence "$(jq .sequence <<<"$release")" --arg workflow "$workflow_url" --arg accepted_at "$accepted_at" --arg role "$role" --arg code "$result" --argjson assets "$(jq .assets <<<"$release")" --argjson journey "$journey" '{schema:$schema,release_identity:{repository:$repository,tag:$tag,commit:$commit,release_index_sha256:$index_sha256},sequence:$sequence,assets:$assets,workflow_run:$workflow,accepted_at:$accepted_at,runner:"Ubuntu Server 24.04 linux/amd64",stages:{module_verification:"Passed",seam_verification:"Passed",integrated_verification:"Passed on live Ubuntu Server 24.04 amd64",codex_live_acceptance:"Passed",owner_acceptance:"Not required"},journey:$journey,qualification_role:$role,stable_result_code:$code,secret_safe_result:"Passed",evidence:[($workflow+"#artifacts")]}' )"
            record="acceptance-records/$tag.md"
            {
              echo '# SBXR Installer-Updater Acceptance Record'
              echo 'Status: Qualified'
              echo "Repository: $GITHUB_REPOSITORY"
              echo "Tag: $tag"
              echo "Commit: $(jq -r .commit <<<"$release")"
              echo "Release index SHA-256: $(jq -r .release_identity.release_index_sha256 <<<"$release")"
              echo "Sequence: $(jq -r .sequence <<<"$release")"
              echo "Workflow evidence: $workflow_url"
              echo "Acceptance time: $accepted_at"
              echo 'Runner: Ubuntu Server 24.04 linux/amd64'
              echo "Go toolchain: $go_toolchain"
              echo 'Public verifier: 1.3.0 26B3382D5700AFBCD84F980D1D5B6C52BFF743DC2A8EE86B8B44C8E1245CE485'
              echo 'Secret-safe result: Passed'
              echo "Qualification role: $role"
              echo "Stable result code: $result"
              echo 'Module Verification: Passed'
              echo 'Seam Verification: Passed'
              echo 'Integrated Verification: Passed on live Ubuntu Server 24.04 amd64'
              echo 'Codex Live Acceptance: Passed'
              echo 'Owner Acceptance: Not required'
              jq -r '.assets[] | "Asset: \(.name) \(.size) \(.sha256)"' <<<"$release"
              if test "$MODE" = rescue; then
                echo "Rescue defect evidence: $DEFECT_URL"
                echo "Failed normal run evidence: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$FAILED_RUN"
                echo 'Normal journey waiver: Reproducible installed-source defect made the normal menu journey impossible'
              fi
              echo '```json'
              echo "$canonical"
              echo '```'
            } > "$record"
            if test "$index" -eq 1 || test "$SOURCE_STATE" = initial-normal; then
              gh release edit "$tag" --draft --notes-file "$record"
            fi
          done
          if grep -aERq 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|Authorization: Bearer ' acceptance-records handoff/acceptance-vps-evidence.json; then exit 1; elif test $? -ne 1; then exit 1; fi
          cat acceptance-records/*.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installer-updater-acceptance-${{ github.run_id }}
          path: |
            acceptance-records
            handoff/acceptance-vps-evidence.json
            handoff/qualification-manifest.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: candidate-failure-state-${{ github.run_id }}
          path: candidate-failure-state.json
          if-no-files-found: error
          retention-days: 90

  cleanup-unqualified:
    if: always() && needs.drafts.result != 'skipped' && needs.acceptance-vps.result != 'success'
    needs: [preflight, drafts, sign, acceptance-vps]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Recheck and retain or remove only this run's failed releases
        id: boundary
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RELEASES: ${{ needs.preflight.outputs.build_releases }}
        run: |
          set -euo pipefail
          signed=false
          echo 'signed=false' >> "$GITHUB_OUTPUT"
          echo 'recorded=false' >> "$GITHUB_OUTPUT"
          mkdir -m 0700 boundary
          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "signed-qualification-manifest" and .expired == false) | .id')"
          if test -n "$artifact_id"; then
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name signed-qualification-manifest --dir boundary
            if gh attestation verify boundary/qualification-manifest.json --repo "$GITHUB_REPOSITORY" --signer-workflow albertloky/SBXR/.github/workflows/candidate.yml --source-ref refs/heads/main --source-digest "$GITHUB_SHA" >/dev/null; then
              jq -e --arg run "$GITHUB_RUN_ID" --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --arg commit "$GITHUB_SHA" '.schema == "sbxr-qualification-manifest-v1" and .repository == env.GITHUB_REPOSITORY and .workflow.path == ".github/workflows/candidate.yml" and .workflow.ref == "albertloky/SBXR/.github/workflows/candidate.yml@refs/heads/main" and .workflow.commit == $commit and .workflow.run_id == $run and .workflow.run_url == $url' boundary/qualification-manifest.json >/dev/null
              mkdir -m 0700 boundary/burned
              git config user.name github-actions
              git config user.email 41898282+github-actions[bot]@users.noreply.github.com
              git fetch --force --tags origin
              recorded_at="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)"
              : > boundary/burn-refs
              while read -r release; do
                tag="$(jq -r .tag <<<"$release")"
                entry="$(jq -c --arg tag "$tag" '.releases[] | select(.tag == $tag)' boundary/qualification-manifest.json)"
                test -n "$entry"
                commit="$(jq -r .commit <<<"$entry")"
                printf '%s\n' "$entry" > "boundary/$tag.json"
                .github/scripts/recheck-qualified-release.sh "boundary/$tag.json" "boundary/rechecked/$tag" boundary/release.json
                if ! jq -e '.draft == true and .prerelease == false' boundary/release.json >/dev/null; then
                  jq -e '.draft == false and .prerelease == true and .immutable == true' boundary/release.json >/dev/null
                  .github/scripts/write-failed-acceptance-record.sh "boundary/$tag.json" boundary/release.json "boundary/$tag.failed.md" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" RELEASE-INSTALLER-UPDATER-QUALIFICATION-FAILED boundary/qualification-manifest.json /dev/null
                fi
                payload="boundary/burned/${tag}.json"
                jq -nS --arg original_tag "$tag" --argjson sequence "$(jq .sequence <<<"$entry")" --arg commit "$commit" --arg release_index_sha256 "$(jq -r .release_identity.release_index_sha256 <<<"$entry")" --arg qualification_run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --arg reason post-sign-qualification-failure --arg recorded_at "$recorded_at" '{original_tag:$original_tag,sequence:$sequence,commit:$commit,release_index_sha256:$release_index_sha256,qualification_run_url:$qualification_run_url,reason:$reason,recorded_at:$recorded_at}' > "$payload"
                .github/scripts/prepare-burn-tag.sh "$payload" "$tag" "$commit" >> boundary/burn-refs
              done < <(jq -c '.[]' <<<"$BUILD_RELEASES")
              signed=true
              echo 'signed=true' >> "$GITHUB_OUTPUT"
            fi
          fi
          if test "$signed" != true && gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name qualification-boundary-input --dir boundary/unsigned 2>/dev/null; then
            echo 'recorded=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        if: steps.boundary.outputs.signed == 'true'
        with:
          subject-path: boundary/burned/*.json
      - name: Publish the complete attested burned ledger atomically
        if: steps.boundary.outputs.signed == 'true'
        env:
          BUILD_RELEASES: ${{ needs.preflight.outputs.build_releases }}
        run: |
          set -euo pipefail
          mapfile -t refs < <(sed '/^$/d' boundary/burn-refs)
          test "${#refs[@]}" -eq 0 || git push --atomic origin "${refs[@]}"
      - name: Publish the rechecked burned releases as failed prereleases
        if: steps.boundary.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RELEASES: ${{ needs.preflight.outputs.build_releases }}
        run: |
          set -euo pipefail
          mkdir -m 0700 boundary/failure-state
          if ! gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "candidate-failure-state-$GITHUB_RUN_ID" --dir boundary/failure-state 2>/dev/null; then
            cp boundary/candidate-failure-state.json boundary/failure-state/candidate-failure-state.json
          fi
          if cmp -s boundary/candidate-failure-state.json boundary/failure-state/candidate-failure-state.json; then
            test "$(sha256sum boundary/failure-state/candidate-failure-state.json | cut -d' ' -f1)" = "$(jq -r .candidate_failure_state_sha256 boundary/qualification-manifest.json)"
          fi
          while read -r release; do
            tag="$(jq -r .tag <<<"$release")"
            .github/scripts/recheck-qualified-release.sh "boundary/$tag.json" "boundary/final/$tag" boundary/final-release.json
            .github/scripts/write-failed-acceptance-record.sh "boundary/$tag.json" boundary/final-release.json "boundary/$tag.failed.md" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" RELEASE-INSTALLER-UPDATER-QUALIFICATION-FAILED boundary/qualification-manifest.json boundary/failure-state/candidate-failure-state.json
            if jq -e '.draft == true and .prerelease == false' boundary/final-release.json >/dev/null; then
              gh release edit "$tag" --notes-file "boundary/$tag.failed.md" --draft=false --prerelease --latest=false
            else
              jq -e '.draft == false and .prerelease == true and .immutable == true' boundary/final-release.json >/dev/null
              jq -j .body boundary/final-release.json | cmp - "boundary/$tag.failed.md"
            fi
          done < <(jq -c '.[]' <<<"$BUILD_RELEASES")
      - name: Remove only this run's fully recorded unsigned drafts and tags
        if: steps.boundary.outputs.signed != 'true' && steps.boundary.outputs.recorded == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RELEASES: ${{ needs.preflight.outputs.build_releases }}
        run: |
          set -euo pipefail
          while read -r release; do
            tag="$(jq -r .tag <<<"$release")"
            test "$(jq --arg tag "$tag" '[.[] | select(.tag == $tag)] | length' boundary/unsigned/drafts.json)" -eq 1
          done < <(jq -c '.[]' <<<"$BUILD_RELEASES")
          while read -r release; do
            tag="$(jq -r .tag <<<"$release")"
            entry="$(jq -c --arg tag "$tag" '.[] | select(.tag == $tag)' boundary/unsigned/drafts.json)"
            test -n "$entry"
            printf '%s\n' "$entry" > "boundary/unsigned/$tag.json"
            release_id="$(jq -r .release_id <<<"$entry")"
            commit="$(jq -r .commit <<<"$entry")"
            if ! gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" >/dev/null 2>&1; then
              if object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha 2>/dev/null)"; then
                test "$object" = "$commit"
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag"
              fi
              continue
            fi
            .github/scripts/recheck-qualified-release.sh "boundary/unsigned/$tag.json" "boundary/unsigned/rechecked/$tag" boundary/unsigned/release.json
            jq -e '.draft == true and .prerelease == false' boundary/unsigned/release.json >/dev/null
            tag_exists=false
            if object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha 2>/dev/null)"; then test "$object" = "$commit"; tag_exists=true; fi
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id"
            test "$tag_exists" != true || gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag"
          done < <(jq -c '.[]' <<<"$BUILD_RELEASES")
