name: Mint immutable candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable candidate tag
        required: true
        type: string
      version:
        description: Index version without v prefix
        required: true
        type: string
      sequence:
        description: Monotonic release sequence
        required: true
        type: number
  release:
    types: [published]

permissions:
  attestations: read
  contents: read

env:
  CANDIDATE_TAG: ${{ inputs.tag }}
  CANDIDATE_VERSION: ${{ inputs.version }}
  CANDIDATE_SEQUENCE: ${{ inputs.sequence }}

concurrency:
  group: candidate-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: true
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build and natively qualify exact architecture assets
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -m 0700 dist
          go run ./cmd/sbxr-release \
            -tag "$CANDIDATE_TAG" \
            -commit "$GITHUB_SHA" \
            -architecture '${{ matrix.architecture }}' \
            -output 'dist/sbxr-linux-${{ matrix.architecture }}.tar.gz' \
            -component-output 'dist/sbxr-components-linux-${{ matrix.architecture }}.tar.gz'
          mkdir -m 0700 inspect
          test "$(tar -tzf 'dist/sbxr-linux-${{ matrix.architecture }}.tar.gz')" = sbxr
          tar -xzf 'dist/sbxr-linux-${{ matrix.architecture }}.tar.gz' -C inspect
          inspect/sbxr version --json > version.json
          jq -e \
            --arg tag "$CANDIDATE_TAG" \
            --arg commit "$GITHUB_SHA" \
            --arg architecture '${{ matrix.architecture }}' \
            '.build.repository == "albertloky/SBXR" and .build.tag == $tag and .build.commit == $commit and .architecture == $architecture and .state_schema == 2 and (.build.payload_sha256 | test("^[0-9a-f]{64}$"))' \
            version.json
          qualification='package-qualification-${{ matrix.architecture }}.json'
          inspect/sbxr acceptance staged-onboarding --components 'dist/sbxr-components-linux-${{ matrix.architecture }}.tar.gz' --json > "$qualification"
          go run ./cmd/sbxr-release validate-package-qualification \
            -application 'dist/sbxr-linux-${{ matrix.architecture }}.tar.gz' \
            -components 'dist/sbxr-components-linux-${{ matrix.architecture }}.tar.gz' \
            -evidence "$qualification"
          component_sha256="$(sha256sum 'dist/sbxr-components-linux-${{ matrix.architecture }}.tar.gz' | cut -d ' ' -f 1)"
          jq -e \
            --slurpfile version version.json \
            --arg component_sha256 "$component_sha256" \
            'keys == ["architecture", "build", "component", "procedures", "schema"] and
             .schema == 1 and .build == $version[0].build and .architecture == $version[0].architecture and
             (.component | keys == ["archive_sha256", "certbot", "cloudflared", "python", "sing_box", "xray"]) and
             .component.archive_sha256 == $component_sha256 and .component.xray == "v26.3.27" and
             .component.sing_box == "v1.13.16" and .component.cloudflared == "2026.7.3" and
             .component.certbot == "5.4.0" and .component.python == "3.12" and
             all(.procedures[]; keys == ["code", "status"] and .status == "Passed") and
             (.procedures | map(.code)) == ["RELEASE-STAGED-INSTALL-REVISION-1", "RELEASE-CLOUDFLARE-PROFILE-SETUP-N-TO-N+1", "RELEASE-STAGED-ONBOARDING-CHAIN", "RELEASE-STAGED-ONBOARDING-SECRET-SCAN", "RELEASE-STAGED-ONBOARDING-CLIENT-OUTPUT", "RELEASE-STAGED-ONBOARDING-TERMINAL", "RELEASE-STAGED-ONBOARDING-GUIDE-TEXT"]' \
            "$qualification"
          pattern='MARKER|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|Authorization: Bearer '
          test -z "$(rg -a -l "$pattern" "$qualification")"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.architecture }}
          path: |
            dist/sbxr-linux-${{ matrix.architecture }}.tar.gz
            dist/sbxr-components-linux-${{ matrix.architecture }}.tar.gz
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: prepublication-package-qualification-${{ matrix.architecture }}
          path: package-qualification-${{ matrix.architecture }}.json
          if-no-files-found: error
          retention-days: 90

  qualify:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: prepublication-package-qualification-*
          path: qualification
          merge-multiple: true
      - name: Generate the exact release bootstrap
        run: |
          go run ./cmd/sbxr-release bootstrap \
            -version "$CANDIDATE_VERSION" \
            -sequence "$CANDIDATE_SEQUENCE" \
            -tag "$CANDIDATE_TAG" \
            -commit "$GITHUB_SHA" \
            -output dist/install.sh
          test "$(stat -c '%a' dist/install.sh)" = 700
          if dist/install.sh >bootstrap.out 2>&1; then
            exit 1
          fi
          test "$(cat bootstrap.out)" = SBXR-BOOTSTRAP-REFUSED
      - name: Build strict release index from exact asset bytes
        run: |
          go run ./cmd/sbxr-release index \
            -version "$CANDIDATE_VERSION" \
            -sequence "$CANDIDATE_SEQUENCE" \
            -tag "$CANDIDATE_TAG" \
            -commit "$GITHUB_SHA" \
            -directory dist \
            -output dist/release-index.json
      - name: Bind the staged-onboarding specification authority
        run: |
          git merge-base --is-ancestor b4c2c70 HEAD
      - name: Run complete automated verification before publication
        run: |
          go list ./... | grep -v '/internal/ownerconsole$' | xargs go test -count=1
          go test ./internal/ownerconsole -count=1
          go list ./... | grep -v '/internal/ownerconsole$' | xargs go test -race -p 1 -count=1
          go vet ./...
      - name: Run Ubuntu Adapter package seams before publication
        run: |
          sudo apt-get update
          sudo apt-get install --yes iproute2 nftables
          sudo env "PATH=$PATH" go test ./internal/networkpolicy/adapter/ubuntu -run TestProductionUbuntuSeam -count=1
          sudo env "PATH=$PATH" SBXR_CONTROLLED_FIREWALL_SEAM=1 go test ./internal/systemchanges/adapter/ubuntu -run TestProductionFirewallSeam -count=1
      - name: Refuse secret markers in release assets
        run: |
          pattern='MARKER|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|Authorization: Bearer '
          test -z "$(rg -a -l "$pattern" dist/install.sh dist/release-index.json)"
          for archive in dist/sbxr-linux-amd64.tar.gz dist/sbxr-linux-arm64.tar.gz dist/sbxr-components-linux-amd64.tar.gz dist/sbxr-components-linux-arm64.tar.gz; do
            test -z "$(tar -xOzf "$archive" | rg -a -l "$pattern" -)"
          done
      - name: Require both native Package Qualification results
        run: |
          test "$(find qualification -maxdepth 1 -type f -printf '%f\n' | sort)" = "$(printf '%s\n' package-qualification-amd64.json package-qualification-arm64.json | sort)"
          for architecture in amd64 arm64; do
            evidence="qualification/package-qualification-$architecture.json"
            go run ./cmd/sbxr-release validate-package-qualification \
              -application "dist/sbxr-linux-$architecture.tar.gz" \
              -components "dist/sbxr-components-linux-$architecture.tar.gz" \
              -evidence "$evidence"
            component_sha256="$(sha256sum "dist/sbxr-components-linux-$architecture.tar.gz" | cut -d ' ' -f 1)"
            jq -e \
              --arg architecture "$architecture" \
              --arg tag "$CANDIDATE_TAG" \
              --arg commit "$GITHUB_SHA" \
              --arg component_sha256 "$component_sha256" \
              '.schema == 1 and .build.repository == "albertloky/SBXR" and .build.tag == $tag and
               .build.commit == $commit and .architecture == $architecture and
               .component.archive_sha256 == $component_sha256 and
               (.procedures | map(.code)) == ["RELEASE-STAGED-INSTALL-REVISION-1", "RELEASE-CLOUDFLARE-PROFILE-SETUP-N-TO-N+1", "RELEASE-STAGED-ONBOARDING-CHAIN", "RELEASE-STAGED-ONBOARDING-SECRET-SCAN", "RELEASE-STAGED-ONBOARDING-CLIENT-OUTPUT", "RELEASE-STAGED-ONBOARDING-TERMINAL", "RELEASE-STAGED-ONBOARDING-GUIDE-TEXT"] and
               all(.procedures[]; .status == "Passed")' \
              "$evidence"
          done
          pattern='MARKER|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|Authorization: Bearer '
          test -z "$(rg -a -l "$pattern" qualification)"
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: |
            dist/install.sh
            dist/release-index.json
            dist/sbxr-linux-amd64.tar.gz
            dist/sbxr-linux-arm64.tar.gz
            dist/sbxr-components-linux-amd64.tar.gz
            dist/sbxr-components-linux-arm64.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Record prepublication stage matrix
        run: |
          index_sha256="$(sha256sum dist/release-index.json | cut -d ' ' -f 1)"
          {
            echo '## Automated Acceptance Ladder'
            echo
            echo '| Stage | Status | Evidence |'
            echo '|---|---|---|'
            echo '| Module Verification | Passed | Complete suite with PTY package isolated; race detector on every non-PTY package; `go vet ./...` |'
            echo '| Seam Verification | Pending | GitHub attestation exists only after publication |'
            echo '| Integrated Verification | Pending | Exact published bytes have not passed the production release verifier |'
            echo 'Required procedures: RELEASE-STAGED-INSTALL-REVISION-1, RELEASE-CLOUDFLARE-PROFILE-SETUP-N-TO-N+1, RELEASE-STAGED-ONBOARDING-CHAIN, RELEASE-STAGED-ONBOARDING-SECRET-SCAN, RELEASE-STAGED-ONBOARDING-CLIENT-OUTPUT, RELEASE-STAGED-ONBOARDING-TERMINAL, RELEASE-STAGED-ONBOARDING-GUIDE-TEXT'
            echo
            echo 'Codex Live Acceptance: Not required — staged-onboarding package and controlled-seam qualification scope.'
            echo 'Owner Acceptance: Not required — staged-onboarding package and controlled-terminal qualification scope.'
            echo 'No live VPS, real Cloudflare, ACME, outside-client, maintained-client, current-documentation, provider mutation, or Owner Acceptance was performed.'
            echo
            echo "Release Identity: albertloky/SBXR $CANDIDATE_TAG $GITHUB_SHA $index_sha256"
          } >> "$GITHUB_STEP_SUMMARY"
          pattern='MARKER|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|Authorization: Bearer '
          test -z "$(rg -a -l "$pattern" "$GITHUB_STEP_SUMMARY")"

  verify-release:
    if: github.event_name == 'release' && github.event.release.prerelease && !github.event.release.draft
    runs-on: ubuntu-24.04
    permissions:
      attestations: read
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_COMMIT: ${{ github.event.release.target_commitish }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify the immutable exact six-asset release through public HTTPS
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          verified=false
          for attempt in {1..12}; do
            if go run ./cmd/sbxr-release verify -tag "$RELEASE_TAG"; then
              verified=true
              break
            fi
            sleep 10
          done
          test "$verified" = true
      - name: Download and scan the exact six verified assets
        run: |
          mkdir -m 0700 dist
          for asset in install.sh release-index.json sbxr-linux-amd64.tar.gz sbxr-linux-arm64.tar.gz sbxr-components-linux-amd64.tar.gz sbxr-components-linux-arm64.tar.gz; do
            curl -fsSL "https://github.com/albertloky/SBXR/releases/download/$RELEASE_TAG/$asset" -o "dist/$asset"
          done
          test "$(find dist -type f | wc -l)" -eq 6
          pattern='MARKER|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|Authorization: Bearer '
          test -z "$(rg -a -l "$pattern" dist/install.sh dist/release-index.json)"
          for archive in dist/sbxr-linux-amd64.tar.gz dist/sbxr-linux-arm64.tar.gz dist/sbxr-components-linux-amd64.tar.gz dist/sbxr-components-linux-arm64.tar.gz; do
            test -z "$(tar -xOzf "$archive" | rg -a -l "$pattern" -)"
          done
      - name: Rerun automated acceptance against the exact release commit
        run: |
          go list ./... | grep -v '/internal/ownerconsole$' | xargs go test -count=1
          go test ./internal/ownerconsole -count=1
          go list ./... | grep -v '/internal/ownerconsole$' | xargs go test -race -p 1 -count=1
          go vet ./...
          sudo apt-get install --yes iproute2 nftables
          sudo env "PATH=$PATH" go test ./internal/networkpolicy/adapter/ubuntu -run TestProductionUbuntuSeam -count=1
          sudo env "PATH=$PATH" SBXR_CONTROLLED_FIREWALL_SEAM=1 go test ./internal/systemchanges/adapter/ubuntu -run TestProductionFirewallSeam -count=1
      - name: Build the exact redacted automated Acceptance Record
        run: |
          go run ./cmd/sbxr-release acceptance \
            -tag "$RELEASE_TAG" \
            -commit "$RELEASE_COMMIT" \
            -directory dist \
            -output acceptance-record.md \
            -evidence-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          pattern='MARKER|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|Authorization: Bearer '
          test -z "$(rg -a -l "$pattern" acceptance-record.md)"
          cat acceptance-record.md >> "$GITHUB_STEP_SUMMARY"
          test -z "$(rg -a -l "$pattern" "$GITHUB_STEP_SUMMARY")"
      - uses: actions/upload-artifact@v4
        with:
          name: automated-acceptance-record-${{ github.event.release.tag_name }}
          path: acceptance-record.md
          if-no-files-found: error
          retention-days: 90
      - name: Publish the durable redacted record without changing the six assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --notes-file acceptance-record.md
