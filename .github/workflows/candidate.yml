name: Mint immutable candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable candidate tag
        required: true
        type: string
      version:
        description: Index version without v prefix
        required: true
        type: string
      sequence:
        description: Monotonic release sequence
        required: true
        type: number
  release:
    types: [published]

permissions:
  attestations: read
  contents: read

env:
  CANDIDATE_TAG: ${{ inputs.tag }}
  CANDIDATE_VERSION: ${{ inputs.version }}
  CANDIDATE_SEQUENCE: ${{ inputs.sequence }}

concurrency:
  group: candidate-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: true
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build and natively qualify exact architecture assets
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -m 0700 dist
          go run ./cmd/sbxr-release \
            -tag "$CANDIDATE_TAG" \
            -commit "$GITHUB_SHA" \
            -architecture '${{ matrix.architecture }}' \
            -output 'dist/sbxr-linux-${{ matrix.architecture }}.tar.gz' \
            -component-output 'dist/sbxr-components-linux-${{ matrix.architecture }}.tar.gz'
          mkdir -m 0700 inspect
          test "$(tar -tzf 'dist/sbxr-linux-${{ matrix.architecture }}.tar.gz')" = sbxr
          tar -xzf 'dist/sbxr-linux-${{ matrix.architecture }}.tar.gz' -C inspect
          inspect/sbxr version --json > version.json
          jq -e \
            --arg tag "$CANDIDATE_TAG" \
            --arg commit "$GITHUB_SHA" \
            --arg architecture '${{ matrix.architecture }}' \
            '.build.repository == "albertloky/SBXR" and .build.tag == $tag and .build.commit == $commit and .architecture == $architecture and .state_schema == 2 and (.build.payload_sha256 | test("^[0-9a-f]{64}$"))' \
            version.json
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.architecture }}
          path: |
            dist/sbxr-linux-${{ matrix.architecture }}.tar.gz
            dist/sbxr-components-linux-${{ matrix.architecture }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  qualify:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-*
          path: dist
          merge-multiple: true
      - name: Generate the exact release bootstrap
        run: |
          go run ./cmd/sbxr-release bootstrap \
            -version "$CANDIDATE_VERSION" \
            -sequence "$CANDIDATE_SEQUENCE" \
            -tag "$CANDIDATE_TAG" \
            -commit "$GITHUB_SHA" \
            -output dist/install.sh
          test "$(stat -c '%a' dist/install.sh)" = 700
          if dist/install.sh >bootstrap.out 2>&1; then
            exit 1
          fi
          test "$(cat bootstrap.out)" = SBXR-BOOTSTRAP-REFUSED
      - name: Build strict release index from exact asset bytes
        run: |
          go run ./cmd/sbxr-release index \
            -version "$CANDIDATE_VERSION" \
            -sequence "$CANDIDATE_SEQUENCE" \
            -tag "$CANDIDATE_TAG" \
            -commit "$GITHUB_SHA" \
            -directory dist \
            -output dist/release-index.json
      - name: Run complete automated verification before publication
        run: |
          go list ./... | grep -v '/internal/ownerconsole$' | xargs go test -count=1
          go test ./internal/ownerconsole -count=1
          go list ./... | grep -v '/internal/ownerconsole$' | xargs go test -race -p 1 -count=1
          go vet ./...
      - name: Run Ubuntu production seams before publication
        run: |
          sudo apt-get update
          sudo apt-get install --yes iproute2 nftables
          sudo env "PATH=$PATH" go test ./internal/networkpolicy/adapter/ubuntu -run TestProductionUbuntuSeam -count=1
          sudo env "PATH=$PATH" SBXR_CONTROLLED_FIREWALL_SEAM=1 go test ./internal/systemchanges/adapter/ubuntu -run TestProductionFirewallSeam -count=1
      - name: Refuse secret markers in release assets
        run: |
          pattern='SECRET-MARKER|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|Authorization: Bearer '
          test -z "$(rg -a -l "$pattern" dist/install.sh dist/release-index.json)"
          for archive in dist/sbxr-linux-amd64.tar.gz dist/sbxr-linux-arm64.tar.gz dist/sbxr-components-linux-amd64.tar.gz dist/sbxr-components-linux-arm64.tar.gz; do
            test -z "$(tar -xOzf "$archive" | rg -a -l "$pattern" -)"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: |
            dist/install.sh
            dist/release-index.json
            dist/sbxr-linux-amd64.tar.gz
            dist/sbxr-linux-arm64.tar.gz
            dist/sbxr-components-linux-amd64.tar.gz
            dist/sbxr-components-linux-arm64.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Record prepublication stage matrix
        run: |
          index_sha256="$(sha256sum dist/release-index.json | cut -d ' ' -f 1)"
          {
            echo '## Automated Acceptance Ladder'
            echo
            echo '| Stage | Status | Evidence |'
            echo '|---|---|---|'
            echo '| Module Verification | Passed | Complete suite with PTY package isolated; race detector on every non-PTY package; `go vet ./...` |'
            echo '| Seam Verification | Pending | GitHub attestation exists only after publication |'
            echo '| Integrated Verification | Pending | Exact published bytes have not passed the production release verifier |'
            echo '| Codex Live Acceptance | Pending | Issue #151 |'
            echo '| Owner Acceptance | Pending | Issue #152 |'
            echo
            echo "Release Identity: albertloky/SBXR $CANDIDATE_TAG $GITHUB_SHA $index_sha256"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-release:
    if: github.event_name == 'release' && github.event.release.prerelease && !github.event.release.draft
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_COMMIT: ${{ github.event.release.target_commitish }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify the immutable exact six-asset release through public HTTPS
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          verified=false
          for attempt in {1..12}; do
            if go run ./cmd/sbxr-release verify -tag "$RELEASE_TAG"; then
              verified=true
              break
            fi
            sleep 10
          done
          test "$verified" = true
      - name: Download and scan the exact six verified assets
        run: |
          mkdir -m 0700 dist
          for asset in install.sh release-index.json sbxr-linux-amd64.tar.gz sbxr-linux-arm64.tar.gz sbxr-components-linux-amd64.tar.gz sbxr-components-linux-arm64.tar.gz; do
            curl -fsSL "https://github.com/albertloky/SBXR/releases/download/$RELEASE_TAG/$asset" -o "dist/$asset"
          done
          test "$(find dist -type f | wc -l)" -eq 6
          pattern='SECRET-MARKER|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|Authorization: Bearer '
          test -z "$(rg -a -l "$pattern" dist/install.sh dist/release-index.json)"
          for archive in dist/sbxr-linux-amd64.tar.gz dist/sbxr-linux-arm64.tar.gz dist/sbxr-components-linux-amd64.tar.gz dist/sbxr-components-linux-arm64.tar.gz; do
            test -z "$(tar -xOzf "$archive" | rg -a -l "$pattern" -)"
          done
      - name: Rerun automated acceptance against the exact release commit
        run: |
          go list ./... | grep -v '/internal/ownerconsole$' | xargs go test -count=1
          go test ./internal/ownerconsole -count=1
          go list ./... | grep -v '/internal/ownerconsole$' | xargs go test -race -p 1 -count=1
          go vet ./...
          sudo apt-get install --yes iproute2 nftables
          sudo env "PATH=$PATH" go test ./internal/networkpolicy/adapter/ubuntu -run TestProductionUbuntuSeam -count=1
          sudo env "PATH=$PATH" SBXR_CONTROLLED_FIREWALL_SEAM=1 go test ./internal/systemchanges/adapter/ubuntu -run TestProductionFirewallSeam -count=1
      - name: Record final automated stage matrix
        run: |
          index_sha256="$(sha256sum dist/release-index.json | cut -d ' ' -f 1)"
          {
            echo '## Automated Acceptance Ladder'
            echo
            echo '| Stage | Status | Evidence |'
            echo '|---|---|---|'
            echo '| Module Verification | Passed | Exact release commit: complete suite with PTY package isolated; race detector on every non-PTY package; `go vet ./...` |'
            echo '| Seam Verification | Passed | Public HTTPS and Sigstore release verifier plus every exact asset; native component qualification |'
            echo '| Integrated Verification | Passed | Both exact application archives staged; embedded identity, schemas, migrations, units, components, version output, Network Policy, and System Changes agree |'
            echo '| Codex Live Acceptance | Pending | Issue #151 |'
            echo '| Owner Acceptance | Pending | Issue #152 |'
            echo
            echo "Release Identity: albertloky/SBXR $RELEASE_TAG $RELEASE_COMMIT $index_sha256"
          } >> "$GITHUB_STEP_SUMMARY"
