name: Rust MUSL build only

on:
  push:
    branches: [ci/rust-musl-98e0dc4-20261025]

permissions:
  contents: read

concurrency:
  group: rust-musl-ci-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  RUSTUP_TOOLCHAIN: "1.90.0"

jobs:
  native-musl:
    if: github.event_name == 'push' && github.ref == 'refs/heads/ci/rust-musl-98e0dc4-20261025'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
            machine: x86_64
            target: x86_64-unknown-linux-musl
          - architecture: arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    env:
      ARCHITECTURE: ${{ matrix.architecture }}
      NATIVE_MACHINE: ${{ matrix.machine }}
      MUSL_TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Verify approved source and isolated CI change
        run: |
          set -euo pipefail
          test "$(uname -s)" = Linux
          test "$(uname -m)" = "$NATIVE_MACHINE"
          test "$(git rev-parse 'HEAD^1^{tree}')" = abfaf2a8242fbab0b6593d5a0386beeebe6dc7dd
          test "$(git diff-tree --no-commit-id --name-status -r HEAD)" = $'A\t.github/workflows/rust-musl-ci.yml'
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf 'Reviewed Mac source: %s\nSource tree: %s\nActual CI commit: %s\n' \
            98e0dc43bda9459b06c04b5b4a5dc8e9e9bf0259 \
            abfaf2a8242fbab0b6593d5a0386beeebe6dc7dd "$GITHUB_SHA"
      - name: Prepare official native build tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-remove --no-install-recommends \
            build-essential musl musl-dev musl-tools cmake make perl pkg-config
          rustup toolchain install 1.90.0 --profile minimal --target "$MUSL_TARGET"
          test "$(rustc --version)" = 'rustc 1.90.0 (1159e78c4 2025-09-14)'
          rustc -vV
          cargo --version
          rustup target list --installed --toolchain 1.90.0 | grep -Fx "$MUSL_TARGET"
          musl-gcc --version
          cmake --version
          dpkg-query -W -f='${Package}\t${Version}\t${Status}\n' musl musl-dev musl-tools cmake
      - name: Fetch the two locked dependency graphs
        run: |
          set -euo pipefail
          cargo fetch --locked
          cargo fetch --locked --manifest-path tooling/rust-package/Cargo.toml
      - name: Build and structurally verify the native MUSL package
        run: |
          set -euo pipefail
          export TMPDIR="$PWD/.scratch/acceptance/rust-musl-ci/t"
          mkdir -p -m 0700 "$TMPDIR" .scratch/acceptance/rust-musl-ci/native
          python3 -B tooling/rust-package/build_native.py \
            --tag v2.0.0 --sequence 17 --commit "$GITHUB_SHA" \
            --architecture "$ARCHITECTURE" \
            --output ".scratch/acceptance/rust-musl-ci/native/sbxr-linux-$ARCHITECTURE.tar.gz"
          executable="target/$MUSL_TARGET/release/sbxr"
          readelf -h "$executable"
          python3 - "$executable" "$ARCHITECTURE" <<'PY'
          import pathlib, struct, subprocess, sys
          path, architecture = sys.argv[1:]
          data = pathlib.Path(path).read_bytes()
          assert data[:6] == b'\x7fELF\x02\x01'
          assert struct.unpack_from('<H', data, 18)[0] == {'amd64': 62, 'arm64': 183}[architecture]
          program_headers = subprocess.check_output(['readelf', '-l', path], text=True)
          dynamic = subprocess.check_output(['readelf', '-d', path], text=True)
          assert 'INTERP' not in program_headers
          assert '(NEEDED)' not in dynamic
          print('Verified static native ELF:', architecture)
          PY
          sha256sum "$executable" ".scratch/acceptance/rust-musl-ci/native/sbxr-linux-$ARCHITECTURE.tar.gz"
