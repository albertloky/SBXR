name: Publish qualified stable releases

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Publish the qualification or abandon and burn it
        required: true
        default: publish
        type: choice
        options:
          - publish
          - abandon
      qualification_run_id:
        description: Successful candidate.yml run ID
        required: true
        type: string

permissions: {}

concurrency:
  group: installer-updater-release
  cancel-in-progress: false

env:
  ARCHIVE_TAG: archive/full-product-v1.0.15
  CHECKLIST: docs/acceptance/installer-updater-vps.md

jobs:
  preflight:
    if: github.ref == 'refs/heads/main' && inputs.operation == 'publish'
    runs-on: ubuntu-24.04
    environment: acceptance-vps
    permissions:
      actions: read
      attestations: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
      ACCEPTANCE_VPS_HOST: ${{ secrets.ACCEPTANCE_VPS_HOST }}
      ACCEPTANCE_VPS_HOST_KEY: ${{ secrets.ACCEPTANCE_VPS_HOST_KEY }}
      ACCEPTANCE_VPS_SSH_PRIVATE_KEY: ${{ secrets.ACCEPTANCE_VPS_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify the successful signed qualification
        run: |
          set -euo pipefail
          printf '%s\n' "$QUALIFICATION_RUN_ID" | grep -Eq '^[1-9][0-9]*$'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN_ID" > candidate-run.json
          jq -e '.path == ".github/workflows/candidate.yml" and .event == "workflow_dispatch" and .conclusion == "success"' candidate-run.json >/dev/null
          run_sha="$(jq -r .head_sha candidate-run.json)"
          test "$run_sha" = "$GITHUB_SHA"
          test "$run_sha" = "$(git rev-parse origin/main)"
          created="$(date -u -d "$(jq -r .created_at candidate-run.json)" +%s)"
          now="$(date -u +%s)"
          test "$created" -le "$now"
          test "$((now - created))" -lt "$((90 * 24 * 60 * 60))"
          test "$(git cat-file -t "$ARCHIVE_TAG")" = tag
          test "$(git rev-parse "$ARCHIVE_TAG")" = "$(git ls-remote --tags origin "refs/tags/$ARCHIVE_TAG" | cut -f1)"
          test "$(git rev-parse "$ARCHIVE_TAG^{commit}")" = "$(git ls-remote --tags origin "refs/tags/$ARCHIVE_TAG^{}" | cut -f1)"

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN_ID/artifacts" --paginate --slurp | jq 'map(.artifacts) | add' > artifacts.json
          jq -e --arg signed signed-qualification-manifest --arg acceptance "installer-updater-acceptance-$QUALIFICATION_RUN_ID" '([.[] | select(.name == $signed and .expired == false)] | length) == 1 and ([.[] | select(.name == $acceptance and .expired == false)] | length) == 1' artifacts.json >/dev/null
          mkdir -m 0700 candidate verified
          gh run download "$QUALIFICATION_RUN_ID" --repo "$GITHUB_REPOSITORY" --name signed-qualification-manifest --dir candidate/signed
          gh run download "$QUALIFICATION_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "installer-updater-acceptance-$QUALIFICATION_RUN_ID" --dir candidate/acceptance
          cp candidate/signed/qualification-manifest.json verified/
          cd verified
          gh attestation download qualification-manifest.json --repo "$GITHUB_REPOSITORY" --limit 1
          bundle="$(find . -maxdepth 1 -name 'sha256:*.jsonl' -type f -print -quit)"
          test -n "$bundle"
          gh attestation verify qualification-manifest.json --bundle "$bundle" --repo "$GITHUB_REPOSITORY" --signer-workflow albertloky/SBXR/.github/workflows/candidate.yml --source-ref refs/heads/main --source-digest "$run_sha" >/dev/null
          mv "$bundle" qualification.bundle
          cd ..

          manifest=verified/qualification-manifest.json
          jq -e --arg run_id "$QUALIFICATION_RUN_ID" --arg run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN_ID" --arg commit "$run_sha" --arg checklist "$(sha256sum "$CHECKLIST" | cut -d' ' -f1)" '
            .schema == "sbxr-qualification-manifest-v1" and .repository == env.GITHUB_REPOSITORY and
            .workflow.path == ".github/workflows/candidate.yml" and .workflow.ref == "albertloky/SBXR/.github/workflows/candidate.yml@refs/heads/main" and
            .workflow.commit == $commit and .workflow.run_id == $run_id and .workflow.run_url == $run_url and
            .acceptance_vps_checklist_sha256 == $checklist and .approval.state == "approved" and any(.approval.environments[]; .name == "acceptance-vps") and
            (.source_state == "initial-normal" or .source_state == "later-normal" or .source_state == "rescue") and
            ((.mode == "normal" and .source_state != "rescue" and .rescue == null) or (.mode == "rescue" and .source_state == "rescue" and (.rescue.failed_normal_run_id | test("^[1-9][0-9]*$")) and (.rescue.defect_issue_url | test("^https://github.com/albertloky/SBXR/issues/[1-9][0-9]*$")))) and
            (.releases | length) == 2 and .releases[0].tag != .releases[1].tag and .releases[0].sequence > 0 and .releases[1].sequence > .releases[0].sequence
          ' "$manifest" >/dev/null

          git fetch --force --tags origin
          burned="$(for tag in $(git tag --list 'release-burned/*'); do git tag -l --format='%(contents)' "$tag"; done | jq -s .)"
          source_state="$(jq -r .source_state "$manifest")"
          mkdir -m 0700 verified/release verified/records
          for index in 0 1; do
            release="$(jq -c ".releases[$index]" "$manifest")"
            tag="$(jq -r .tag <<<"$release")"
            sequence="$(jq -r .sequence <<<"$release")"
            commit="$(jq -r .commit <<<"$release")"
            release_id="$(jq -r .release_id <<<"$release")"
            index_sha256="$(jq -r .release_identity.release_index_sha256 <<<"$release")"
            printf '%s\n' "$tag" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
            printf '%s\n' "$commit" | grep -Eq '^[0-9a-f]{40}$'
            printf '%s\n' "$index_sha256" | grep -Eq '^[0-9a-f]{64}$'
            jq -e --arg tag "$tag" --arg commit "$commit" --arg index "$index_sha256" --argjson sequence "$sequence" '.release_identity == {repository:env.GITHUB_REPOSITORY,tag:$tag,commit:$commit,release_index_sha256:$index} and (.assets | length) == 4 and (.assets | map(.name) | sort) == ["install.sh","release-index.json","sbxr-linux-amd64.tar.gz","sbxr-linux-arm64.tar.gz"] and all(.assets[]; .size > 0 and (.sha256 | test("^[0-9a-f]{64}$")))' <<<"$release" >/dev/null
            gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > release.json
            jq -e --arg tag "$tag" --arg commit "$commit" --argjson release_id "$release_id" '.id == $release_id and .tag_name == $tag and .target_commitish == $commit and (.assets | length) == 4 and (.assets | map(.name) | sort) == ["install.sh","release-index.json","sbxr-linux-amd64.tar.gz","sbxr-linux-arm64.tar.gz"]' release.json >/dev/null
            if test "$source_state" = initial-normal || test "$index" -eq 1; then
              jq -e '.draft == true and .prerelease == false and .immutable == false' release.json >/dev/null
              cp "candidate/acceptance/acceptance-records/$tag.md" "verified/records/$tag.md"
              jq -j .body release.json | cmp - "verified/records/$tag.md"
              canonical="$(sed -n '/^```json$/,/^```$/p' "verified/records/$tag.md" | sed '1d;$d')"
              jq -e --arg tag "$tag" --arg commit "$commit" --arg index "$index_sha256" --argjson sequence "$sequence" '.schema == "sbxr-acceptance-record-v1" and .release_identity == {repository:env.GITHUB_REPOSITORY,tag:$tag,commit:$commit,release_index_sha256:$index} and .sequence == $sequence and .secret_safe_result == "Passed" and .stages.owner_acceptance == "Not required"' <<<"$canonical" >/dev/null
            elif test "$source_state" = later-normal; then
              jq -e '.draft == false and .prerelease == false and .immutable == true and (.body | contains("Status: Qualified\n"))' release.json >/dev/null
              test "$(jq -r .id release.json)" = "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .id)"
            else
              jq -e '.draft == false and .prerelease == true and .immutable == true' release.json >/dev/null
            fi
            if jq -e --arg tag "$tag" --argjson sequence "$sequence" --arg commit "$commit" --arg index "$index_sha256" '.[] | select(.original_tag == $tag or .sequence == $sequence or (.commit == $commit and .release_index_sha256 == $index))' <<<"$burned" >/dev/null; then
              test "$source_state" = rescue
              test "$index" -eq 0
              failed_run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$(jq -r .rescue.failed_normal_run_id "$manifest")"
              jq -e --arg tag "$tag" --argjson sequence "$sequence" --arg commit "$commit" --arg index "$index_sha256" --arg run "$failed_run_url" '.[] | select(.original_tag == $tag and .sequence == $sequence and .commit == $commit and .release_index_sha256 == $index and .qualification_run_url == $run)' <<<"$burned" >/dev/null
            fi
            directory="verified/release/$tag"
            mkdir -m 0700 "$directory"
            while read -r asset; do
              name="$(jq -r .name <<<"$asset")"
              proof="$(jq -c --arg name "$name" '.assets[] | select(.name == $name)' <<<"$release")"
              gh api "repos/$GITHUB_REPOSITORY/releases/assets/$(jq -r .id <<<"$asset")" -H 'Accept: application/octet-stream' > "$directory/$name"
              test "$(stat -c %s "$directory/$name")" -eq "$(jq -r .size <<<"$proof")"
              test "$(sha256sum "$directory/$name" | cut -d' ' -f1)" = "$(jq -r .sha256 <<<"$proof")"
            done < <(jq -c '.assets[]' release.json)
            test "$(find "$directory" -maxdepth 1 -type f -printf '%f\n' | sort)" = "$(printf '%s\n' install.sh release-index.json sbxr-linux-amd64.tar.gz sbxr-linux-arm64.tar.gz | sort)"
            test "$(sha256sum "$directory/release-index.json" | cut -d' ' -f1)" = "$index_sha256"
            go run ./cmd/sbxr-release verify-package -directory "$directory" -architecture amd64
            go run ./cmd/sbxr-release verify-package -directory "$directory" -architecture arm64
          done

      - name: Recheck preserved B before publication approval
        run: |
          set -euo pipefail
          test -n "$ACCEPTANCE_VPS_HOST"
          test -n "$ACCEPTANCE_VPS_HOST_KEY"
          test -n "$ACCEPTANCE_VPS_SSH_PRIVATE_KEY"
          install -m 0600 /dev/null ssh.key
          printf '%s\n' "$ACCEPTANCE_VPS_SSH_PRIVATE_KEY" > ssh.key
          printf '%s %s\n' "$ACCEPTANCE_VPS_HOST" "$ACCEPTANCE_VPS_HOST_KEY" > known_hosts
          trap 'rm -f ssh.key known_hosts' EXIT
          final_release="$(jq -c '.releases[1]' verified/qualification-manifest.json)"
          environment="TAG=$(jq -r .tag <<<"$final_release") SEQUENCE=$(jq -r .sequence <<<"$final_release") COMMIT=$(jq -r .commit <<<"$final_release") INDEX=$(jq -r .release_identity.release_index_sha256 <<<"$final_release")"
          ssh -i ssh.key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=known_hosts -o ConnectTimeout=15 "root@$ACCEPTANCE_VPS_HOST" "$environment bash -se" <<'REMOTE'
          set -euo pipefail
          test "$(. /etc/os-release; printf '%s:%s' "$ID" "$VERSION_ID")" = ubuntu:24.04
          test "$(uname -m)" = x86_64
          test "$(stat -c '%u:%g:%a:%h:%F' /usr/local/bin/sbxr)" = '0:0:755:1:regular file'
          test "$(stat -c '%u:%g:%a:%F' /var/lib/sbxr)" = '0:0:700:directory'
          test "$(stat -c '%u:%g:%a:%h:%F' /var/lib/sbxr/installed.json)" = '0:0:600:1:regular file'
          test "$(find /var/lib/sbxr -mindepth 1 -maxdepth 1 -printf '%f\n')" = installed.json
          jq -e --arg tag "$TAG" --arg commit "$COMMIT" --arg index "$INDEX" --argjson sequence "$SEQUENCE" '.repository == "albertloky/SBXR" and .tag == $tag and .commit == $commit and .release_index_sha256 == $index and .sequence == $sequence and .architecture == "amd64"' /var/lib/sbxr/installed.json >/dev/null
          test "$(jq -r .executable_sha256 /var/lib/sbxr/installed.json)" = "$(sha256sum /usr/local/bin/sbxr | cut -d' ' -f1)"
          test ! -e /var/lib/sbxr/update.json
          flock -n /run/lock/sbxr.lock true
          printf '0\n' | script -qec 'env TERM=xterm-256color LANG=C.UTF-8 /usr/local/bin/sbxr' /dev/null | grep -F 'Status: Ready'
          REMOTE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-stable-publication-input
          path: verified
          if-no-files-found: error
          retention-days: 90

  publish:
    if: inputs.operation == 'publish'
    needs: preflight
    runs-on: ubuntu-24.04
    environment: stable-publication
    permissions:
      actions: read
      attestations: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      ACCEPTANCE_VPS_HOST: ${{ secrets.ACCEPTANCE_VPS_HOST }}
      ACCEPTANCE_VPS_HOST_KEY: ${{ secrets.ACCEPTANCE_VPS_HOST_KEY }}
      ACCEPTANCE_VPS_SSH_PRIVATE_KEY: ${{ secrets.ACCEPTANCE_VPS_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-stable-publication-input
          path: verified
      - name: Publish unchanged drafts in the approved order and publicly verify them
        run: |
          set -euo pipefail
          printf '%s\n' prepublication > publication-stage
          manifest=verified/qualification-manifest.json
          qualification_run_id="$(jq -r .workflow.run_id "$manifest")"
          created="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$qualification_run_id" --jq .created_at | xargs -I{} date -u -d {} +%s)"
          now="$(date -u +%s)"
          test "$((now - created))" -lt "$((90 * 24 * 60 * 60))"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" > approvals.json
          jq -e '[.[] | select(.state == "approved" and any(.environments[]; .name == "stable-publication"))] | length > 0' approvals.json >/dev/null
          mkdir -m 0700 public rechecked

          recheck_draft() {
            local index=$1 release tag commit release_id directory metadata asset name proof
            release="$(jq -c ".releases[$index]" "$manifest")"
            tag="$(jq -r .tag <<<"$release")"
            commit="$(jq -r .commit <<<"$release")"
            release_id="$(jq -r .release_id <<<"$release")"
            directory="rechecked/$tag"
            metadata="rechecked/$tag.metadata.json"
            mkdir -m 0700 "$directory"
            gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$metadata"
            jq -e --arg tag "$tag" --arg commit "$commit" --argjson id "$release_id" '.id == $id and .tag_name == $tag and .target_commitish == $commit and .draft == true and .prerelease == false and .immutable == false and (.assets | length) == 4 and (.assets | map(.name) | sort) == ["install.sh","release-index.json","sbxr-linux-amd64.tar.gz","sbxr-linux-arm64.tar.gz"]' "$metadata" >/dev/null
            jq -j .body "$metadata" | cmp - "verified/records/$tag.md"
            while read -r asset; do
              name="$(jq -r .name <<<"$asset")"
              proof="$(jq -c --arg name "$name" '.assets[] | select(.name == $name)' <<<"$release")"
              test -n "$proof"
              test "$(jq -r .size <<<"$asset")" -eq "$(jq -r .size <<<"$proof")"
              test "$(jq -r .digest <<<"$asset")" = "sha256:$(jq -r .sha256 <<<"$proof")"
              gh api "repos/$GITHUB_REPOSITORY/releases/assets/$(jq -r .id <<<"$asset")" -H 'Accept: application/octet-stream' > "$directory/$name"
              test "$(stat -c %s "$directory/$name")" -eq "$(jq -r .size <<<"$proof")"
              test "$(sha256sum "$directory/$name" | cut -d' ' -f1)" = "$(jq -r .sha256 <<<"$proof")"
              cmp "verified/release/$tag/$name" "$directory/$name"
            done < <(jq -c '.assets[]' "$metadata")
            test "$(find "$directory" -maxdepth 1 -type f -printf '%f\n' | sort)" = "$(printf '%s\n' install.sh release-index.json sbxr-linux-amd64.tar.gz sbxr-linux-arm64.tar.gz | sort)"
          }

          verify_public() {
            local index=$1 latest=$2 release tag commit release_id directory metadata name
            release="$(jq -c ".releases[$index]" "$manifest")"
            tag="$(jq -r .tag <<<"$release")"
            commit="$(jq -r .commit <<<"$release")"
            release_id="$(jq -r .release_id <<<"$release")"
            directory="public/$tag"
            metadata="public/$tag.metadata.json"
            mkdir -m 0700 "$directory"
            deadline=$((SECONDS + 300))
            for attempt in $(seq 1 60); do
              if gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$metadata" 2>/dev/null &&
                 jq -e --arg tag "$tag" --arg commit "$commit" --argjson id "$release_id" '.id == $id and .tag_name == $tag and .target_commitish == $commit and .draft == false and .prerelease == false and .immutable == true and (.assets | length) == 4 and (.assets | map(.name) | sort) == ["install.sh","release-index.json","sbxr-linux-amd64.tar.gz","sbxr-linux-arm64.tar.gz"]' "$metadata" >/dev/null &&
                 gh api "repos/$GITHUB_REPOSITORY/attestations/sha1:$commit?predicate_type=release&per_page=100" --jq 'select((.attestations | length) == 1 and .attestations[0].initiator == "github")' >/dev/null 2>&1; then
                break
              fi
              test "$attempt" -lt 60
              test "$SECONDS" -lt "$deadline"
              sleep 5
            done
            if test "$latest" = true; then test "$release_id" = "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .id)"; fi
            jq -j .body "$metadata" | cmp - "verified/records/$tag.md"
            while read -r asset; do
              name="$(jq -r .name <<<"$asset")"
              remaining=$((deadline - SECONDS))
              test "$remaining" -gt 0
              curl -fsSL --retry 60 --retry-delay 5 --retry-max-time "$remaining" --retry-all-errors "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$name" -o "$directory/$name"
              cmp "verified/release/$tag/$name" "$directory/$name"
            done < <(jq -c '.assets[]' "$metadata")
            test "$(find "$directory" -maxdepth 1 -type f -printf '%f\n' | sort)" = "$(printf '%s\n' install.sh release-index.json sbxr-linux-amd64.tar.gz sbxr-linux-arm64.tar.gz | sort)"
            go run ./cmd/sbxr-release verify-package -directory "$directory" -architecture amd64
            go run ./cmd/sbxr-release verify-package -directory "$directory" -architecture arm64
          sudo bash "$directory/install.sh" > "$tag-install.transcript"
          grep -Fx 'SOFTWARE-LIFECYCLE-INSTALL-INSTALLED' "$tag-install.transcript"
          check_deadline=$((SECONDS + 600))
          while true; do
            if { sleep 1; printf '1\n'; sleep 15; printf '0\n'; } | script -qec 'sudo env TERM=xterm-256color LANG=C.UTF-8 /usr/local/bin/sbxr' /dev/null > "$tag-check.transcript" && grep -F 'Code: SOFTWARE-LIFECYCLE-CHECK-ALREADY-CURRENT' "$tag-check.transcript"; then
              break
            fi
            test "$SECONDS" -lt "$check_deadline"
            sleep 5
            done
            sudo rm -f /usr/local/bin/sbxr /run/lock/sbxr.lock
            sudo rm -r /var/lib/sbxr
          }

          source_state="$(jq -r .source_state "$manifest")"
          if test "$source_state" = initial-normal; then
            source_tag="$(jq -r .releases[0].tag "$manifest")"
            recheck_draft 0
            gh release edit "$source_tag" --draft=false --prerelease=false --latest
            printf '%s\n' initial-a-public-verification-failure > publication-stage
            verify_public 0 true
          fi
          latest_tag="$(jq -r .releases[1].tag "$manifest")"
          recheck_draft 1
          printf '%s\n' b-publication-or-verification-failure > publication-stage
          gh release edit "$latest_tag" --draft=false --prerelease=false --latest
          verify_public 1 true
          curl -fsSL --retry 5 --retry-all-errors "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.sh" -o latest-install.sh
          curl -fsSL --retry 5 --retry-all-errors "https://github.com/$GITHUB_REPOSITORY/releases/download/$latest_tag/install.sh" -o pinned-install.sh
          cmp latest-install.sh pinned-install.sh

      - name: Prove stable B install, Check, and Update are exact no-ops
        run: |
          set -euo pipefail
          printf '%s\n' stable-no-update-failure > publication-stage
          test -n "$ACCEPTANCE_VPS_HOST"
          test -n "$ACCEPTANCE_VPS_HOST_KEY"
          test -n "$ACCEPTANCE_VPS_SSH_PRIVATE_KEY"
          install -m 0600 /dev/null ssh.key
          printf '%s\n' "$ACCEPTANCE_VPS_SSH_PRIVATE_KEY" > ssh.key
          printf '%s %s\n' "$ACCEPTANCE_VPS_HOST" "$ACCEPTANCE_VPS_HOST_KEY" > known_hosts
          ssh_options=(-i "$PWD/ssh.key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$PWD/known_hosts" -o ConnectTimeout=15)
          cleanup() { rm -f ssh.key known_hosts; }
          trap cleanup EXIT
          ssh "${ssh_options[@]}" "root@$ACCEPTANCE_VPS_HOST" 'touch /run/sbxr-stable-original-session; while test -e /run/sbxr-stable-original-session; do sleep 1; done' &
          original_session=$!
          sleep 1
          kill -0 "$original_session"
          final_release="$(jq -c '.releases[1]' verified/qualification-manifest.json)"
          environment="TAG=$(jq -r .tag <<<"$final_release") SEQUENCE=$(jq -r .sequence <<<"$final_release") COMMIT=$(jq -r .commit <<<"$final_release") INDEX=$(jq -r .release_identity.release_index_sha256 <<<"$final_release")"
          ssh "${ssh_options[@]}" "root@$ACCEPTANCE_VPS_HOST" "$environment bash -se" <<'REMOTE'
          set -euo pipefail
          snapshot() {
            stat -c '%n:%u:%g:%a:%h:%F:%s' /usr/local/bin/sbxr /var/lib/sbxr /var/lib/sbxr/installed.json
            sha256sum /usr/local/bin/sbxr /var/lib/sbxr/installed.json
            find /var/lib/sbxr -xdev -printf '%P:%y:%u:%g:%m:%s\n' | sort
          }
          menu() {
            local choice=$1 output=$2 input fifo feeder
            input="$(mktemp -d /run/sbxr-stable-menu.XXXXXX)"
            fifo="$input/fifo"
            mkfifo -m 0600 "$fifo"
            { sleep 1; printf '%s\n' "$choice"; sleep 15; printf '0\n'; } >"$fifo" &
            feeder=$!
            script -qec 'env TERM=xterm-256color LANG=C.UTF-8 /usr/local/bin/sbxr' /dev/null <"$fifo" >"$output"
            kill "$feeder" 2>/dev/null || true
            wait "$feeder" 2>/dev/null || true
            rm -f "$fifo"
            rmdir "$input"
          }
          jq -e --arg tag "$TAG" --arg commit "$COMMIT" --arg index "$INDEX" --argjson sequence "$SEQUENCE" '.repository == "albertloky/SBXR" and .tag == $tag and .commit == $commit and .release_index_sha256 == $index and .sequence == $sequence and .architecture == "amd64"' /var/lib/sbxr/installed.json >/dev/null
          test "$(find /var/lib/sbxr -mindepth 1 -maxdepth 1 -printf '%f\n')" = installed.json
          test ! -e /var/lib/sbxr/update.json
          flock -n /run/lock/sbxr.lock true
          snapshot > before.snapshot
          curl -fsSL https://github.com/albertloky/SBXR/releases/latest/download/install.sh | bash > install.transcript
          grep -Fx 'SOFTWARE-LIFECYCLE-INSTALL-ALREADY-CURRENT' install.transcript
          snapshot > after-install.snapshot
          cmp before.snapshot after-install.snapshot
          menu 1 check.transcript
          grep -F 'Code: SOFTWARE-LIFECYCLE-CHECK-ALREADY-CURRENT' check.transcript
          snapshot > after-check.snapshot
          cmp before.snapshot after-check.snapshot
          menu 2 update.transcript
          grep -F 'Code: SOFTWARE-LIFECYCLE-UPDATE-ALREADY-CURRENT' update.transcript
          snapshot > after-update.snapshot
          cmp before.snapshot after-update.snapshot
          REMOTE
          kill -0 "$original_session"
          ssh "${ssh_options[@]}" "root@$ACCEPTANCE_VPS_HOST" 'rm -f /run/sbxr-stable-original-session'
          wait "$original_session"
      - name: Retain public stable evidence
        run: |
          set -euo pipefail
          mkdir -m 0700 stable-evidence
          cp verified/qualification-manifest.json stable-evidence/
          cp -R public stable-evidence/
          jq -nS --arg schema sbxr-stable-publication-evidence-v1 --arg workflow "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --arg qualification "$(jq -r .workflow.run_url verified/qualification-manifest.json)" --arg latest "$(jq -r .releases[1].tag verified/qualification-manifest.json)" '{schema:$schema,workflow_run:$workflow,qualification_run:$qualification,latest_tag:$latest,public_verification:"Passed",stable_no_update:"Passed",secret_safe_result:"Passed"}' > stable-evidence/result.json
          if grep -aERq 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|Authorization: Bearer ' stable-evidence; then exit 1; elif test $? -ne 1; then exit 1; fi
          cat stable-evidence/result.json >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' complete > publication-stage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stable-publication-${{ github.run_id }}
          path: stable-evidence
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: stable-publication-stage
          path: publication-stage
          if-no-files-found: ignore
          retention-days: 90

  finalize-failure:
    if: always() && (inputs.operation == 'abandon' || needs.preflight.result != 'success' || needs.publish.result != 'success')
    needs: [preflight, publish]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Recheck the signed qualification and select the approved failure outcome
        id: failure
        run: |
          set -euo pipefail
          printf '%s\n' "$QUALIFICATION_RUN_ID" | grep -Eq '^[1-9][0-9]*$'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN_ID" > candidate-run.json
          jq -e '.path == ".github/workflows/candidate.yml" and .event == "workflow_dispatch" and .conclusion == "success"' candidate-run.json >/dev/null
          mkdir -m 0700 failure
          gh run download "$QUALIFICATION_RUN_ID" --repo "$GITHUB_REPOSITORY" --name signed-qualification-manifest --dir failure
          manifest=failure/qualification-manifest.json
          gh attestation verify "$manifest" --repo "$GITHUB_REPOSITORY" --signer-workflow albertloky/SBXR/.github/workflows/candidate.yml --source-ref refs/heads/main --source-digest "$(jq -r .head_sha candidate-run.json)" >/dev/null
          jq -e --arg run "$QUALIFICATION_RUN_ID" '.schema == "sbxr-qualification-manifest-v1" and .repository == env.GITHUB_REPOSITORY and .workflow.run_id == $run and (.releases | length) == 2' "$manifest" >/dev/null
          created="$(date -u -d "$(jq -r .created_at candidate-run.json)" +%s)"
          age="$(($(date -u +%s) - created))"
          reason=prepublication-failure
          if test '${{ inputs.operation }}' = abandon; then reason=owner-abandoned
          elif test "$age" -ge "$((90 * 24 * 60 * 60))"; then reason=qualification-expired
          elif gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name stable-publication-stage --dir failure/stage 2>/dev/null; then reason="$(cat failure/stage/publication-stage)"
          fi
          test "$reason" != complete
          source_state="$(jq -r .source_state "$manifest")"
          if test "$reason" = prepublication-failure && test "$source_state" = initial-normal; then
            source_release="$(jq -c '.releases[0]' "$manifest")"
            source_release_id="$(jq -r .release_id <<<"$source_release")"
            source_tag="$(jq -r .tag <<<"$source_release")"
            source_commit="$(jq -r .commit <<<"$source_release")"
            if gh api "repos/$GITHUB_REPOSITORY/releases/$source_release_id" > failure/source-a.json 2>/dev/null &&
               jq -e --arg tag "$source_tag" --arg commit "$source_commit" --argjson id "$source_release_id" '.id == $id and .tag_name == $tag and .target_commitish == $commit and .draft == false and .prerelease == false and .immutable == true and (.assets | length) == 4' failure/source-a.json >/dev/null &&
               gh api "repos/$GITHUB_REPOSITORY/attestations/sha1:$source_commit?predicate_type=release&per_page=100" --jq 'select((.attestations | length) == 1 and .attestations[0].initiator == "github")' >/dev/null 2>&1; then
              mkdir -m 0700 failure/source-a
              source_a_valid=true
              while read -r asset; do
                name="$(jq -r .name <<<"$asset")"
                if ! curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/$source_tag/$name" -o "failure/source-a/$name" ||
                   test "$(sha256sum "failure/source-a/$name" | cut -d' ' -f1)" != "$(jq -r .sha256 <<<"$asset")"; then source_a_valid=false; fi
              done < <(jq -c '.assets[]' <<<"$source_release")
              if test "$source_a_valid" = true; then reason=b-publication-or-verification-failure; else reason=initial-a-public-verification-failure; fi
            else
              reason=initial-a-public-verification-failure
            fi
          fi
          jq -n '[]' > failure/targets.json
          if test "$reason" = initial-a-public-verification-failure; then
            jq '.releases' "$manifest" > failure/targets.json
          elif test "$reason" = b-publication-or-verification-failure || test "$reason" = stable-no-update-failure; then
            jq '[.releases[1]]' "$manifest" > failure/targets.json
          elif test "$source_state" = initial-normal; then
            jq '.releases' "$manifest" > failure/targets.json
          else
            jq '[.releases[1]]' "$manifest" > failure/targets.json
          fi
          test "$(jq length failure/targets.json)" -gt 0
          outcome=withdraw
          test "$reason" != prepublication-failure || outcome=failed-prerelease
          printf 'reason=%s\n' "$reason" >> "$GITHUB_OUTPUT"
          printf 'outcome=%s\n' "$outcome" >> "$GITHUB_OUTPUT"
      - name: Recheck and withdraw only the failed targets
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch --force --tags origin
          mkdir -m 0700 failure/burned failure/rechecked
          recorded_at="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)"
          : > failure/burn-refs
          while read -r release; do
            tag="$(jq -r .tag <<<"$release")"
            sequence="$(jq -r .sequence <<<"$release")"
            commit="$(jq -r .commit <<<"$release")"
            index_sha256="$(jq -r .release_identity.release_index_sha256 <<<"$release")"
            printf '%s\n' "$release" > "failure/$tag.json"
            payload="failure/burned/$tag.json"
            jq -nS --arg original_tag "$tag" --argjson sequence "$sequence" --arg commit "$commit" --arg release_index_sha256 "$index_sha256" --arg qualification_run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN_ID" --arg reason '${{ steps.failure.outputs.reason }}' --arg recorded_at "$recorded_at" '{original_tag:$original_tag,sequence:$sequence,commit:$commit,release_index_sha256:$release_index_sha256,qualification_run_url:$qualification_run_url,reason:$reason,recorded_at:$recorded_at}' > "$payload"
            if git rev-parse -q --verify "refs/tags/release-burned/$tag" >/dev/null; then
              .github/scripts/prepare-burn-tag.sh "$payload" "$tag" "$commit" >/dev/null
              if ! gh api "repos/$GITHUB_REPOSITORY/releases/$(jq -r .release_id <<<"$release")" >/dev/null 2>&1; then
                if object="$(git rev-parse -q --verify "refs/tags/$tag^{commit}")"; then test "$object" = "$commit"; fi
                continue
              fi
            fi
            .github/scripts/recheck-qualified-release.sh "failure/$tag.json" "failure/rechecked/$tag" failure/release.json
            if object="$(git rev-parse -q --verify "refs/tags/$tag^{commit}")"; then
              test "$object" = "$commit"
            else
              jq -e '.draft == true' failure/release.json >/dev/null
            fi
            .github/scripts/prepare-burn-tag.sh "$payload" "$tag" "$commit" >> failure/burn-refs
          done < <(jq -c '.[]' failure/targets.json)
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-path: failure/burned/*.json
      - name: Publish the complete attested burned ledger atomically
        run: |
          set -euo pipefail
          mapfile -t refs < <(sed '/^$/d' failure/burn-refs)
          test "${#refs[@]}" -eq 0 || git push --atomic origin "${refs[@]}"
      - name: Withdraw only the rechecked burned targets
        if: steps.failure.outputs.outcome == 'withdraw'
        run: |
          set -euo pipefail
          while read -r release; do
            tag="$(jq -r .tag <<<"$release")"
            release_id="$(jq -r .release_id <<<"$release")"
            commit="$(jq -r .commit <<<"$release")"
            if ! gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" >/dev/null 2>&1; then
              .github/scripts/prepare-burn-tag.sh "failure/burned/$tag.json" "$tag" "$commit" >/dev/null
              if object="$(git rev-parse -q --verify "refs/tags/$tag^{commit}")"; then
                test "$object" = "$commit"
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag"
              fi
              continue
            fi
            .github/scripts/recheck-qualified-release.sh "failure/$tag.json" "failure/final/$tag" failure/final-release.json
            tagged=false
            if object="$(git rev-parse -q --verify "refs/tags/$tag^{commit}")"; then
              test "$object" = "$commit"
              tagged=true
            else
              jq -e '.draft == true' failure/final-release.json >/dev/null
            fi
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id"
            test "$tagged" = false || gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag"
          done < <(jq -c '.[]' failure/targets.json)
      - name: Publish prepublication failures as rechecked failed prereleases
        if: steps.failure.outputs.outcome == 'failed-prerelease'
        run: |
          set -euo pipefail
          while read -r release; do
            tag="$(jq -r .tag <<<"$release")"
            commit="$(jq -r .commit <<<"$release")"
            .github/scripts/recheck-qualified-release.sh "failure/$tag.json" "failure/final/$tag" failure/final-release.json
            record="failure/$tag.failed.md"
            .github/scripts/write-failed-acceptance-record.sh "failure/$tag.json" failure/final-release.json "$record" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" RELEASE-INSTALLER-UPDATER-PREPUBLICATION-FAILED failure/qualification-manifest.json /dev/null
            if jq -e '.draft == true and .prerelease == false' failure/final-release.json >/dev/null; then
              gh release edit "$tag" --notes-file "$record" --draft=false --prerelease --latest=false
            else
              jq -e '.draft == false and .prerelease == true and .immutable == true' failure/final-release.json >/dev/null
              jq -j .body failure/final-release.json | cmp - "$record"
            fi
            git fetch --force --tags origin
            test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$commit"
          done < <(jq -c '.[]' failure/targets.json)
