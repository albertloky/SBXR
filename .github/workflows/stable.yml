name: Publish qualified stable releases

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Publish the qualification or abandon and burn it
        required: true
        default: publish
        type: choice
        options:
          - publish
          - abandon
      qualification_run_id:
        description: Successful candidate.yml run ID
        required: true
        type: string

permissions: {}

concurrency:
  group: installer-updater-release
  cancel-in-progress: false

env:
  ARCHIVE_TAG: archive/full-product-v1.0.15
  CHECKLIST: docs/acceptance/installer-updater-vps.md

jobs:
  preflight:
    if: github.ref == 'refs/heads/main' && inputs.operation == 'publish'
    runs-on: ubuntu-24.04
    environment: acceptance-vps
    permissions:
      actions: read
      attestations: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
      ACCEPTANCE_VPS_HOST: ${{ secrets.ACCEPTANCE_VPS_HOST }}
      ACCEPTANCE_VPS_HOST_KEY: ${{ secrets.ACCEPTANCE_VPS_HOST_KEY }}
      ACCEPTANCE_VPS_SSH_PRIVATE_KEY: ${{ secrets.ACCEPTANCE_VPS_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify the successful signed qualification
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN_ID" > candidate-run.json
          run_sha="$(jq -r .head_sha candidate-run.json)"

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN_ID/artifacts" --paginate --slurp | jq 'map(.artifacts) | add' > artifacts.json
          jq -e --arg signed signed-qualification-manifest --arg acceptance "installer-updater-acceptance-$QUALIFICATION_RUN_ID" '([.[] | select(.name == $signed and .expired == false)] | length) == 1 and ([.[] | select(.name == $acceptance and .expired == false)] | length) == 1' artifacts.json >/dev/null
          mkdir -m 0700 candidate verified
          gh run download "$QUALIFICATION_RUN_ID" --repo "$GITHUB_REPOSITORY" --name signed-qualification-manifest --dir candidate/signed
          gh run download "$QUALIFICATION_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "installer-updater-acceptance-$QUALIFICATION_RUN_ID" --dir candidate/acceptance
          cp candidate/signed/qualification-manifest.json verified/
          cd verified
          gh attestation download qualification-manifest.json --repo "$GITHUB_REPOSITORY" --limit 1
          bundle="$(find . -maxdepth 1 -name 'sha256:*.jsonl' -type f -print -quit)"
          test -n "$bundle"
          gh attestation verify qualification-manifest.json --bundle "$bundle" --repo "$GITHUB_REPOSITORY" --signer-workflow albertloky/SBXR/.github/workflows/candidate.yml --source-ref refs/heads/main --source-digest "$run_sha" >/dev/null
          mv "$bundle" qualification.bundle
          cd ..

          manifest=verified/qualification-manifest.json
          git fetch --force --tags origin
          for tag in $(git tag --list 'release-burned/*'); do git tag -l --format='%(contents)' "$tag"; done | jq -s 'sort_by(.original_tag)' > verified/burned.json
          printf '[]' > verified/releases.json
          mkdir -m 0700 verified/release verified/records
          for index in $(seq 0 $(( $(jq '.releases | length' "$manifest") - 1 ))); do
            release="$(jq -c ".releases[$index]" "$manifest")"
            tag="$(jq -r .tag <<<"$release")"
            release_id="$(jq -r .release_id <<<"$release")"
            metadata="verified/$tag.metadata.json"
            gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$metadata"
            directory="verified/release/$tag"
            mkdir -m 0700 "$directory"
            printf '[]' > assets.json
            while read -r asset; do
              name="$(jq -r .name <<<"$asset")"
              gh api "repos/$GITHUB_REPOSITORY/releases/assets/$(jq -r .id <<<"$asset")" -H 'Accept: application/octet-stream' > "$directory/$name"
              jq -cS --arg name "$name" --arg sha256 "$(sha256sum "$directory/$name" | cut -d' ' -f1)" --argjson size "$(stat -c %s "$directory/$name")" '. + [{name:$name,sha256:$sha256,size:$size}] | sort_by(.name)' assets.json > assets.next
              mv assets.next assets.json
            done < <(jq -c '.assets[]' "$metadata")
            cp "candidate/acceptance/acceptance-records/$tag.md" "verified/records/$tag.md"
            jq -cnS --argjson expected "$release" --slurpfile assets assets.json --slurpfile metadata "$metadata" '{assets:$assets[0],body:$metadata[0].body,commit:$metadata[0].target_commitish,draft:$metadata[0].draft,immutable:($metadata[0].immutable // false),prerelease:$metadata[0].prerelease,release_id:$metadata[0].id,release_identity:$expected.release_identity,sequence:$expected.sequence,tag:$metadata[0].tag_name}' > observation.json
            jq -cS --slurpfile observation observation.json '. + $observation' verified/releases.json > verified/releases.next
            mv verified/releases.next verified/releases.json
            go run ./cmd/sbxr-release verify-package -directory "$directory" -architecture amd64
            go run ./cmd/sbxr-release verify-package -directory "$directory" -architecture arm64
          done
          latest_tag=null
          if latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null)"; then latest_tag="$(jq -cn --arg tag "$latest" '$tag')"; fi
          archive="$(jq -cnS --arg commit "$(git rev-parse "$ARCHIVE_TAG^{commit}")" --arg remote_commit "$(git ls-remote --tags origin "refs/tags/$ARCHIVE_TAG^{}" | cut -f1)" --arg remote_tag_object "$(git ls-remote --tags origin "refs/tags/$ARCHIVE_TAG" | cut -f1)" --arg tag_object "$(git rev-parse "$ARCHIVE_TAG")" --arg type "$(git cat-file -t "$ARCHIVE_TAG")" '{commit:$commit,remote_commit:$remote_commit,remote_tag_object:$remote_tag_object,tag_object:$tag_object,type:$type}')"
          checklist="$CHECKLIST"
          if test "$(jq -r .mode "$manifest")" = v3; then checklist=docs/acceptance/v3-packaged-live.md; fi
          jq -cnS --slurpfile acceptance_decision candidate/acceptance/acceptance-vps-result-decision.json --slurpfile acceptance_facts candidate/acceptance/acceptance-vps-result-facts.json --argjson archive "$archive" --slurpfile burned verified/burned.json --slurpfile candidate_run candidate-run.json --arg checklist_sha256 "$(sha256sum "$checklist" | cut -d' ' -f1)" --argjson latest_tag "$latest_tag" --arg observed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --slurpfile releases verified/releases.json --arg remote_main "$(git rev-parse origin/main)" --slurpfile signed_manifest verified/qualification-manifest.json '{acceptance_decision:$acceptance_decision[0],acceptance_facts:$acceptance_facts[0],archive:$archive,burned_identities:$burned[0],candidate_run:{conclusion:$candidate_run[0].conclusion,created_at:$candidate_run[0].created_at,event:$candidate_run[0].event,head_sha:$candidate_run[0].head_sha,id:($candidate_run[0].id|tostring),path:$candidate_run[0].path},checklist_sha256:$checklist_sha256,latest_tag:$latest_tag,manifest_attested:true,observed_at:$observed_at,releases:$releases[0],remote_main:$remote_main,schema:"sbxr-release-qualification-facts-v1",signed_manifest:$signed_manifest[0],stage:"stable-preflight"}' | tr -d '\n' > verified/stable-preflight-facts.json
          go run ./cmd/sbxr-release qualification < verified/stable-preflight-facts.json > verified/stable-preflight-decision.json
          facts_sha256="$(sha256sum verified/stable-preflight-facts.json | cut -d' ' -f1)"
          prior_decision_sha256="$(sha256sum candidate/acceptance/acceptance-vps-result-decision.json | cut -d' ' -f1)"
          jq -e --arg facts_sha256 "$facts_sha256" --arg prior_decision_sha256 "$prior_decision_sha256" '.schema == "sbxr-release-qualification-decision-v1" and .stage == "stable-preflight" and .outcome == "actions-required" and .facts_sha256 == $facts_sha256 and .prior_decision_sha256 == $prior_decision_sha256 and all(.actions[]; .type == "publish-stable-release" and .facts_sha256 == $facts_sha256 and .prior_decision_sha256 == $prior_decision_sha256)' verified/stable-preflight-decision.json >/dev/null

      - name: Recheck preserved B before publication approval
        run: |
          set -euo pipefail
          if test "$(jq -r .mode verified/qualification-manifest.json)" = v3; then exit 0; fi
          test -n "$ACCEPTANCE_VPS_HOST"
          test -n "$ACCEPTANCE_VPS_HOST_KEY"
          test -n "$ACCEPTANCE_VPS_SSH_PRIVATE_KEY"
          install -m 0600 /dev/null ssh.key
          printf '%s\n' "$ACCEPTANCE_VPS_SSH_PRIVATE_KEY" > ssh.key
          printf '%s %s\n' "$ACCEPTANCE_VPS_HOST" "$ACCEPTANCE_VPS_HOST_KEY" > known_hosts
          trap 'rm -f ssh.key known_hosts' EXIT
          final_release="$(jq -c '.releases[1]' verified/qualification-manifest.json)"
          environment="TAG=$(jq -r .tag <<<"$final_release") SEQUENCE=$(jq -r .sequence <<<"$final_release") COMMIT=$(jq -r .commit <<<"$final_release") INDEX=$(jq -r .release_identity.release_index_sha256 <<<"$final_release")"
          ssh -i ssh.key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=known_hosts -o ConnectTimeout=15 "root@$ACCEPTANCE_VPS_HOST" "$environment bash -se" <<'REMOTE'
          set -euo pipefail
          test "$(. /etc/os-release; printf '%s:%s' "$ID" "$VERSION_ID")" = ubuntu:24.04
          test "$(uname -m)" = x86_64
          test "$(stat -c '%u:%g:%a:%h:%F' /usr/local/bin/sbxr)" = '0:0:755:1:regular file'
          test "$(stat -c '%u:%g:%a:%F' /var/lib/sbxr)" = '0:0:700:directory'
          test "$(stat -c '%u:%g:%a:%h:%F' /var/lib/sbxr/installed.json)" = '0:0:600:1:regular file'
          test "$(find /var/lib/sbxr -mindepth 1 -maxdepth 1 -printf '%f\n')" = installed.json
          jq -e --arg tag "$TAG" --arg commit "$COMMIT" --arg index "$INDEX" --argjson sequence "$SEQUENCE" '.repository == "albertloky/SBXR" and .tag == $tag and .commit == $commit and .release_index_sha256 == $index and .sequence == $sequence and .architecture == "amd64"' /var/lib/sbxr/installed.json >/dev/null
          test "$(jq -r .executable_sha256 /var/lib/sbxr/installed.json)" = "$(sha256sum /usr/local/bin/sbxr | cut -d' ' -f1)"
          test ! -e /var/lib/sbxr/update.json
          flock -n /run/lock/sbxr.lock true
          printf '0\n' | script -qec 'env TERM=xterm-256color LANG=C.UTF-8 /usr/local/bin/sbxr' /dev/null | grep -F 'Status: Ready'
          REMOTE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-stable-publication-input
          path: verified
          if-no-files-found: error
          retention-days: 90

  publish:
    if: inputs.operation == 'publish'
    needs: preflight
    runs-on: ubuntu-24.04
    environment: stable-publication
    permissions:
      actions: read
      attestations: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      ACCEPTANCE_VPS_HOST: ${{ secrets.ACCEPTANCE_VPS_HOST }}
      ACCEPTANCE_VPS_HOST_KEY: ${{ secrets.ACCEPTANCE_VPS_HOST_KEY }}
      ACCEPTANCE_VPS_SSH_PRIVATE_KEY: ${{ secrets.ACCEPTANCE_VPS_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-stable-publication-input
          path: verified
      - name: Publish unchanged drafts in the approved order and publicly verify them
        run: |
          set -euo pipefail
          printf '%s\n' prepublication > publication-stage
          manifest=verified/qualification-manifest.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" > approvals.json
          jq -e '[.[] | select(.state == "approved" and any(.environments[]; .name == "stable-publication"))] | length > 0' approvals.json >/dev/null
          jq -cS '[.[] | select(.state == "approved" and any(.environments[]; .name == "stable-publication"))][0] | {environments:[{name:"stable-publication"}],state:.state}' approvals.json > approval.json
          mkdir -m 0700 public publication-evidence rechecked

          collect_observation() {
            local action=$1 directory=$2 public=$3 tag commit release_id metadata asset name sha256 attestation latest_install_sha256 latest_release_id public_verification release_identity sequence
            tag="$(jq -r .tag <<<"$action")"
            commit="$(jq -r .commit <<<"$action")"
            release_id="$(jq -r .release_id <<<"$action")"
            metadata="$directory.metadata.json"
            mkdir -m 0700 "$directory"
            gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$metadata" || return 1
            printf '[]' > "$directory.assets.json"
            printf '[]' > "$directory.downloads.json"
            while read -r asset; do
              name="$(jq -r .name <<<"$asset")"
              if test "$public" = true; then
                curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$name" -o "$directory/$name" || return 1
              else
                gh api "repos/$GITHUB_REPOSITORY/releases/assets/$(jq -r .id <<<"$asset")" -H 'Accept: application/octet-stream' > "$directory/$name" || return 1
              fi
              sha256="$(jq -r .digest <<<"$asset")"
              jq -cS --arg name "$name" --arg sha256 "${sha256#sha256:}" --argjson id "$(jq -r .id <<<"$asset")" --argjson size "$(jq -r .size <<<"$asset")" '. + [{id:$id,name:$name,sha256:$sha256,size:$size}] | sort_by(.name)' "$directory.assets.json" > "$directory.assets.next"
              mv "$directory.assets.next" "$directory.assets.json"
              jq -cS --arg name "$name" --arg sha256 "$(sha256sum "$directory/$name" | cut -d' ' -f1)" --argjson size "$(stat -c %s "$directory/$name")" '. + [{name:$name,sha256:$sha256,size:$size}] | sort_by(.name)' "$directory.downloads.json" > "$directory.downloads.next"
              mv "$directory.downloads.next" "$directory.downloads.json"
            done < <(jq -c '.assets[]' "$metadata")
            release_identity="$(jq -cS --arg sha256 "$(sha256sum "$directory/release-index.json" | cut -d' ' -f1)" '{commit:.commit,release_index_sha256:$sha256,repository:.repository,tag:.tag}' "$directory/release-index.json")"
            sequence="$(jq -r .sequence "$directory/release-index.json")"
            latest_release_id=null
            if latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .id 2>/dev/null)"; then latest_release_id="$latest"; fi
            attestation=null
            latest_install_sha256=
            public_verification=null
            if test "$public" = true; then
              if gh api "repos/$GITHUB_REPOSITORY/attestations/sha1:$commit?predicate_type=release&per_page=100" > "$directory.attestation.json" 2>/dev/null; then
                attestation="$(jq -cS --arg commit "$commit" '{commit:$commit,count:(.attestations|length),initiator:(if (.attestations|length) == 1 then .attestations[0].initiator else "" end),predicate_type:"release"}' "$directory.attestation.json")"
              fi
              if curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.sh" -o "$directory.latest-install.sh"; then latest_install_sha256="$(sha256sum "$directory.latest-install.sh" | cut -d' ' -f1)"; fi
              go run ./cmd/sbxr-release verify-public-latest > "$directory.public-verification.json" || return 1
              public_verification="$(cat "$directory.public-verification.json")"
            fi
            jq -cnS --slurpfile assets "$directory.assets.json" --argjson attestation "$attestation" --slurpfile downloads "$directory.downloads.json" --arg latest_install_sha256 "$latest_install_sha256" --argjson latest_release_id "$latest_release_id" --slurpfile metadata "$metadata" --argjson public_verification "$public_verification" --argjson release_identity "$release_identity" --argjson sequence "$sequence" '{assets:$assets[0],attestation:$attestation,body:$metadata[0].body,commit:$metadata[0].target_commitish,downloads:$downloads[0],draft:$metadata[0].draft,immutable:($metadata[0].immutable // false),latest_install_sha256:$latest_install_sha256,latest_release_id:$latest_release_id,prerelease:$metadata[0].prerelease,public_verification:$public_verification,release_id:$metadata[0].id,release_identity:$release_identity,sequence:$sequence,tag:$metadata[0].tag_name}' | tr -d '\n'
          }

          verify_public_package() {
            local directory=$1 tag=$2
            go run ./cmd/sbxr-release verify-package -directory "$directory" -architecture amd64
            go run ./cmd/sbxr-release verify-package -directory "$directory" -architecture arm64
            if test "$(jq -r .mode verified/qualification-manifest.json)" = v3; then return; fi
            sudo bash "$directory/install.sh" > "$tag-install.transcript"
            grep -Fx 'SOFTWARE-LIFECYCLE-INSTALL-INSTALLED' "$tag-install.transcript"
            check_deadline=$((SECONDS + 600))
            while true; do
              if { sleep 1; printf '1\n'; sleep 15; printf '0\n'; } | script -qec 'sudo env TERM=xterm-256color LANG=C.UTF-8 /usr/local/bin/sbxr' /dev/null > "$tag-check.transcript" && grep -F 'Code: SOFTWARE-LIFECYCLE-CHECK-ALREADY-CURRENT' "$tag-check.transcript"; then
                break
              fi
              test "$SECONDS" -lt "$check_deadline"
              sleep 5
            done
            sudo rm -f /usr/local/bin/sbxr /run/lock/sbxr.lock
            sudo rm -r /var/lib/sbxr
          }

          printf 'null' > prior-verification-facts.json
          printf 'null' > prior-verification-decision.json
          for action_index in $(seq 0 "$(($(jq '.actions | length' verified/stable-preflight-decision.json) - 1))"); do
            preflight_action="$(jq -c ".actions[$action_index]" verified/stable-preflight-decision.json)"
            tag="$(jq -r .tag <<<"$preflight_action")"
            collect_observation "$preflight_action" "rechecked/$tag" false > stable-publication-observation.json
            prior_decision_sha256="$(sha256sum verified/stable-preflight-decision.json | cut -d' ' -f1)"
            if test "$action_index" -gt 0; then prior_decision_sha256="$(sha256sum prior-verification-decision.json | cut -d' ' -f1)"; fi
            jq -cnS --argjson action_index "$action_index" --slurpfile approval approval.json --slurpfile observation stable-publication-observation.json --arg observed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --slurpfile preflight_decision verified/stable-preflight-decision.json --slurpfile preflight_facts verified/stable-preflight-facts.json --arg prior_decision_sha256 "$prior_decision_sha256" --slurpfile prior_verification_decision prior-verification-decision.json --slurpfile prior_verification_facts prior-verification-facts.json '{action_index:$action_index,approval:$approval[0],observation:$observation[0],observed_at:$observed_at,preflight_decision:$preflight_decision[0],preflight_facts:$preflight_facts[0],prior_decision_sha256:$prior_decision_sha256,prior_verification_decision:$prior_verification_decision[0],prior_verification_facts:$prior_verification_facts[0],schema:"sbxr-release-qualification-facts-v1",stage:"stable-publication"}' | tr -d '\n' > stable-publication-facts.json
            mkdir -m 0700 "publication-evidence/$action_index"
            cp stable-publication-facts.json "publication-evidence/$action_index/"
            go run ./cmd/sbxr-release qualification < stable-publication-facts.json > stable-publication-decision.json
            cp stable-publication-decision.json "publication-evidence/$action_index/"
            facts_sha256="$(sha256sum stable-publication-facts.json | cut -d' ' -f1)"
            jq -e --arg facts_sha256 "$facts_sha256" --arg prior_decision_sha256 "$prior_decision_sha256" '.schema == "sbxr-release-qualification-decision-v1" and .stage == "stable-publication" and .outcome == "actions-required" and .facts_sha256 == $facts_sha256 and .prior_decision_sha256 == $prior_decision_sha256 and (.actions | length) == 1 and .actions[0].type == "publish-stable-release" and .actions[0].facts_sha256 == $facts_sha256 and .actions[0].prior_decision_sha256 == $prior_decision_sha256' stable-publication-decision.json >/dev/null
            action="$(jq -c .actions[0] stable-publication-decision.json)"
            jq -e '.draft == false and .immutable == true and .prerelease == false and .latest == true' <<<"$action" >/dev/null
            tag="$(jq -r .tag <<<"$action")"
            release_id="$(jq -r .release_id <<<"$action")"
            printf '%s\n' "$(jq -r .failure_reason <<<"$action")" > publication-stage
            jq -jr .body <<<"$action" | cmp - "verified/records/$tag.md"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -F draft=false -F prerelease=false -f make_latest=true >/dev/null
            for attempt in $(seq 1 60); do
              if collect_observation "$action" "public/$tag" true > stable-publication-verification-observation.next; then mv stable-publication-verification-observation.next stable-publication-verification-observation.json; else printf 'null' > stable-publication-verification-observation.json; fi
              prior_decision_sha256="$(sha256sum stable-publication-decision.json | cut -d' ' -f1)"
              jq -cnS --argjson attempt "$attempt" --slurpfile observation stable-publication-verification-observation.json --arg observed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg prior_decision_sha256 "$prior_decision_sha256" --slurpfile publication_decision stable-publication-decision.json --slurpfile publication_facts stable-publication-facts.json '{attempt:$attempt,observation:$observation[0],observed_at:$observed_at,prior_decision_sha256:$prior_decision_sha256,publication_decision:$publication_decision[0],publication_facts:$publication_facts[0],schema:"sbxr-release-qualification-facts-v1",stage:"stable-publication-verification"}' | tr -d '\n' > stable-publication-verification-facts.json
              cp stable-publication-verification-facts.json "publication-evidence/$action_index/attempt-$attempt-facts.json"
              go run ./cmd/sbxr-release qualification < stable-publication-verification-facts.json > stable-publication-verification-decision.json
              cp stable-publication-verification-decision.json "publication-evidence/$action_index/attempt-$attempt-decision.json"
              outcome="$(jq -r .outcome stable-publication-verification-decision.json)"
              if jq -e '.schema == "sbxr-release-qualification-decision-v1" and .stage == "stable-publication-verification" and .outcome == "accepted" and (.actions | length) == 0' stable-publication-verification-decision.json >/dev/null; then break; fi
              test "$outcome" = "propagation-pending"
              jq -e --arg prior_decision_sha256 "$prior_decision_sha256" --arg tag "$tag" '.actions | length == 1 and .[0].type == "observe-stable-release" and .[0].prior_decision_sha256 == $prior_decision_sha256 and .[0].tag == $tag' stable-publication-verification-decision.json >/dev/null
              sleep "$(jq -r .actions[0].wait_seconds stable-publication-verification-decision.json)"
            done
            test "$outcome" = accepted
            verify_public_package "public/$tag" "$tag"
            cp stable-publication-verification-facts.json prior-verification-facts.json
            cp stable-publication-verification-decision.json prior-verification-decision.json
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: stable-publication-decisions-${{ github.run_id }}
          path: publication-evidence
          if-no-files-found: ignore
          retention-days: 90

      - name: Prove stable B install, Check, and Update are exact no-ops
        run: |
          set -euo pipefail
          if test "$(jq -r .mode verified/qualification-manifest.json)" = v3; then
            printf '%s\n' v3-finalization-failure > publication-stage
            prior_decision_sha256="$(sha256sum prior-verification-decision.json | cut -d' ' -f1)"
            jq -cnS --arg observed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg prior_decision_sha256 "$prior_decision_sha256" --slurpfile publication_verification_decision prior-verification-decision.json --slurpfile publication_verification_facts prior-verification-facts.json '{observed_at:$observed_at,prior_decision_sha256:$prior_decision_sha256,publication_verification_decision:$publication_verification_decision[0],publication_verification_facts:$publication_verification_facts[0],schema:"sbxr-release-qualification-facts-v1",stage:"stable-v3-finalization"}' | tr -d '\n' > stable-v3-finalization-facts.json
            go run ./cmd/sbxr-release qualification < stable-v3-finalization-facts.json > stable-v3-finalization-decision.json
            facts_sha256="$(sha256sum stable-v3-finalization-facts.json | cut -d' ' -f1)"
            jq -e --arg facts_sha256 "$facts_sha256" --arg prior_decision_sha256 "$prior_decision_sha256" '.schema == "sbxr-release-qualification-decision-v1" and .stage == "stable-v3-finalization" and .outcome == "accepted" and .facts_sha256 == $facts_sha256 and .prior_decision_sha256 == $prior_decision_sha256 and .public_verification == "Passed" and .v3_packaged_live == "Passed" and .complete_removal == "Passed" and (.actions | length) == 0' stable-v3-finalization-decision.json >/dev/null
            exit 0
          fi
          printf '%s\n' stable-no-update-failure > publication-stage
          test -n "$ACCEPTANCE_VPS_HOST"
          test -n "$ACCEPTANCE_VPS_HOST_KEY"
          test -n "$ACCEPTANCE_VPS_SSH_PRIVATE_KEY"
          install -m 0600 /dev/null ssh.key
          printf '%s\n' "$ACCEPTANCE_VPS_SSH_PRIVATE_KEY" > ssh.key
          printf '%s %s\n' "$ACCEPTANCE_VPS_HOST" "$ACCEPTANCE_VPS_HOST_KEY" > known_hosts
          ssh_options=(-i "$PWD/ssh.key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$PWD/known_hosts" -o ConnectTimeout=15)
          original_session=
          cleanup() {
            status=$?
            set +e
            if test -n "$original_session"; then
              ssh "${ssh_options[@]}" "root@$ACCEPTANCE_VPS_HOST" 'rm -f /run/sbxr-stable-original-session' >/dev/null 2>&1 || true
              wait "$original_session" 2>/dev/null || true
            fi
            rm -f ssh.key known_hosts
            return "$status"
          }
          trap cleanup EXIT
          ssh "${ssh_options[@]}" "root@$ACCEPTANCE_VPS_HOST" 'touch /run/sbxr-stable-original-session; while test -e /run/sbxr-stable-original-session; do sleep 1; done' &
          original_session=$!
          sleep 1
          kill -0 "$original_session"
          ssh "${ssh_options[@]}" "root@$ACCEPTANCE_VPS_HOST" 'bash -se' > stable-no-update-observation.json <<'REMOTE'
          set -euo pipefail
          work="$(mktemp -d /run/sbxr-stable-no-update.XXXXXX)"
          trap 'rm -r -- "$work"' EXIT
          snapshot() {
            stat -c '%n:%u:%g:%a:%h:%F:%s' /usr/local/bin/sbxr /var/lib/sbxr /var/lib/sbxr/installed.json || return 1
            sha256sum /usr/local/bin/sbxr /var/lib/sbxr/installed.json || return 1
            find /var/lib/sbxr -xdev -printf '%P:%y:%u:%g:%m:%s\n' | sort || return 1
          }
          no_transaction_residue() {
            local path
            for path in /usr/local/bin/.sbxr-update-prior /usr/local/bin/.sbxr-update-candidate /var/lib/sbxr/.installed.json.prior /var/lib/sbxr/.installed.json.candidate /var/lib/sbxr/update.json /var/lib/sbxr/.update.json.next; do
              if test -e "$path" || test -L "$path"; then return 1; fi
            done
          }
          menu() {
            local choice=$1 output=$2 input fifo feeder
            input="$(mktemp -d /run/sbxr-stable-menu.XXXXXX)"
            fifo="$input/fifo"
            mkfifo -m 0600 "$fifo"
            { sleep 1; printf '%s\n' "$choice"; sleep 15; printf '0\n'; } >"$fifo" &
            feeder=$!
            script -qec 'env TERM=xterm-256color LANG=C.UTF-8 /usr/local/bin/sbxr' /dev/null <"$fifo" >"$output"
            kill "$feeder" 2>/dev/null || true
            wait "$feeder" 2>/dev/null || true
            rm -f "$fifo"
            rmdir "$input"
          }
          filesystem_layout_exact=false
          if test "$(find /var/lib/sbxr -mindepth 1 -maxdepth 1 -printf '%f\n' 2>/dev/null)" = installed.json; then filesystem_layout_exact=true; fi
          transaction_residue_absent=true
          no_transaction_residue || transaction_residue_absent=false
          mutation_lock_available=true
          flock -n /run/lock/sbxr.lock true || mutation_lock_available=false
          snapshots_complete=true
          snapshot > "$work/before.snapshot" || { : > "$work/before.snapshot"; snapshots_complete=false; }
          set +e
          curl -fsSL https://github.com/albertloky/SBXR/releases/latest/download/install.sh | sudo bash > "$work/install.transcript"
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          test "${pipeline_status[0]}" -eq 0
          install_exit="${pipeline_status[1]}"
          install_result="$(grep -aE '^SOFTWARE-LIFECYCLE-INSTALL-[A-Z-]+$' "$work/install.transcript" | tail -n1 || true)"
          test "$install_exit" -eq 0 || test -n "$install_result"
          no_transaction_residue || transaction_residue_absent=false
          flock -n /run/lock/sbxr.lock true || mutation_lock_available=false
          snapshot > "$work/after-install.snapshot" || { : > "$work/after-install.snapshot"; snapshots_complete=false; }
          menu 1 "$work/check.transcript"
          check_result="$(grep -aoE 'Code: SOFTWARE-LIFECYCLE-CHECK-[A-Z-]+' "$work/check.transcript" | sed 's/^Code: //' | tail -n1 || true)"
          no_transaction_residue || transaction_residue_absent=false
          flock -n /run/lock/sbxr.lock true || mutation_lock_available=false
          snapshot > "$work/after-check.snapshot" || { : > "$work/after-check.snapshot"; snapshots_complete=false; }
          menu 2 "$work/update.transcript"
          update_result="$(grep -aoE 'Code: SOFTWARE-LIFECYCLE-UPDATE-[A-Z-]+' "$work/update.transcript" | sed 's/^Code: //' | tail -n1 || true)"
          no_transaction_residue || transaction_residue_absent=false
          flock -n /run/lock/sbxr.lock true || mutation_lock_available=false
          snapshot > "$work/after-update.snapshot" || { : > "$work/after-update.snapshot"; snapshots_complete=false; }
          before="$(sha256sum "$work/before.snapshot" | cut -d' ' -f1)"
          installed_record="$(jq -c . /var/lib/sbxr/installed.json 2>/dev/null || printf null)"
          jq -cnS --arg before "$before" --arg after_install "$(sha256sum "$work/after-install.snapshot" | cut -d' ' -f1)" --arg after_check "$(sha256sum "$work/after-check.snapshot" | cut -d' ' -f1)" --arg after_update "$(sha256sum "$work/after-update.snapshot" | cut -d' ' -f1)" --arg check_result "$check_result" --arg executable_sha256 "$(sha256sum /usr/local/bin/sbxr 2>/dev/null | cut -d' ' -f1 || true)" --argjson filesystem_layout_exact "$filesystem_layout_exact" --arg install_result "$install_result" --argjson installed_record "$installed_record" --argjson mutation_lock_available "$mutation_lock_available" --argjson snapshots_complete "$snapshots_complete" --argjson transaction_residue_absent "$transaction_residue_absent" --arg update_result "$update_result" '{after_check_snapshot_sha256:$after_check,after_install_snapshot_sha256:$after_install,after_update_snapshot_sha256:$after_update,before_snapshot_sha256:$before,check_result:$check_result,executable_sha256:$executable_sha256,filesystem_layout_exact:$filesystem_layout_exact,install_result:$install_result,installed_record:$installed_record,mutation_lock_available:$mutation_lock_available,snapshots_complete:$snapshots_complete,ssh_continuity:false,transaction_residue_absent:$transaction_residue_absent,update_result:$update_result}'
          REMOTE
          kill -0 "$original_session"
          ssh "${ssh_options[@]}" "root@$ACCEPTANCE_VPS_HOST" 'rm -f /run/sbxr-stable-original-session'
          wait "$original_session"
          original_session=
          prior_decision_sha256="$(sha256sum prior-verification-decision.json | cut -d' ' -f1)"
          jq -cnS --slurpfile observation stable-no-update-observation.json --arg observed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg prior_decision_sha256 "$prior_decision_sha256" --slurpfile publication_verification_decision prior-verification-decision.json --slurpfile publication_verification_facts prior-verification-facts.json '{observation:($observation[0] + {ssh_continuity:true}),observed_at:$observed_at,prior_decision_sha256:$prior_decision_sha256,publication_verification_decision:$publication_verification_decision[0],publication_verification_facts:$publication_verification_facts[0],schema:"sbxr-release-qualification-facts-v1",stage:"stable-no-update"}' | tr -d '\n' > stable-no-update-facts.json
          go run ./cmd/sbxr-release qualification < stable-no-update-facts.json > stable-no-update-decision.json
          facts_sha256="$(sha256sum stable-no-update-facts.json | cut -d' ' -f1)"
          jq -e --arg facts_sha256 "$facts_sha256" --arg prior_decision_sha256 "$prior_decision_sha256" '.schema == "sbxr-release-qualification-decision-v1" and .stage == "stable-no-update" and .outcome == "accepted" and .facts_sha256 == $facts_sha256 and .prior_decision_sha256 == $prior_decision_sha256 and .public_verification == "Passed" and .stable_no_update == "Passed" and (.actions | length) == 0' stable-no-update-decision.json >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: stable-no-update-observation-${{ github.run_id }}
          path: |
            stable-no-update-observation.json
            stable-no-update-facts.json
            stable-no-update-decision.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Retain public stable evidence
        run: |
          set -euo pipefail
          mkdir -m 0700 stable-evidence
          cp verified/qualification-manifest.json stable-evidence/
          cp -R public stable-evidence/
          if test "$(jq -r .mode verified/qualification-manifest.json)" = v3; then
            cp stable-v3-finalization-facts.json stable-v3-finalization-decision.json stable-evidence/
            jq -nS --arg schema sbxr-stable-publication-evidence-v1 --arg workflow "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --arg qualification "$(jq -r .workflow.run_url verified/qualification-manifest.json)" --arg latest "$(jq -r '.releases[-1].tag' verified/qualification-manifest.json)" --arg facts_sha256 "$(sha256sum stable-v3-finalization-facts.json | cut -d' ' -f1)" --arg decision_sha256 "$(sha256sum stable-v3-finalization-decision.json | cut -d' ' -f1)" --arg prior_decision_sha256 "$(jq -r .prior_decision_sha256 stable-v3-finalization-decision.json)" '{schema:$schema,workflow_run:$workflow,qualification_run:$qualification,latest_tag:$latest,public_verification:"Passed",v3_packaged_live:"Passed",complete_removal:"Passed",finalization_facts_sha256:$facts_sha256,finalization_decision_sha256:$decision_sha256,prior_decision_sha256:$prior_decision_sha256,secret_safe_result:"Passed"}' > stable-evidence/result.json
          else
            cp stable-no-update-facts.json stable-no-update-decision.json stable-evidence/
            jq -nS --arg schema sbxr-stable-publication-evidence-v1 --arg workflow "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --arg qualification "$(jq -r .workflow.run_url verified/qualification-manifest.json)" --arg latest "$(jq -r '.releases[-1].tag' verified/qualification-manifest.json)" --arg public_verification "$(jq -r .public_verification stable-no-update-decision.json)" --arg stable_no_update "$(jq -r .stable_no_update stable-no-update-decision.json)" --arg stable_no_update_facts_sha256 "$(sha256sum stable-no-update-facts.json | cut -d' ' -f1)" --arg stable_no_update_decision_sha256 "$(sha256sum stable-no-update-decision.json | cut -d' ' -f1)" --arg prior_decision_sha256 "$(jq -r .prior_decision_sha256 stable-no-update-decision.json)" '{schema:$schema,workflow_run:$workflow,qualification_run:$qualification,latest_tag:$latest,public_verification:$public_verification,stable_no_update:$stable_no_update,stable_no_update_facts_sha256:$stable_no_update_facts_sha256,stable_no_update_decision_sha256:$stable_no_update_decision_sha256,prior_decision_sha256:$prior_decision_sha256,secret_safe_result:"Passed"}' > stable-evidence/result.json
          fi
          if grep -aERq 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|Authorization: Bearer ' stable-evidence; then exit 1; elif test $? -ne 1; then exit 1; fi
          cat stable-evidence/result.json >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' complete > publication-stage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stable-publication-${{ github.run_id }}
          path: stable-evidence
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: stable-publication-stage
          path: publication-stage
          if-no-files-found: ignore
          retention-days: 90

  finalize-failure:
    if: always() && (inputs.operation == 'abandon' || needs.preflight.result != 'success' || needs.publish.result != 'success')
    needs: [preflight, publish]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - name: Recheck the signed qualification and obtain the failure decision
        id: failure
        run: |
          set -euo pipefail
          printf '%s\n' "$QUALIFICATION_RUN_ID" | grep -Eq '^[1-9][0-9]*$'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN_ID" > candidate-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > stable-run.json
          mkdir -m 0700 failure failure/burned failure/rechecked
          gh run download "$QUALIFICATION_RUN_ID" --repo "$GITHUB_REPOSITORY" --name signed-qualification-manifest --dir failure
          manifest=failure/qualification-manifest.json
          gh attestation verify "$manifest" --repo "$GITHUB_REPOSITORY" --signer-workflow albertloky/SBXR/.github/workflows/candidate.yml --source-ref refs/heads/main --source-digest "$(jq -r .head_sha candidate-run.json)" >/dev/null
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch --force --tags origin
          git merge-base --is-ancestor "$(jq -r .workflow.commit "$manifest")" "$(jq -r .head_sha stable-run.json)"
          for burned_tag in $(git tag --list 'release-burned/*'); do git tag -l --format='%(contents)' "$burned_tag"; done | jq -s 'sort_by(.original_tag)' > failure/burned.json
          printf '[]' > failure/observations.json
          while read -r release; do
            tag="$(jq -r .tag <<<"$release")"
            commit="$(jq -r .commit <<<"$release")"
            release_id="$(jq -r .release_id <<<"$release")"
            printf '%s\n' "$release" > "failure/$tag.json"
            tag_commit=null
            if object="$(git rev-parse -q --verify "refs/tags/$tag^{commit}")"; then test "$object" = "$commit"; tag_commit="$(jq -cn --arg commit "$object" '$commit')"; fi
            if gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" >/dev/null 2>&1; then
              .github/scripts/recheck-qualified-release.sh "failure/$tag.json" "failure/rechecked/$tag" failure/release.json
              publicly_verified=false
              if test "$tag_commit" != null && jq -e '.draft == false and .prerelease == false and (.immutable // false) == true' failure/release.json >/dev/null && gh api "repos/$GITHUB_REPOSITORY/attestations/sha1:$commit?predicate_type=release&per_page=100" --jq 'select((.attestations | length) == 1 and .attestations[0].initiator == "github")' >/dev/null 2>&1; then
                public_valid=true
                mkdir -p -m 0700 "failure/public/$tag"
                while read -r asset; do
                  name="$(jq -r .name <<<"$asset")"
                  if ! curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$name" -o "failure/public/$tag/$name" || test "$(sha256sum "failure/public/$tag/$name" | cut -d' ' -f1)" != "$(jq -r .sha256 <<<"$asset")"; then public_valid=false; fi
                done < <(jq -c '.assets[]' <<<"$release")
                if test "$public_valid" = true; then publicly_verified=true; fi
              fi
              observation="$(jq -cnS --argjson expected "$release" --slurpfile actual failure/release.json --argjson publicly_verified "$publicly_verified" --argjson tag_commit "$tag_commit" '{assets:$expected.assets,body:$actual[0].body,commit:$expected.commit,draft:$actual[0].draft,immutable:($actual[0].immutable // false),prerelease:$actual[0].prerelease,publicly_verified:$publicly_verified,release_id:$expected.release_id,release_identity:$expected.release_identity,release_present:true,sequence:$expected.sequence,tag:$expected.tag,tag_commit:$tag_commit}')"
            else
              observation="$(jq -cnS --argjson expected "$release" --argjson tag_commit "$tag_commit" '{assets:[],body:"",commit:$expected.commit,draft:false,immutable:false,prerelease:false,publicly_verified:false,release_id:$expected.release_id,release_identity:$expected.release_identity,release_present:false,sequence:$expected.sequence,tag:$expected.tag,tag_commit:$tag_commit}')"
            fi
            jq -cS --argjson observation "$observation" '. + [$observation]' failure/observations.json > failure/observations.next
            mv failure/observations.next failure/observations.json
          done < <(jq -c '.releases[]' "$manifest")
          publication_stage=prepublication-failure
          if gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name stable-publication-stage --dir failure/stage 2>/dev/null; then publication_stage="$(cat failure/stage/publication-stage)"; fi
          jq -cnS --slurpfile burned failure/burned.json --slurpfile candidate candidate-run.json --slurpfile finalization stable-run.json --slurpfile manifest "$manifest" --slurpfile observations failure/observations.json --arg observed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg operation '${{ inputs.operation }}' --arg publication_stage "$publication_stage" '{burned_identities:$burned[0],candidate_commit_ancestor:true,candidate_run:{conclusion:$candidate[0].conclusion,created_at:$candidate[0].created_at,event:$candidate[0].event,head_sha:$candidate[0].head_sha,id:($candidate[0].id|tostring),path:$candidate[0].path},finalization_run:{created_at:$finalization[0].created_at,head_sha:$finalization[0].head_sha,id:($finalization[0].id|tostring),path:$finalization[0].path,url:$finalization[0].html_url},manifest_attested:true,observations:$observations[0],observed_at:$observed_at,operation:$operation,publication_stage:$publication_stage,schema:"sbxr-release-qualification-facts-v1",signed_manifest:$manifest[0],stage:"stable-failure-finalization"}' | tr -d '\n' > failure/stable-failure-facts.json
          go run ./cmd/sbxr-release qualification < failure/stable-failure-facts.json > failure/stable-failure-decision.json
          facts_sha256="$(sha256sum failure/stable-failure-facts.json | cut -d' ' -f1)"
          prior_decision_sha256="$(sha256sum "$manifest" | cut -d' ' -f1)"
          jq -e --arg facts_sha256 "$facts_sha256" --arg prior_decision_sha256 "$prior_decision_sha256" '.schema == "sbxr-release-qualification-decision-v1" and .stage == "stable-failure-finalization" and (.outcome == "withdraw" or .outcome == "failed-prerelease") and .facts_sha256 == $facts_sha256 and .prior_decision_sha256 == $prior_decision_sha256 and (.actions | length) > 0 and all(.actions[]; .type == "finalize-stable-failure" and .facts_sha256 == $facts_sha256 and .prior_decision_sha256 == $prior_decision_sha256 and .reason == $reason)' --arg reason "$(jq -r .reason failure/stable-failure-decision.json)" failure/stable-failure-decision.json >/dev/null
          : > failure/burn-refs
          while read -r action; do
            tag="$(jq -r .tag <<<"$action")"
            commit="$(jq -r .commit <<<"$action")"
            jq -S .burn <<<"$action" > "failure/burned/$tag.json"
            if jq -e .burn_required <<<"$action" >/dev/null; then .github/scripts/prepare-burn-tag.sh "failure/burned/$tag.json" "$tag" "$commit" >> failure/burn-refs; else .github/scripts/prepare-burn-tag.sh "failure/burned/$tag.json" "$tag" "$commit" >/dev/null; fi
          done < <(jq -c '.actions[]' failure/stable-failure-decision.json)
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-path: failure/burned/*.json
      - name: Publish the complete attested burned ledger atomically
        run: |
          set -euo pipefail
          mapfile -t refs < <(sed '/^$/d' failure/burn-refs)
          test "${#refs[@]}" -eq 0 || git push --atomic origin "${refs[@]}"
      - name: Perform only the decided failure actions
        run: |
          set -euo pipefail
          while read -r action; do
            tag="$(jq -r .tag <<<"$action")"
            release_id="$(jq -r .release_id <<<"$action")"
            commit="$(jq -r .commit <<<"$action")"
            .github/scripts/prepare-burn-tag.sh "failure/burned/$tag.json" "$tag" "$commit" >/dev/null
            if jq -e .publish_failed_prerelease <<<"$action" >/dev/null; then
              .github/scripts/recheck-qualified-release.sh "failure/$tag.json" "failure/final/$tag" failure/final-release.json
              jq -e '.draft == true and .prerelease == false' failure/final-release.json >/dev/null
              jq -jr .body <<<"$action" > "failure/$tag.failed.md"
              gh release edit "$tag" --notes-file "failure/$tag.failed.md" --draft=false --prerelease --latest=false
            fi
            if jq -e .delete_release <<<"$action" >/dev/null; then
              .github/scripts/recheck-qualified-release.sh "failure/$tag.json" "failure/final/$tag" failure/final-release.json
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id"
            fi
            if jq -e .delete_tag <<<"$action" >/dev/null; then
              test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$commit"
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag"
            fi
          done < <(jq -c '.actions[]' failure/stable-failure-decision.json)
      - name: Verify the observed stable failure transition
        if: always()
        run: |
          set -euo pipefail
          git fetch --force --prune --prune-tags --tags origin
          printf '[]' > failure/verified-burns.json
          printf '[]' > failure/verified-observations.json
          while read -r action; do
            tag="$(jq -r .tag <<<"$action")"
            release_id="$(jq -r .release_id <<<"$action")"
            expected_burn="$(jq -cS .burn <<<"$action")"
            actual_burn="$(git tag -l --format='%(contents)' "release-burned/$tag" | jq -cS .)"
            test "$actual_burn" = "$expected_burn"
            jq -cS --argjson burn "$actual_burn" '. + [$burn] | sort_by(.original_tag)' failure/verified-burns.json > failure/verified-burns.next
            mv failure/verified-burns.next failure/verified-burns.json
            tag_commit=null
            if object="$(git rev-parse -q --verify "refs/tags/$tag^{commit}")"; then tag_commit="$(jq -cn --arg commit "$object" '$commit')"; fi
            if gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" >/dev/null 2>&1; then
              .github/scripts/recheck-qualified-release.sh "failure/$tag.json" "failure/verified/$tag" failure/verified-release.json
              observation="$(jq -cnS --argjson expected "$action" --slurpfile actual failure/verified-release.json --argjson tag_commit "$tag_commit" '{assets:$expected.assets,body:$actual[0].body,commit:$expected.commit,draft:$actual[0].draft,immutable:($actual[0].immutable // false),prerelease:$actual[0].prerelease,publicly_verified:false,release_id:$expected.release_id,release_identity:$expected.release_identity,release_present:true,sequence:$expected.sequence,tag:$expected.tag,tag_commit:$tag_commit}')"
            else
              observation="$(jq -cnS --argjson expected "$action" --argjson tag_commit "$tag_commit" '{assets:[],body:"",commit:$expected.commit,draft:false,immutable:false,prerelease:false,publicly_verified:false,release_id:$expected.release_id,release_identity:$expected.release_identity,release_present:false,sequence:$expected.sequence,tag:$expected.tag,tag_commit:$tag_commit}')"
            fi
            jq -cS --argjson observation "$observation" '. + [$observation]' failure/verified-observations.json > failure/verified-observations.next
            mv failure/verified-observations.next failure/verified-observations.json
          done < <(jq -c '.actions[]' failure/stable-failure-decision.json)
          jq -cnS --slurpfile burned failure/verified-burns.json --slurpfile decision failure/stable-failure-decision.json --slurpfile facts failure/stable-failure-facts.json --slurpfile observations failure/verified-observations.json '{burned_identities:$burned[0],failure_decision:$decision[0],failure_facts:$facts[0],observations:$observations[0],schema:"sbxr-release-qualification-facts-v1",stage:"stable-failure-verification"}' | tr -d '\n' > failure/stable-failure-verification-facts.json
          go run ./cmd/sbxr-release qualification < failure/stable-failure-verification-facts.json > failure/stable-failure-verification-decision.json
          facts_sha256="$(sha256sum failure/stable-failure-verification-facts.json | cut -d' ' -f1)"
          prior_decision_sha256="$(sha256sum failure/stable-failure-decision.json | cut -d' ' -f1)"
          jq -e --arg facts_sha256 "$facts_sha256" --arg prior_decision_sha256 "$prior_decision_sha256" '.schema == "sbxr-release-qualification-decision-v1" and .stage == "stable-failure-verification" and .outcome == "accepted" and .actions == [] and .facts_sha256 == $facts_sha256 and .prior_decision_sha256 == $prior_decision_sha256' failure/stable-failure-verification-decision.json >/dev/null
