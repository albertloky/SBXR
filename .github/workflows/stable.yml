name: Verify stable installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact qualified stable tag
        required: true
        type: string

permissions:
  attestations: read
  contents: read

jobs:
  verify-stable:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Reverify the exact qualified stable identity
        run: |
          curl -fsSL "https://api.github.com/repos/albertloky/SBXR/releases/tags/$RELEASE_TAG" -o release.json
          curl -fsSL "https://api.github.com/repos/albertloky/SBXR/releases/latest" -o latest.json
          jq -e --arg tag "$RELEASE_TAG" '.tag_name == $tag and .immutable == true and .draft == false and .prerelease == false and (.target_commitish | test("^[0-9a-f]{40}$"))' release.json
          test "$(jq -r .id release.json)" = "$(jq -r .id latest.json)"
          test "$(jq '.assets | length' release.json)" = 6
          test "$(jq -r '.assets[].name' release.json | sort)" = "$(printf '%s\n' install.sh release-index.json sbxr-components-linux-amd64.tar.gz sbxr-components-linux-arm64.tar.gz sbxr-linux-amd64.tar.gz sbxr-linux-arm64.tar.gz | sort)"
          jq -r .body release.json > acceptance-record.md
          grep -Fx 'Status: Qualified - installer-only automated exception' acceptance-record.md
          grep -Fx 'No live VPS, provider, maintained-client, or Owner evidence was performed.' acceptance-record.md
          go run ./cmd/sbxr-release verify -tag "$RELEASE_TAG"
      - name: Prove latest and pinned commands select the same exact bootstrap
        run: |
          curl -fsSL https://github.com/albertloky/SBXR/releases/latest/download/install.sh -o latest-install.sh
          curl -fsSL "https://github.com/albertloky/SBXR/releases/download/$RELEASE_TAG/install.sh" -o pinned-install.sh
          cmp latest-install.sh pinned-install.sh
          test "sha256:$(sha256sum latest-install.sh | cut -d ' ' -f 1)" = "$(jq -r '.assets[] | select(.name == "install.sh") | .digest' release.json)"
      - name: Download and scan the unchanged six public assets
        run: |
          mkdir -m 0700 dist
          for asset in install.sh release-index.json sbxr-linux-amd64.tar.gz sbxr-linux-arm64.tar.gz sbxr-components-linux-amd64.tar.gz sbxr-components-linux-arm64.tar.gz; do
            curl -fsSL "https://github.com/albertloky/SBXR/releases/download/$RELEASE_TAG/$asset" -o "dist/$asset"
          done
          test "$(find dist -type f | wc -l)" -eq 6
          commit="$(jq -r .target_commitish release.json)"
          jq -e --arg tag "$RELEASE_TAG" --arg commit "$commit" '.repository == "albertloky/SBXR" and .tag == $tag and .commit == $commit' dist/release-index.json
          index_sha256="$(sha256sum dist/release-index.json | cut -d ' ' -f 1)"
          grep -Fx "Release index SHA-256: $index_sha256" acceptance-record.md
          pattern='SECRET-MARKER|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|Authorization: Bearer '
          test -z "$(rg -a -l "$pattern" dist/install.sh dist/release-index.json acceptance-record.md)"
          for archive in dist/sbxr-linux-amd64.tar.gz dist/sbxr-linux-arm64.tar.gz dist/sbxr-components-linux-amd64.tar.gz dist/sbxr-components-linux-arm64.tar.gz; do
            test -z "$(tar -xOzf "$archive" | rg -a -l "$pattern" -)"
          done
      - name: Run the ordinary public command to the non-root Owner Console
        env:
          SBXR_STABLE_TAG: ${{ inputs.tag }}
        run: |
          test ! -e /usr/local/bin/sbxr
          test ! -e /var/lib/sbxr
          python3 .github/workflows/stable_bootstrap.py
          grep -F 'SBXR bootstrap: launching Owner Console' bootstrap-transcript.txt
          grep -F 'Not installed' bootstrap-transcript.txt
          test ! -e /usr/local/bin/sbxr
          test ! -e /var/lib/sbxr
          pattern='SECRET-MARKER|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|Authorization: Bearer '
          test -z "$(rg -a -l "$pattern" bootstrap-transcript.txt)"
      - name: Record stable publication evidence
        run: |
          index_sha256="$(sha256sum dist/release-index.json | cut -d ' ' -f 1)"
          {
            echo '## Stable installer publication'
            echo
            echo "Release Identity: albertloky/SBXR $RELEASE_TAG $(jq -r .target_commitish release.json) $index_sha256"
            echo 'Public verifier: Passed'
            echo 'Latest and pinned install.sh equality: Passed'
            echo 'Supported Ubuntu Owner Console launch: Passed'
            echo 'Cloudflare/provider evidence: Not performed'
          } >> "$GITHUB_STEP_SUMMARY"
