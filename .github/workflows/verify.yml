name: Verify

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -race ./...
      - run: go vet ./...

  network-policy-ubuntu-seam:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: sudo apt-get update && sudo apt-get install --yes nftables
      - run: sudo env "PATH=$PATH" go test ./internal/networkpolicy/adapter/ubuntu -run TestProductionUbuntuSeam -v
