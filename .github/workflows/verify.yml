name: Verify

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Run the complete suite with the PTY package isolated
        run: |
          go list ./... | grep -v '/internal/ownerconsole$' | xargs go test -count=1
          go test ./internal/ownerconsole -count=1
      - name: Race-test every non-PTY package
        run: go list ./... | grep -v '/internal/ownerconsole$' | xargs go test -race -count=1
      - run: go vet ./...

  network-policy-ubuntu-seam:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: sudo apt-get update && sudo apt-get install --yes nftables
      - run: sudo env "PATH=$PATH" go test ./internal/networkpolicy/adapter/ubuntu -run TestProductionUbuntuSeam -v

  system-changes-ubuntu-seam:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: sudo apt-get update && sudo apt-get install --yes iproute2 nftables
      - run: sudo env "PATH=$PATH" SBXR_CONTROLLED_FIREWALL_SEAM=1 go test ./internal/systemchanges/adapter/ubuntu -run TestProductionFirewallSeam -v
