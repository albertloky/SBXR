name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-installer-updater:
    strategy:
      fail-fast: true
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Test current Installer-Updater seams
        run: |
          lifecycle_tests='^(TestStatus|TestUpdate(Returns|RefusesConcurrent|FailureAfter|RestoresPrior|RetainsRecovery|DefersCancellation|InstallsFresh)|TestRollbackRefuses|TestCandidateRecover|TestRecover|TestPendingOperations|TestCheck)'
          github_tests='^(TestSourceCheck|TestSigstoreVerifier)'
          go test ./internal/softwarelifecycle -run "$lifecycle_tests" -count=1
          go test ./internal/softwarelifecycle/adapter/github -run "$github_tests" -count=1
          go test ./internal/proxyinstallation/adapter/terminal -count=1
          go test ./cmd/sbxr-release -count=1
          go test ./... -count=1
          go test -race ./internal/softwarelifecycle -run "$lifecycle_tests" -count=1
          go test -race ./internal/softwarelifecycle/adapter/github -run "$github_tests" -count=1
          go test -race ./cmd/sbxr-release -count=1
          go test -race ./... -count=1
          go vet ./...
      - name: Build and verify the exact four release assets
        env:
          RELEASE_TAG: v2.0.0
          RELEASE_SEQUENCE: "17"
        run: |
          mkdir -m 0700 dist inspect
          for architecture in amd64 arm64; do
            go run ./cmd/sbxr-release \
              -tag "$RELEASE_TAG" \
              -commit "$GITHUB_SHA" \
              -sequence "$RELEASE_SEQUENCE" \
              -architecture "$architecture" \
              -output "dist/sbxr-linux-$architecture.tar.gz"
          done
          amd64_sha256="$(tar -xOzf dist/sbxr-linux-amd64.tar.gz sbxr | sha256sum | cut -d ' ' -f1)"
          arm64_sha256="$(tar -xOzf dist/sbxr-linux-arm64.tar.gz sbxr | sha256sum | cut -d ' ' -f1)"
          go run ./cmd/sbxr-release bootstrap \
            -version 2.0.0 \
            -tag "$RELEASE_TAG" \
            -commit "$GITHUB_SHA" \
            -sequence "$RELEASE_SEQUENCE" \
            -amd64-executable-sha256 "$amd64_sha256" \
            -arm64-executable-sha256 "$arm64_sha256" \
            -output dist/install.sh
          go run ./cmd/sbxr-release index \
            -tag "$RELEASE_TAG" \
            -commit "$GITHUB_SHA" \
            -sequence "$RELEASE_SEQUENCE" \
            -directory dist \
            -output dist/release-index.json
          test "$(find dist -maxdepth 1 -type f -printf '%f\n' | sort)" = "$(printf '%s\n' install.sh release-index.json sbxr-linux-amd64.tar.gz sbxr-linux-arm64.tar.gz | sort)"
          go run ./cmd/sbxr-release verify-package -directory dist -architecture '${{ matrix.architecture }}'
          test "$(tar -tzf 'dist/sbxr-linux-${{ matrix.architecture }}.tar.gz')" = sbxr
          tar -xzf 'dist/sbxr-linux-${{ matrix.architecture }}.tar.gz' -C inspect
          machine="$(readelf -h inspect/sbxr | sed -n 's/^  Machine: *//p')"
          case '${{ matrix.architecture }}' in
            amd64) test "$machine" = 'Advanced Micro Devices X86-64' ;;
            arm64) test "$machine" = 'AArch64' ;;
          esac
      - name: Exercise the packaged production command and menu
        run: |
          if inspect/sbxr >non-root.out 2>non-root.err; then
            exit 1
          fi
          test ! -s non-root.out
          grep -Fx 'SBXR requires root authority.' non-root.err
          printf '0\n' | script -qec "sudo env TERM=xterm-256color LANG=C.UTF-8 '$PWD/inspect/sbxr'" menu.transcript
          grep -F 'SBXR V3' menu.transcript
          grep -F 'Proxy status: Not set up' menu.transcript
          grep -F 'Start setup' menu.transcript
          grep -F 'View details' menu.transcript
          grep -F 'Complete removal' menu.transcript
          grep -F 'Exit' menu.transcript
          index_sha256="$(sha256sum dist/release-index.json | cut -d ' ' -f1)"
          executable_sha256="$(sha256sum inspect/sbxr | cut -d ' ' -f1)"
          sudo install -m 0755 inspect/sbxr /usr/local/bin/sbxr
          sudo install -d -m 0700 /var/lib/sbxr
          printf '{"schema":1,"repository":"albertloky/SBXR","tag":"v2.0.0","commit":"%s","release_index_sha256":"%s","sequence":17,"architecture":"%s","executable_sha256":"%s"}\n' "$GITHUB_SHA" "$index_sha256" '${{ matrix.architecture }}' "$executable_sha256" | sudo tee /var/lib/sbxr/installed.json >/dev/null
          sudo chmod 0600 /var/lib/sbxr/installed.json
          printf '0\n' | script -qec "sudo env TERM=xterm-256color LANG=C.UTF-8 /usr/local/bin/sbxr" ready.transcript
          grep -F 'Version: v2.0.0' ready.transcript
          grep -F 'Proxy status: Not set up' ready.transcript
          grep -F 'PROXY-INSTALLATION-STATUS-NOT-SET-UP' ready.transcript
          sudo rm /usr/local/bin/sbxr
          sudo rm -r /var/lib/sbxr
      - name: Refuse secret markers from package surfaces
        env:
          SECRET_PATTERN: 'SBXR_USER_TOKEN_MARKER_00000000000000abcd|CLOUDFLARE-ROTATED-RUN-TOKEN-MARKER|profile-secret-marker|subscription-secret-marker|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|Authorization: Bearer '
        run: |
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          if grep -aERq "$SECRET_PATTERN" dist inspect non-root.out non-root.err menu.transcript ready.transcript concurrent.transcript "$summary"; then
            exit 1
          elif test $? -ne 1; then
            exit 1
          fi
