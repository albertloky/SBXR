[package]
name = "sbxr"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
rustix = { version = "=1.1.5", features = ["fs", "process", "net", "event"] }
httparse = "=1.10.1"
subtle = "=2.6.1"
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }
getrandom = "=0.3.4"
base64 = "=0.22.1"
zeroize = "=1.8.2"
rustls = { version = "=0.23.45", default-features = false, features = ["std", "ring"] }
rustls-pemfile = "=2.2.0"
sigstore-verify = { version = "=0.15.1", default-features = false, features = ["aws-lc-rs"] }
snap = "=1.1.2"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
webpki-roots = "=1.0.11"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "hickory-dns", "stream"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "net", "time", "macros"] }

[lints.rust]
unsafe_code = "forbid"
